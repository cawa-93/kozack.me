<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" width="8" height="8">
<!-- cloth/check — клітинка: смуги 3 в обидва боки другим тоном, перехрестя темніше.
size 8×8; pivot (0, 0) — кут; плитка край у край: правий край продовжує лівий, нижній — верхній (art/STYLE.md, «cloth»).
