<!-- person/hood/hoodie/back — капюшон худі, ракурс back (¾ ззаду).
size 48×58; pivot (27, 58) — таз (клаптик торса person/torso/1 від (2, -4)); points: немає.
Шари: fill-top, ink.
Спереду (слот за торсом) — капюшон зібраний за шиєю: між головою й ближнім плечем видно його горб і край; решту ховають голова, шия й плечі. Ззаду (слот поверх торса) — капюшон на спині лише контуром і лініями краю: колір, шов, тінь і плями — торса під ним, тож плями на спині лишаються видимими.
-->
