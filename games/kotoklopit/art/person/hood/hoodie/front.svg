size 41×51; pivot (20, 51) — таз (клаптик торса person/torso/1 від (9, 3)); points: немає.
Шари: ink.
Ззаду (слот поверх торса) — капюшон на спині лише контуром і лініями краю: колір, шов, тінь і плями — торса під ним, тож плями на спині лишаються видимими. Спереду капюшон за шиєю ховають голова й плечі: його показує край на шиї (person/top-front/hoodie), тож кадр порожній.
