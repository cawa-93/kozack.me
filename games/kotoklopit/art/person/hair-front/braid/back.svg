<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 70" width="56" height="70">
<!-- person/hair-front/braid/back — коса на плече, передня частина: гладко зачесане з проділом, коса з-за ближнього вуха через плече на груди, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 56×70; pivot (28, 44) — шия, як у person/head/*; points: top (28.5, 2.5).
Шари: fill-hair, shade, ink.
Коса лежить на грудях між ближньою рукою й шиєю; гумка — `ink`, кінчик — пензликом; лоб відкритий.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
