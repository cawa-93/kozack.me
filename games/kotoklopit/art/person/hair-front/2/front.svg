<!-- person/hair-front/2/front — хвостик, передня частина: гладко зачесано назад до хвоста, лінія росту волосся вища на скронях, з м'яким кутом посередині лоба, ракурс front (¾ спереду). A10, рукою еталонів F1b (art/STYLE.md).
size 64×70; pivot (32, 46) — шия, як у person/head/*; points: top (32.5, 4.5).
Шари: fill-hair, shade, ink.
Лінія росту волосся — inner (волосся лежить на шкірі), силует — outer; лінія на висоті чубчиків інших зачісок, тож закриває смугу тіні на лобі голови. Лінзи — пасма, зачесані від лінії росту назад до хвоста за потилицею; тінь soft — ззаду над вухом.
-->
