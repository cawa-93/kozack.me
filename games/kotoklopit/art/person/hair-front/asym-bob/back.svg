<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 59 59" width="59" height="59">
<!-- person/hair-front/asym-bob/back — асиметричне каре, передня частина: ближнє пасмо до плеча, дальнє — до щелепи, косий чубчик з глибокого проділу, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 59×59; pivot (30, 44) — шия, як у person/head/*; points: top (30.5, 2.5).
Шари: fill-hair, fill-accent, shade, ink.
Чубчик над бровами; акцент — нижній шар по краю зрізу.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="fill-accent"/>
<g id="shade"/>
<g id="ink"/>
</svg>
