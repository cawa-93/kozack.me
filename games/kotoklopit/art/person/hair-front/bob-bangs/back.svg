<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 59 54" width="59" height="54">
<!-- person/hair-front/bob-bangs/back — каре з чубчиком, передня частина: рівний чубчик над бровами, пасма до підборіддя, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 59×54; pivot (30, 44) — шия, як у person/head/*; points: top (30.5, 2.5).
Шари: fill-hair, shade, ink.
Чубчик закінчується над бровами (очі відкриті й заплющуються); тінь soft — під чубчиком і обабіч обличчя.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
