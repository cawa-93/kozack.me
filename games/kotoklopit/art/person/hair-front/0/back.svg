<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 70" width="64" height="70">
<!-- person/hair-front/0/back — коротка зачіска, передня частина: шапочка й чубчик над лобом, ракурс back (¾ ззаду). Еталон F1b, art/STYLE.md; A10 переніс на більше полотно голови (64 × 70), форма та сама.
size 64×70; pivot (32, 46) — шия, як у person/head/*; points: top (32.5, 4.5).
Шари: fill-hair, shade, ink.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
