<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 59 54" width="59" height="54">
<!-- person/hair-front/bob/back — каре, передня частина: косий проділ, пасма закривають вухо й обрамлюють обличчя до підборіддя, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 59×54; pivot (30, 44) — шия, як у person/head/*; points: top (30.5, 2.5).
Шари: fill-hair, shade, ink.
Чубчик над бровами косо, очі відкриті; тінь soft — пасма обабіч обличчя й під чубчиком.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
