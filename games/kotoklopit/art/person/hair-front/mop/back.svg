<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 61" width="68" height="61">
<!-- person/hair-front/mop/back — хвиляста кучма, передня частина: об'ємні хвилі обабіч обличчя, хвилястий чубчик над бровами, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 68×61; pivot (35, 47) — шия, як у person/head/*; points: top (35.5, 4.5).
Шари: fill-hair, shade, ink.
Чубчик не нижчий за брови; ближнє пасмо закриває вухо; тінь soft — пасма обабіч обличчя й під чубчиком.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
