<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 75" width="62" height="75">
<!-- person/hair-front/middle-part/back — довге з прямим проділом, передня частина: проділ посередині, пасма обабіч обличчя нижче плечей, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 62×75; pivot (31, 44) — шия, як у person/head/*; points: top (31.5, 2.5).
Шари: fill-hair, shade, ink.
Ближнє пасмо лягає на груди між рукою й шиєю (рука — поверх), дальнє — на дальнє плече; проділ — від вершини лінії росту до маківки, пасма розходяться від нього. Задня частина — «довгої» (person/hair-back/1).
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
