<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- person/hair-front/waves/back — хвилі до плечей, передня частина: проділ, хвилясті пасма обабіч обличчя (ближнє закриває вухо й лягає на плече), ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 64×64; pivot (32, 44) — шия, як у person/head/*; points: top (32.5, 2.5).
Шари: fill-hair, shade, ink.
Лоб відкритий трикутником від проділу; тінь soft — ближнє пасмо, дальнє й під хвилею над лобом.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
