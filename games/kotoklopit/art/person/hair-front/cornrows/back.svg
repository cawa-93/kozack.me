<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 51 43" width="51" height="43">
<!-- person/hair-front/cornrows/back — кукурудзяні кіски, передня частина: тісна шапочка, рядки від лінії росту над лобом назад, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 51×43; pivot (26, 42) — шия, як у person/head/*; points: top (26.5, 0.5).
Шари: fill-hair, shade, ink.
Рядок ≈ 5 завширшки; проділи — звужені лінії, плетіння — «ялинкою»; тінь soft — над лобом і над вухом.
back — порожні шари: скелет ховає передню частину зачіски ззаду.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
