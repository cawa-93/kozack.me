<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 25" width="30" height="25">
<!-- person/shaft/ankle/front — халява черевиків (слоти shaft-far і shaft-near, на кістці ноги), ракурс front (¾ спереду). Гардероб, взуття.
size 30×25; pivot (15, 18) — кісточка (точка foot ноги); верх — на 12 вище, низ без контуру лягає на стопу person/shoe/ankle.
Шари: fill-shoes, detail (задник darkHi), shade, ink. Ширша за голу ногу, м'який комір угорі, шнурівка спереду. Лише на голій нозі.
-->
<defs>
<path id="person-shaft-ankle-front-shape" d="M6.8 6.6C10.6 8 19.4 8 23.4 6.2C23.4 10 23.2 14 23.2 18.6C19 19.4 11 19.4 6.8 18.6C6.6 14 6.6 10 6.8 6.6Z"/>
<clipPath id="person-shaft-ankle-front-clip"><use href="#person-shaft-ankle-front-shape"/></clipPath>
</defs>
<g id="fill-shoes">
<use href="#person-shaft-ankle-front-shape" fill="#ffffff"/>
</g>
<g id="detail" clip-path="url(#person-shaft-ankle-front-clip)">
<path d="M5 13.4C8 14.4 10.6 16 11.4 21L5 21Z" fill="#6d6266"/>
</g>
<g id="shade" clip-path="url(#person-shaft-ankle-front-clip)">
<path d="M4 7C8.6 9.6 21 9.6 26 6.6L26 10.8C21 12.6 8.6 12.6 4 10.8Z" fill="#3f2541" fill-opacity="0.16"/>
</g>
<g id="ink">
<path d="M7 9.6C10.8 11 19.2 11 23.2 9.4" fill="none" stroke="#2e1f29" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M5.4 13.4C8 14.4 10.6 16 11.2 19.2" fill="none" stroke="#2e1f29" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M19.6 11.6L22.6 12.4M19.6 14.4L22.6 15.2M19.6 17.2L22.6 18" fill="none" stroke="#2e1f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M6.8 18.6C6.6 14 6.6 10 6.8 6.6C10.6 8 19.4 8 23.4 6.2C23.4 10 23.2 14 23.2 18.6" fill="none" stroke="#2e1f29" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
