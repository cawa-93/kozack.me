size 34×38; pivot (17, 31) — кісточка (точка foot ноги); верх — на 24 вище, під коліном; низ без контуру лягає на стопу person/shoe/boots.
Шари: fill-shoes, shade, ink. Ширша за штанину (заправлені штани не визирають), литка ліворуч, відворот угорі.
-->
