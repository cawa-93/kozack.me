<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 40" width="36" height="40">
<!-- person/shaft/rubber/back — халява гумових чобіт під коліно (слоти shaft-far і shaft-near, на кістці ноги), ракурс back (¾ ззаду). Гардероб, взуття.
size 36×40; pivot (18, 33) — кісточка (точка foot ноги); верх — на 24 вище, низ без контуру лягає на стопу person/shoe/rubber.
