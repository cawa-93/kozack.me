<path d="M7 18.6C6.8 15 6.8 11.6 7 8.4C10.6 9.8 19.4 9.8 23.2 8C23.2 11.6 23 15 23 18.6" fill="none" stroke="#2e1f29" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
