<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 25" width="30" height="25">
<!-- person/shaft/hightop/back — халява високих кедів (слоти shaft-far і shaft-near, на кістці ноги), ракурс back (¾ ззаду). Гардероб, взуття.
size 30×25; pivot (15, 18) — кісточка (точка foot ноги); верх — на 10 вище, низ без контуру лягає на стопу person/shoe/canvas.
Шари: fill-shoes, detail (кругла латка на кісточці paper), shade, ink. Ззаду — шов задника й латка; шнурівки не видно.
-->
<defs>
