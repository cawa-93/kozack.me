</g>
<g id="shade" clip-path="url(#person-shaft-hightop-back-clip)">
<path d="M4 9C7 11 9 14 9.4 21L4 21Z" fill="#3f2541" fill-opacity="0.16"/>
</g>
<g id="ink">
