<clipPath id="person-shaft-hightop-back-clip"><use href="#person-shaft-hightop-back-shape"/></clipPath>
</defs>
<g id="fill-shoes">
<use href="#person-shaft-hightop-back-shape" fill="#ffffff"/>
</g>
<g id="detail">
