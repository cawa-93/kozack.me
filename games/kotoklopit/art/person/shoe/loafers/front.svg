<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 39 25" width="39" height="25">
<!-- person/shoe/loafers/front — туфлі (слоти shoe-far і shoe-near), носком праворуч, ракурс front (¾ спереду). Гардероб, взуття.
size 39×25; pivot (16, 8) — кісточка; верх — лінія низу штанини, трохи нижче, ніж у person/shoe; підошва — на висоті person/shoe.
Шари: fill-shoes, detail (тонка підошва й невеликий підбор darkHi), shade, ink. Гладкі, без шнурків: лише шов фартуха на носку.
-->
<defs>
<path id="person-shoe-loafers-front-shape" d="M9.4 7C11 7.8 14 8.2 16 8.2C18 8.2 20.4 7.6 21.6 7.8C23.6 8.2 25.6 9.6 27.4 10.6C29.4 11.6 31.6 12.6 32.4 14C33 15.2 32.8 16.6 32 17.6C31 18.6 28.6 18.6 26 18.6C22 18.6 18.6 18.4 15.4 18.4L15 18.9C13.6 19 11.6 19 10.4 18.8C9 18.6 8.2 17.8 8 16.4C7.8 15 7.8 13 8 11.4C8.2 9.8 8.4 7.8 9.4 7Z"/>
<clipPath id="person-shoe-loafers-front-clip"><use href="#person-shoe-loafers-front-shape"/></clipPath>
</defs>
<g id="fill-shoes">
<use href="#person-shoe-loafers-front-shape" fill="#ffffff"/>
</g>
<g id="detail" clip-path="url(#person-shoe-loafers-front-clip)">
<path d="M5 15.6L15.2 15.6L15.2 21L5 21Z" fill="#6d6266"/>
<path d="M15.2 17C20 17.2 27 17.2 35 16.6L35 21L15.2 21Z" fill="#6d6266"/>
</g>
<g id="shade" clip-path="url(#person-shoe-loafers-front-clip)">
<path d="M8 8C8.8 6.8 12.1 6.8 13 8C13.9 9.2 14.4 13.8 13.6 15.6L7.6 15.6C7.1 13.8 7.2 9.2 8 8Z" fill="#3f2541" fill-opacity="0.16"/>
</g>
<g id="ink">
<path d="M23.4 8.8C24.4 10.6 26.8 12 29.8 12.6" fill="none" stroke="#2e1f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M8 15.6L15.2 15.6L15.2 18.4M15.2 17Q24 17.2 32.6 16.6" fill="none" stroke="#2e1f29" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<use href="#person-shoe-loafers-front-shape" fill="none" stroke="#2e1f29" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
