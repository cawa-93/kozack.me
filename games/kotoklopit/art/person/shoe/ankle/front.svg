<path d="M7.8 15.4L14.6 15.4L14.6 17.6M14.6 16.6Q24 16.9 31.8 16.2" fill="none" stroke="#2e1f29" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
