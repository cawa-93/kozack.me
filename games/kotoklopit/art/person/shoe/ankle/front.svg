<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 39 25" width="39" height="25">
<!-- person/shoe/ankle/front — черевики, стопа (слоти shoe-far і shoe-near), носком праворуч, ракурс front (¾ спереду). Гардероб, взуття.
size 39×25; pivot (16, 8) — кісточка; верх — лінія низу штанини, як у person/shoe: під довгими штанами халяви не видно (лише стопа);
на голій нозі верх накриває халява person/shaft/ankle. Шари: fill-shoes, detail (підбор і підошва darkHi), shade, ink. Шнурівка на підйомі.
-->
