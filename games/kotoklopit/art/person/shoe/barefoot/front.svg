<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 39 25" width="39" height="25">
<!-- person/shoe/barefoot/front — гола стопа (слоти shoe-far і shoe-near), пальцями праворуч, ракурс front (¾ спереду). Гардероб, взуття.
size 39×25; pivot (16, 8) — кісточка; верх — на 1,8 над кісточкою, завширшки з кісточкою голої ноги (person/leg/bare); підошва — на висоті person/shoe.
Шари: fill-skin, shade, ink. Згори контуру немає: шкіра ноги переходить у стопу, а на кісточці спереду — лише згин. Край довгої штанини дає person/hem/edge.
-->
