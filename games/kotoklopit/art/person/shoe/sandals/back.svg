<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 39 25" width="39" height="25">
<!-- person/shoe/sandals/back — сандалі (слоти shoe-far і shoe-near), носком праворуч, ракурс back (¾ ззаду). Гардероб, взуття.
size 39×25; pivot (16, 8) — кісточка; верх — ремінець на кісточці (на 1,2 над нею); підошва — на висоті person/shoe.
Шари: fill-shoes (ремінці й силует підошви), fill-skin (стопа), detail (підошва cardboard), shade, ink. Ззаду — п'ята на підошві й
ремінець довкола кісточки з задником; стопа без контуру згори.
-->
<defs>
