<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 39 25" width="39" height="25">
<!-- person/shoe/sandals/front — сандалі (слоти shoe-far і shoe-near), носком праворуч, ракурс front (¾ спереду). Гардероб, взуття.
size 39×25; pivot (16, 8) — кісточка; верх — ремінець на кісточці (на 1,2 над нею); підошва — на висоті person/shoe.
Шари: fill-shoes (ремінці й силует підошви), fill-skin (стопа), detail (підошва cardboard), shade, ink. Стопа без контуру згори, як
person/shoe/barefoot; ремінці широкі (≈ 4), щоб на телефоні читалися кольором взуття, і лягають поверх шкіри (fill-shoes фарбується після fill-skin).
-->
<defs>
<path id="person-shoe-sandals-front-foot" d="M11 6.2C10.6 7.6 9.6 10.6 9.2 12.4C8.8 14 9 15.6 10.2 16.4C12 16.8 16 16.7 20 16.7C24 16.7 28.4 16.6 30.6 16.3C32 16.1 32.8 15.4 32.8 14.2C32.8 13 32 12.4 31 12.2C29 11.8 26.4 11 24.4 10C22.8 9.2 21.8 8 21.4 6.2Z"/>
<path id="person-shoe-sandals-front-sole" d="M8.8 15.4C13 16.2 23 16.2 32.4 15.4C33.2 16 33 18.4 31.8 18.8C27 19.2 14 19.2 9.8 18.9C8.4 18.7 8 16.4 8.8 15.4Z"/>
<path id="person-shoe-sandals-front-straps" d="M10.8 6.8C14 7.6 18 7.6 21.6 6.8L22.2 10.6C18 11.6 14 11.6 10.2 10.6ZM24.2 9.8C26 10.8 27.8 11.6 29.6 12L30.6 16.2L25.4 16.6Z"/>
<clipPath id="person-shoe-sandals-front-clip"><use href="#person-shoe-sandals-front-foot"/><use href="#person-shoe-sandals-front-sole"/></clipPath>
</defs>
<g id="fill-shoes">
<use href="#person-shoe-sandals-front-sole" fill="#ffffff"/>
<use href="#person-shoe-sandals-front-straps" fill="#ffffff"/>
</g>
<g id="fill-skin">
<use href="#person-shoe-sandals-front-foot" fill="#ffffff"/>
</g>
<g id="detail">
<use href="#person-shoe-sandals-front-sole" fill="#c39a66"/>
</g>
<g id="shade" clip-path="url(#person-shoe-sandals-front-clip)">
<path d="M7 9C9.4 10 11.4 13 12 17L7 17Z" fill="#3f2541" fill-opacity="0.16"/>
<path d="M7 17.4C16 18.2 26 18.2 35 17.2L35 21L7 21Z" fill="#3f2541" fill-opacity="0.16"/>
</g>
<g id="ink">
<path d="M30.8 13.2Q31.6 14.2 31.6 15.6Q30.8 14.4 30.8 13.2Z" fill="#2e1f29"/>
<path d="M11 6.2C10.6 7.6 9.6 10.6 9.2 12.4C8.9 13.6 8.9 14.6 9.2 15.4M30.6 16.3C32 16.1 32.8 15.4 32.8 14.2C32.8 13 32 12.4 31 12.2C29 11.8 26.4 11 24.4 10C22.8 9.2 21.8 8 21.4 6.2" fill="none" stroke="#2e1f29" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M10.8 6.8C14 7.6 18 7.6 21.6 6.8L22.2 10.6C18 11.6 14 11.6 10.2 10.6ZM24.2 9.8C26 10.8 27.8 11.6 29.6 12L30.6 16.2L25.4 16.6Z" fill="none" stroke="#2e1f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M8.8 15.4C13 16.2 23 16.2 32.4 15.4" fill="none" stroke="#2e1f29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M32.4 15.4C33.2 16 33 18.4 31.8 18.8C27 19.2 14 19.2 9.8 18.9C8.4 18.7 8 16.4 8.8 15.4" fill="none" stroke="#2e1f29" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
