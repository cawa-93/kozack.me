<!-- person/arm/sweater/back — ближня рука, широкий рукав светра оверсайз і кардигана: спущене плече, резинка на манжеті, ракурс back (¾ ззаду).
size 31×73; pivot (15, 14) — плече; points: hand (16, 54.6), grip (16.2, 61), cuff (16, 52.2) — як у person/arm, зсунуті на 2 (ширше полотно).
Шари: fill-top, fill-skin, shade, ink.
Рукав ширший за звичайний (кота на руках і річ у руці не закриває: ширший угорі, донизу звужується до резинки), шов спущеного плеча; манжет-резинка — fill-top, точка cuff — посередині резинки (принти на манжети).
Верх внутрішнього боку рукава без контуру — зливається з торсом, як у person/arm.
-->
