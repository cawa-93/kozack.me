<!-- person/arm/tee-inner/front — ближня рука з коротким рукавом футболки під верхом (сарафан, напівкомбінезон), ракурс front (¾ спереду).
size 27×73; pivot (13, 14) — плече; points: hand (14, 54.6), grip (14.2, 61) — як у person/arm.
Шари: fill-inner, fill-skin, shade, ink.
Той самий рукав, що person/arm/tee, але другим кольором верху (fill-inner, TopCut.inner): футболка під бретелями.
Рукав до середини плеча, трохи ширший за руку; нижче — гола рука й долоня одним силуетом (fill-skin), без лінії на зап'ястку. Верх внутрішнього боку рукава без контуру — зливається з торсом, як у person/arm.
-->
