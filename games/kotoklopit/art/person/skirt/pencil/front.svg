<!-- person/skirt/pencil/front — спідниця-олівець: вузька до коліна (слот skirt на кістці hips), ракурс front (¾ спереду). Гардероб, низ.
size 68×55; pivot (32, 17) — таз, як у person/torso/1 (полотно торса, зсунуте на (3, −37)); верх — лінія подолу сорочки торса.
Шари: fill-bottom, ink. Стани: st-stand — до коліна, майже без звуження (хода дрібним кроком, BottomCut.hobble: нога в кроці не виходить за бік); st-sit —
сидячи (нахил ≈ 6°): облягає стегно до коліна; st-squat — присів (нахил ≈ 45°): задирається до середини стегна. Тіні немає
(бюджет атласу).
-->
