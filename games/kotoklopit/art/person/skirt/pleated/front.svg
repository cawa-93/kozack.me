<!-- person/skirt/pleated/front — спідниця плісе: міді в дрібну складку (слот skirt на кістці hips), ракурс front (¾ спереду). Гардероб, низ.
size 70×62; pivot (32, 17) — таз, як у person/torso/1 (полотно торса, зсунуте на (3, −37)); верх — лінія подолу сорочки торса.
