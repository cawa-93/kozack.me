<!-- person/top-front/hoodie/front — край капюшона й шнурки худі, ракурс front (¾ спереду).
size 29×52; pivot (15, 52) — таз (клаптик торса person/torso/1 від (14, 2)); points: немає.
Шари: fill-top, ink.
Край капюшона — два товсті краї довкола шиї, ближній навхрест поверх дальнього; їхній внутрішній край — лінія вирізу торса. Шнурки виходять з-під краю. Кишеня — person/top-hem/hoodie, сам капюшон — person/hood/hoodie. Ззаду нічого: там капюшон. Без шару тіні (бюджет атласу): накладка світліша за тінь торса під підборіддям — читається піднятою.
-->
