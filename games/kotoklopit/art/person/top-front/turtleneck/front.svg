<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 56" width="30" height="56">
<!-- person/top-front/turtleneck/front — високий комір водолазки, ракурс front (¾ спереду).
size 30×56; pivot (15, 56) — таз (клаптик торса person/torso/1 від (14, -2)); points: немає.
Шари: fill-top, ink.
Трубка закриває шию й виріз торса від плечей до підборіддя (верх ховає голова); нижче лінії відвороту — сам відворот, товстий валик довкола шиї. Без шару тіні (бюджет атласу): накладка світліша за тінь торса під підборіддям — читається піднятою.
-->
