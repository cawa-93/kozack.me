<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 56" width="29" height="56">
<!-- person/top-front/zip-hoodie/back — розстебнуте худі: краї капюшона, борти й футболка між ними, ракурс back (¾ ззаду).
size 29×56; pivot (15, 52) — таз (клаптик торса person/torso/1 від (14, 2)); points: немає.
Шари: fill-top, fill-inner, ink.
Краї капюшона сходять до бортів; між бортами до подолу — футболка (fill-inner, колір TopCut.inner) зі своїм вирізом — лінією вирізу торса; внизу ближнього борту — бігунок блискавки. Капюшон — person/hood/hoodie. Ззаду нічого. Без шару тіні (бюджет атласу): накладка світліша за тінь торса під підборіддям — читається піднятою.
-->
<g id="fill-top"/>
<g id="fill-inner"/>
<g id="ink"/>
</svg>
