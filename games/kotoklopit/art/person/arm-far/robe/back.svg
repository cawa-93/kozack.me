<!-- person/arm-far/robe/back — дальня рука, широкий рукав халата з відворотом, ракурс back (¾ ззаду).
size 31×73; pivot (15, 14) — плече; points: hand (16, 54.6), grip (16.2, 61), cuff (15.6, 51.8) — як у person/arm, зсунуті на 2 (ширше полотно).
Шари: fill-top, fill-skin, shade, ink.
