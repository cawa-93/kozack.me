size 68×50; pivot (34, 17) — таз, як у person/torso/1 (полотно торса, зсунуте на (5, -37)).
Шари: fill-top, shade, ink. Стани: st-stand — стоїть; st-sit — сидить (стегно вперед); st-squat — присів (ноги вкорочені, тулуб нахилений).
Верх — лінія подолу торса (шов талії сукні), спідниця накриває стегна торса; до середини стегна, кльош ширшає донизу. Колір і візерунок — верху (fill-top). Плям немає (як у спідниці низу).
