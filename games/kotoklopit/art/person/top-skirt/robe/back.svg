size 64×54; pivot (32, 17) — таз, як у person/torso/1 (полотно торса, зсунуте на (3, -37)).
Шари: fill-top, shade, ink. Стани: st-stand — стоїть; st-sit — сидить (стегно вперед); st-squat — присів (ноги вкорочені, тулуб нахилений).
Халат від пояса до колін накриває поділ і стегна торса; пояс із бантом — без станів (поверх талії), край ближньої поли йде від банта донизу. Колір і візерунок — верху (fill-top). Плям немає. Ззаду — пояс без банта.
-->
