<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 21" width="26" height="21">
<!-- person/hem/skinny/front — вузький підкат вузьких джинсів над взуттям (слоти hem-far і hem-near), ракурс front (¾ спереду). Гардероб, низ.
size 26×21; pivot (13, 14) — кісточка (точка foot ноги); верх підкату на 7 вище, низ лягає на верх черевика.
Шари: fill-bottom, detail, shade, ink. Як person/hem/cuff, але по вузькій нозі (person/leg/leggings); гірчична строчка.
-->
<defs>
<path id="person-hem-skinny-front-shape" d="M6.6 7C8.6 8.2 17.2 8.2 19.2 6.8C19.4 8.8 19.6 11 19.4 13C17 14.6 9 14.8 6.2 13.4C6.2 11.2 6.4 9 6.6 7Z"/>
<clipPath id="person-hem-skinny-front-clip"><use href="#person-hem-skinny-front-shape"/></clipPath>
</defs>
<g id="fill-bottom">
<use href="#person-hem-skinny-front-shape" fill="#ffffff"/>
</g>
<g id="detail" clip-path="url(#person-hem-skinny-front-clip)">
<path d="M7.8 11.6C10.4 12.8 15.8 12.8 18.2 11.4" fill="none" stroke="#d4a54c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<g id="shade" clip-path="url(#person-hem-skinny-front-clip)">
<path d="M4 7C8 9 18 9 22 6.6L22 9.6C18 11.6 8 11.6 4 9.8Z" fill="#3f2541" fill-opacity="0.16"/>
</g>
<g id="ink">
<path d="M6.6 7C8.6 8.2 17.2 8.2 19.2 6.8" fill="none" stroke="#2e1f29" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M19.2 6.8C19.4 8.8 19.6 11 19.4 13C17 14.6 9 14.8 6.2 13.4C6.2 11.2 6.4 9 6.6 7" fill="none" stroke="#2e1f29" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
