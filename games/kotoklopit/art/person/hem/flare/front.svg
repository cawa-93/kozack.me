<path d="M9.2 27.2C14 25.4 24 25.2 28.8 26.8" fill="none" stroke="#2e1f29" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M11 6.6C10.6 16.6 8.4 23.4 6.6 28.8C12 31.6 26 31.8 30.8 28.4C29 23 27.2 15.6 26.8 6.6" fill="none" stroke="#2e1f29" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
