<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38" width="38" height="38">
<!-- person/hem/flare/back — розтруб кльошу над взуттям (слоти hem-far і hem-near), ракурс back (¾ ззаду). Гардероб, низ.
size 38×38; pivot (19, 28) — кісточка (точка foot ноги); верх (на 22 вище, під коліном) — ширина штанини person/leg, без контуру.
Шари: fill-bottom, shade, ink. Розширюється донизу й накриває верх черевика; ззаду складка біля п'ятки.
-->
