<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 46" width="50" height="46">
<!-- person/hair-back/shaved/front — виголений візерунок на скроні, задня частина: коротка стрижка, ближня скроня (у back — праворуч) виголена з двома смугами-зигзагами, ракурс front (¾ спереду). Рукою еталонів F1b (art/STYLE.md).
size 50×46; pivot (26, 42) — шия, як у person/head/*; points: top (26.5, 0.5).
Шари: fill-hair, fill-accent, shade, ink.
Виголене — шкіра голови (волосся немає); смуги — `fill-hair` під `fill-accent`, тож без акценту вони кольору волосся. У front — коротке за головою в тіні base.
-->
