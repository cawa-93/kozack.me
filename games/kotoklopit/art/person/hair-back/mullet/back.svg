<!-- person/hair-back/mullet/back — маллет, задня частина: коротка скуйовджена маківка й довгі пасма з потилиці на шию й плечі, ракурс back (¾ ззаду). Рукою еталонів F1b (art/STYLE.md).
size 61×69; pivot (33, 47) — шия, як у person/head/*; points: top (34, 3).
Шари: fill-hair, shade, ink.
Межа короткого й довгого — лінія з виступами; кінчики довгих пасом — зубцями; вухо праворуч не закрите. У front — об'єм за головою в тіні base, довгі пасма визирають з-за шиї ліворуч. Передня частина — скуйовдженої (person/hair-front/shaggy), тож маківка — та сама, що в неї.
-->
