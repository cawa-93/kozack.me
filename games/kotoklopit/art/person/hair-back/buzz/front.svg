<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 39 37" width="39" height="37">
<!-- person/hair-back/buzz/front — під машинку, задня частина: рівний «їжак» на 2–3 над черепом, рівна межа на шиї, ракурс front (¾ спереду). Рукою еталонів F1b (art/STYLE.md).
size 39×37; pivot (19, 35) — шия, як у person/head/*; points: top (19.5, -6.5).
Шари: fill-hair, shade, ink.
Фактура — кілька коротких дужок `ink` і вихор; вухо праворуч не закрите. У front — порожні шари: за головою волосся немає.
front — порожні шари: за головою в цьому ракурсі волосся немає.
-->
<g id="fill-hair"/>
<g id="shade"/>
<g id="ink"/>
</svg>
