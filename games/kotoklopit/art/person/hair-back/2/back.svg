<!-- person/hair-back/2/back — хвостик, задня частина: потилиця гладко зачесана до гумки, хвіст звисає з гумки на шию й комір поверх голови й плечей, ракурс back (¾ ззаду). A10, рукою еталонів F1b (art/STYLE.md).
size 64×70; pivot (32, 46) — шия, як у person/head/*; points: top (32.5, 4.5).
Шари: fill-hair, shade, ink.
Лінзи-пасма віялом від маківки, тімені й скронь, звужені до гумки; знизу — лише лінія волосся на шиї (під хвостом). Контур потилиці — відкритий шлях без шматка під хвостом, щоб не перетинав хвіст. Вухо праворуч не закрите; тінь soft — низ потилиці й бік хвоста.
-->
