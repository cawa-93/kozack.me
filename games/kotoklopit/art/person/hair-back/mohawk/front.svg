<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 51 65" width="51" height="65">
<!-- person/hair-back/mohawk/front — неоновий ірокез, задня частина: гребінь шипами від лоба через маківку до потилиці, боки виголені (щетина), ракурс front (¾ спереду). Рукою еталонів F1b (art/STYLE.md).
size 51×65; pivot (25, 59) — шия, як у person/head/*; points: top (26, 5).
Шари: fill-hair, fill-accent, shade, ink.
Акцент `fill-accent` — гребінь над коренями (смуга коренів — кольору волосся), межа — лінією inner; виголене — рисочки `fill-hair` на шкірі без контуру. Високе полотно, своя маківка `top`. У front — порожні шари: гребінь — у передній частині.
front — порожні шари: за головою в цьому ракурсі волосся немає.
-->
<g id="fill-hair"/>
<g id="fill-accent"/>
<g id="shade"/>
<g id="ink"/>
</svg>
