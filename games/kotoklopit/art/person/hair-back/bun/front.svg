size 58×53; pivot (33, 43) — шия, як у person/head/*; points: top (33.5, 1.5).
Шари: fill-hair, shade, ink.
Пасма — звужені штрихи від вихору до пучка; верх пучка — лінія inner, витки — звуженими штрихами; тінь soft — низ пучка й ближній бік. У front об'єм за головою — у тіні base. Передня частина — «хвостика» (person/hair-front/2).
-->
