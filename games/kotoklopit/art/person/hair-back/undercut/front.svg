<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 51" width="52" height="51">
<!-- person/hair-back/undercut/front — андеркат із чубом, задня частина: виголена потилиця (щетина на шкірі) і високий чуб, що падає на ближній бік, ракурс front (¾ спереду). Рукою еталонів F1b (art/STYLE.md).
size 52×51; pivot (22, 50) — шия, як у person/head/*; points: top (25, 2.5).
Шари: fill-hair, fill-accent, shade, ink.
Виголене — рисочки `fill-hair` на шкірі голови без контуру: на 0,72 зливаються в смугу між кольором волосся й шкірою, тож межу з чубом видно за будь-якого кольору (суцільне волосся в тіні з чорним читалося як шолом). Акцент `fill-accent` — довжина чуба, корені — кольору волосся. У front — порожні шари: потилиця виголена, за головою волосся немає.
front — порожні шари: за головою в цьому ракурсі волосся немає.
-->
<g id="fill-hair"/>
<g id="fill-accent"/>
<g id="shade"/>
<g id="ink"/>
</svg>
