size 56×55; pivot (26, 50) — шия, як у person/head/*; points: top (29, 2.5).
Шари: fill-hair, fill-accent, shade, ink.
Акцент `fill-accent` — довжина чуба (корені — кольору волосся), межі — лініями inner: без акценту чуб кольору волосся й світліший за виголене. У front — виголене за головою в тіні base.
-->
