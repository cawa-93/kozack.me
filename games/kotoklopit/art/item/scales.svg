<!-- item/scales — ваги для кота (фото титрів, «Схильність до повноти»): бірюзова платформа з ребристим верхом і круглим
циферблатом на скошеному передньому куті — його видно під котом, що стоїть на вагах. size 84×52; pivot (42, 34) — точка
підлоги під центром платформи. Без points. Слід 0,44 × 0,44 клітинки зі скошеним переднім кутом, платформа 12 заввишки;
кіт, поставлений коренем на 8 вище pivot, стоїть лапами на верху. Циферблат — коло Ø 15,6 (z 0,4–16), стрілка червона;
він трохи вищий за платформу й стоїть між лапами кота.
Без станів і шарів. LINE (річ від 60); ребро верху — fine, щоб низькі грані не стали чорнильними. «Історія» — наліпка на лівій грані.
-->
