<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 104" width="108" height="104">
<!-- item/carrier/premium — переноска надійна вишнева з латунною засувкою й килимком у клітинку (§8.5, §9.12): коробка 0,6 × 0,42 клітинки, заввишки 46, ручка до 57.
size 108×104; pivot (46, 78) — точка підлоги під центром сліду; points: inside (46, 74) — дно посередині (z 4), де спить кіт.
Стани: st-body — уся переноска, дверцята з ґратками відчинені на 90° праворуч (навколо заднього краю грані +x), крізь отвір і щілини видно темне нутро;
st-grate — накладка поверх кота, що спить усередині: лише те, що ближче за нього (передні стінки з дірками щілин і отвору, верх, ручка), тож кота видно крізь отвір і щілини.
Без шарів, LINE. «Історія»: латунна засувка, килимок у клітинку всередині.
-->
