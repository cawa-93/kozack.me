<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 97 115" width="97" height="115">
<!-- item/vacuum/back — вертикальний пилосос у руках персонажа, ракурс back (рішення автора 2026-11-02, GAME_DESIGN §8.7 «Пилосос у руках»); пакет «Арт пилососа», art/STYLE.md.
size 97×115; pivot (12.5, 25.5) — хват ручки (гніздо held); points: brush-back (61.5, 75.2) — середина щітки на підлозі (ззаду щітка далі від камери — вище на екрані).
Без станів і шарів, LINE_RIG. Видно зад щітки з коліщатами, корпус і трубку — пилосос іде від камери; трубка нахилена на 32°, крутіше, ніж спереду: інакше щітка ззаду виходила б на рівень стегна й «висіла» в повітрі. Тінь — лише під щіткою.
-->
