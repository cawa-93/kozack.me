<!-- item/vacuum/front — вертикальний пилосос у руках персонажа, ракурс front (рішення автора 2026-11-02, GAME_DESIGN §8.7 «Пилосос у руках»); пакет «Арт пилососа», art/STYLE.md.
size 97×115; pivot (12.5, 25.5) — хват ручки (гніздо held, кулак ближньої руки); points: brush (70.3, 101.3) — середина щітки на підлозі, brush-back (61.5, 75.2) — те саме ззаду.
Без станів і шарів, LINE_RIG (річ у руках). Обличчям праворуч: щітка попереду на підлозі, трубка нахилена на 43° до персонажа; спереду щітка ближче до камери — нижче на екрані. Тінь — лише під щіткою (вона на підлозі).
-->
