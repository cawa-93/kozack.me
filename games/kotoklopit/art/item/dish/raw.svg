size 40×42; pivot (20, 34) — низ пакунка посередині (передній кут): гніздо held у руках, на стільниці — точка dish.
Стани: st-cheap — «Звичайні» продукти; st-premium — «Фермерські»: золота печатка-розетка з червоними стрічками на лівій грані, поверх контуру й за силует (доробки після хвилі 3: маленьку золоту наліпку на картоні на 0,72 px на одиницю не було видно). Без шарів; контур як у скелета (LINE_RIG: 3,6 / 4,8 / 2,2), бо річ у гнізді held — частина складеного персонажа; без падаючої тіні (річ у руках).
