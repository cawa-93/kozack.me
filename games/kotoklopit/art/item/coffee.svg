<!-- item/coffee — кавомашина на стільниці кухні (GAME_DESIGN §8.7): червоний корпус профілем «С» — колона ззаду, «голова» з регулятором і кнопкою нависає над металевим піддоном; ніша відкрита з обох боків, лицем у кімнату (грань +y).
size 80×94; pivot (41, 71) — центр основи на стільниці (точка dish стільниці, висота 62); points: cup (30.76, 69.12) — середина піддона під носиком, дно чашки item/coffee/cup.
Слід 0,44 × 0,46 клітинки, висота 46: піддон до 7, «голова» від 30. Історія: паперова наліпка на правій грані колони.
Без станів і шарів: один кадр у готових кольорах; чашку, поки персонаж варить каву, гра кладе накладкою item/coffee/cup.
Контур LINE_SMALL (річ менша за 60): силует 4,5, низ 6, ребра 2,5, фактура 2.
-->
