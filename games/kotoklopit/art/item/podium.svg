<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 120" width="168" height="120">
<!-- item/podium — п'єдестал виставки котів (фото титрів життя, §4.2): три фарбовані сходинки в ряд уздовж +x — друге місце,
перше (найвища, посередині) і третє; на передніх гранях (+y) — цифри 2, 1, 3 білою фарбою.
size 168×120; pivot (84, 72) — точка підлоги під центром середньої сходинки; points: first (92, 40),
second (53.6, 30.8), third (130.4, 77.2) — місце кота на сходинці кожного місця: його корінь (між
лапами) — на (8, 4) правіше й ближче до камери за середину верху, тож тулуб, що позаду кореня, — посередині сходинки.
Слід кожної сходинки 0,6 × 0,56 клітинки; висоти 26 (друга), 36 (перша), 18 (третя). Стіни між другою й першою не видно:
верх першої заходить на дальній край верху другої. Без станів і шарів. LINE (річ від 60); цифри — штрихом paper.
«Історія» — відбита фарба на куті третьої сходинки й подряпина на першій.
-->
