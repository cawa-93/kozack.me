<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 32" width="52" height="32">
<!-- item/brush — щітка-рукавичка для вичісування (фото титрів, «Догляд за шерстю −»: кіт не линяє): синя рукавичка лежить на
підлозі долонею догори, пальцями праворуч, великий палець відстовбурчений угору-праворуч; рожева гумова накладка з пухирцями,
гірчичний ремінець-липучка на манжеті; без жодної шерстинки. size 52×32; pivot (26, 20) — точка підлоги під серединою
рукавички. Без points. Пласка (4 заввишки). Без станів і шарів. Контур — LINE_RIG, як пласкі речі mess (шкарпетка): з
LINE_SMALL чотириодинична рукавичка стає чорнильною плямою. Силует — штрих під заливками (рукавичка «видавлена» з шарів).
-->
