<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 32" width="52" height="32">
<!-- item/brush — щітка-пуходерка для вичісування кота (фото титрів, «Догляд за шерстю −»: кіт не линяє): лежить на підлозі зубцями
догори, ручкою праворуч. Світле дерево: прямокутна голівка-колодка й ручка з отвором, що помітно стирчить убік; на голівці —
темна подушка й три ряди густих світлих металевих зубців (greyHi); без жодної шерстинки. size 52×32; pivot (26, 20) — точка
підлоги під серединою щітки. Без points, станів і шарів. Колодка 3,8 заввишки, зубці ще ≈ 5,9. Світле дерево — woodHi на боках і
ropeHi згори (світлішого токена дерева немає). Контур — LINE_RIG, як пласкі дрібниці mess: з LINE_SMALL ручка стає чорнильною
паличкою; ребер inner немає — грані розрізняє тон, а важкий низ зсунуто донизу, щоб не з'їдав бік колодки. Силует і зубці — штрих
під заливками (світлий штрих зубця на ширшому чорнильному). «Історія» — один зубець у середньому ряду відігнувся в інший бік.
-->
