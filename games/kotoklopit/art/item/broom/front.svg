<!-- item/broom/front — віник у руках персонажа, ракурс front (GAME_DESIGN §8.7 «Віник і пилосос у руках»); art/STYLE.md.
size 97×115; pivot (12.5, 25.5) — хват держака (гніздо held, кулак ближньої руки); points: brush (70.3, 101.3) — середина віника на підлозі, brush-back (61.5, 75.2) — те саме ззаду. Полотно, pivot і точки — як в item/vacuum: накладка holdVacuum і нахил у кулаці спільні.
Без станів і шарів, LINE_RIG (річ у руках). Обличчям праворуч: віник попереду на підлозі, совок висить на держаку. Тінь — лише під віником.
-->
