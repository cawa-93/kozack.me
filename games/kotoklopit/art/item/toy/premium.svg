<!-- item/toy/premium — дорога «інтерактивна» вудочка: синя паличка з гумовою ручкою, дзвоник і яскраве пір'я (червоне, гірчичне, помаранчеве).
size 128×128; pivot (64, 72); points: feather (106, 98) — середина пучка пір'я, коли вудочку тримає рука (стан hand): туди стрибає кіт.
Стани (полотно спільне, pivot для кожного свій за змістом):
st-floor — лежить на підлозі, pivot — точка під серединою (паличка навскіс, пір'я сплющене, тінь);
st-hidden — загнана під диван чи холодильник: видно лише пір'я, основою до pivot, віялом до глядача (решта — під меблями);
st-teeth — у зубах кота: pivot — рот (гніздо teeth), пір'я стирчить уперед, паличка навскіс до підлоги позаду (скорочена: йде вглиб);
st-hand — у руці персонажа: pivot — хват (гніздо rod), паличка вперед і вгору, з кінчика звисає мотузка з пір'ям.
LINE_SMALL (тонка річ; головне — пучок пір'я ≈ 20). Без шарів.
-->
