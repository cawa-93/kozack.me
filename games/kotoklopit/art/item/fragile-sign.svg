<!-- item/fragile-sign — наліпка «Обережно: крихке» на картонній коробці (фото титрів, «Довголіття −»: кіт у коробці «крихке»):
паперовий прямокутник із червоним келихом, тріщина блискавкою через чашу; без тексту. size 32×46; pivot (16, 23) — центр
наліпки. Без points, станів і шарів. Пласка, лежить на грані +x коробки env/boxes (правий фасад): горизонталі піднімаються
праворуч 2:1, вертикалі вертикальні; на грань +y — віддзеркалити. Наліпка ≈ 22 × 25, наклеєна трохи криво (3°). Келих — друк, без
контуру; край наліпки — fine, як наліпка-адреса на коробці.
-->
