<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 64" width="56" height="64">
<!-- item/fountain/cheap — простий фонтанчик: білий пластиковий купол із синім носиком; струмінь високою дугою б'є у воду, бризки.
size 56×64; pivot (28, 48) — той самий, що в поїлки item/water/* (центр миски на підлозі): накладка на будь-який її стан.
Купол — посередині миски, основа на висоті 14 трохи позаду центру (ховається за переднім краєм отвору, обідок 13); струмінь до ≈ 39.
Стани: st-on — працює (струмінь і бризки); st-dry — у поїлці немає води (item/water/*/empty): лише купол, без води. Без points. Контур купола — LINE_SMALL.inner (дрібна накладка всередині миски); вода — tealHi з краєм кольором води teal.
-->
