<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 136" width="132" height="136">
<!-- item/house/premium — м'який будиночок зі сливової повсті: опуклі стіни, дах-склепіння («буханець») зі світлішим валиком по передньому краю й стібками, помпон, товстий кремовий кант довкола круглого входу, наліпка-лапка.
size 132×136; pivot (66, 100) — точка підлоги під центром сліду 0,8 × 0,8 клітинки; points: door (90.5, 86) — центр входу на правій грані +x
(z ≈ 26): там гра показує очі кота в темряві. Стіни до 30, далі склепіння до 60 (уздовж x; фронтон із входом — праворуч). Вхід — вузький круглий отвір над високим порогом у товстій стіні: усередині тихо, хвоста кота не видно.
Без станів. LINE (річ від 60). Без шарів.
-->
