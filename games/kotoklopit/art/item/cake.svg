<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 64" width="58" height="64">
<!-- item/cake — торт довгожителя на тарілці (фото титрів, «Довголіття +»): шоколадний бісквіт із кремовим прошарком, біла
глазур із патьоками, дві вишні й дві великі запалені свічки-цифри «20» майже на всю ширину торта — «дуже багато років», а не просто
день народження. size 58×64; pivot (29, 48) — точка підлоги під центром тарілки. Без points. Тарілка — овал 0,49 × 0,36
клітинки (2,4 заввишки), торт — коло Ø 0,31, бісквіт 14,6 заввишки; цифри ≈ 11 × 13, полум'я — до ≈ 43 над підлогою. Без
станів і шарів. LINE_SMALL (річ менша за 60), полум'я й вишні — fine. Цифри — шляхи, не текст: червоний штрих на чорнильному
(контур — штрих під заливкою, ≈ 1,3: із fine в «0» не лишилося б просвіту). «Історія» — «0» трохи похилилась.
-->
