<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 58 64" width="58" height="64">
<!-- item/cake — ювілейний торт на тарілці (фото титрів, «Довголіття +»): шоколадний бісквіт із кремовим прошарком, біла
глазур із патьоками, вишні й три запалені свічки в смужку. size 58×64; pivot (29, 48) — точка підлоги під центром тарілки.
Без points. Тарілка — овал 0,49 × 0,36 клітинки (2,4 заввишки), торт — коло Ø 0,31, бісквіт 14,6 заввишки; полум'я —
до ≈ 43 над підлогою. Без станів і шарів. LINE_SMALL (річ менша за 60), свічки й вишні — fine. «Історія» — середня свічка
похилилась.
-->
