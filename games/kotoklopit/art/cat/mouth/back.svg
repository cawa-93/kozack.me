<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 27" width="26" height="27">
<!-- cat/mouth/back — рот, ракурс back (¾ ззаду). Еталон F1b (closed, meow), art/STYLE.md; hiss, yawn, eat, tongue — A7 (хвиля 2).
size 26×27; pivot (14, 7) — під носом, посередині.
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink. Стани: st-closed, st-meow, st-hiss, st-yawn, st-eat, st-tongue.
closed — «ω»; meow — пащека й язичок; hiss — широка пащека з іклами зверху й знизу; yawn — щелепа далеко вниз, великий язик;
eat — жує одним боком: рот напіввідкритий навскіс (ближній куточок нижчий), рожевий язик, ближня щока випнута;
tongue — «ω» і язичок донизу з борозенкою (вилизує, п'є). Пащека, язик, борозенки й ікла — detail;
нижня щелепа (meow, hiss, yawn, eat) — шерсть: fill і маски голови тими самими фігурами, що на голові; ширша за пащеку,
контур — лінза «U», найширша під підборіддям і нанівець на щоках (кільце довкола маленької щелепи читалося «борідкою»).
back — порожні шари: скелет ховає рот ззаду.
-->
<g id="fill"/>
<g id="point"/>
<g id="tortie-a"/>
<g id="tortie-b"/>
<g id="tortie-c"/>
<g id="tabby-classic"/>
<g id="tabby-mackerel"/>
<g id="tabby-spotted"/>
<g id="tabby-ticked"/>
<g id="white-1"/>
<g id="white-2"/>
<g id="white-3"/>
<g id="detail"/>
<g id="shade"/>
<g id="ink"/>
</svg>
