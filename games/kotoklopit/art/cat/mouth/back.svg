size 20×20; pivot (10, 6) — під носом, посередині.
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink. Стани: st-closed, st-meow.
closed — «ω» без заливки; meow — пащека й язичок (detail), нижня щелепа — шерсть (fill і маски).
back — порожні шари: скелет ховає рот ззаду.
-->
