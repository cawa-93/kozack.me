<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 18" width="34" height="18">
<!-- cat/muzzle/flat/front — кирпата морда (перська, гімалайська), ракурс front (¾ спереду). Пакет A8a (варіанти форм), art/STYLE.md.
size 34×18; pivot (18, 8) — під носом звичайної морди, де морда прилягає до голови (точка muzzle голови); points: mouth (17.2, 9.4).
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Ширша й кругліша: ніс короткий і широкий, у проміжку між нижніми краями очей (не вище за їхній контур); mouth — одразу під носом, на висоті звичайного, щоб «ω» і щелепа «няв» не залазили на очі (зазор не менший, ніж у звичайної). Нижче — дві круглі подушечки вусів із тінню й тонким контуром знизу; кінчик не виходить за щоку.
Маски (A9b) — маски голови у світі (без шва з головою), поінт на всю морду, цятки вусів плямистого. back — порожні шари: скелет ховає морду ззаду.
-->
