Ширша й нижча, щічки пухкі; ніс маленький і високо — між очима, над ним складка перенісся. mouth — одразу під носом.
Маски — порожні групи (малює A9, у координатах світу, як у голови). back — порожні шари: скелет ховає морду ззаду.
