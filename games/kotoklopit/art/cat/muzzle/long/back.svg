<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 22" width="40" height="22">
<!-- cat/muzzle/long/back — видовжена морда клином (сіамська, орієнтальна, корніш-рекс, левкоя), ракурс back (¾ ззаду). Пакет A8a (варіанти форм), art/STYLE.md.
size 40×22; pivot (17, 10) — під носом звичайної морди, де морда прилягає до голови (точка muzzle голови); points: mouth (25, 13.2).
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Кінчик з носом виходить за контур щоки — там свій контур outer (без важкого низу). mouth — під носом, на кінці морди.
Маски — порожні групи (малює A9, у координатах світу, як у голови). back — порожні шари: скелет ховає морду ззаду.
-->
<g id="fill"/>
<g id="point"/>
<g id="tortie-a"/>
<g id="tortie-b"/>
<g id="tortie-c"/>
<g id="tabby-classic"/>
<g id="tabby-mackerel"/>
<g id="tabby-spotted"/>
<g id="tabby-ticked"/>
<g id="white-1"/>
<g id="white-2"/>
<g id="white-3"/>
<g id="detail"/>
<g id="shade"/>
<g id="ink"/>
</svg>
