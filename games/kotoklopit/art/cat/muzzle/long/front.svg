<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 24" width="35" height="24">
<!-- cat/muzzle/long/front — видовжена морда клином (сіамська, орієнтальна, корніш-рекс, левкоя), ракурс front (¾ спереду). Пакет A8a (варіанти форм), art/STYLE.md.
size 35×24; pivot (11, 10) — під носом звичайної морди, де морда прилягає до голови (точка muzzle голови); points: mouth (19.3, 11.8).
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Кінчик з носом виходить за контур щоки — там свій контур outer. Ніс праворуч від дальнього ока; mouth — одразу під носом, а підборіддя клина опущене, тож «ω» і щелепа «няв» лежать на шерсті клина, а не на контурі.
Маски (A9b) — маски голови у світі (без шва з головою), поінт на всю морду, цятки вусів плямистого. back — порожні шари: скелет ховає морду ззаду.
-->
