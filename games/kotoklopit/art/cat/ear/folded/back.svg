<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 28" width="32" height="28">
<!-- cat/ear/folded/back — висловухе вухо (шотландська висловуха, українська левкоя) (слоти ear-far і ear-near — той самий кадр), ракурс back (¾ ззаду). Пакет A8a (варіанти форм), art/STYLE.md.
size 32×28; pivot (16, 19) — середина основи вуха, як у звичайного (точки ear-* голови); основа ховається під голову, тож без контуру.
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Низька кругла «шапочка»: кінчик складений уперед і вниз, край складки — лінія inner, під ним тінь.
Маски шерсті — порожні групи (малює A9). back — спинка вуха: без рожевого, тінь біля основи.
-->
