<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 25" width="30" height="25">
<!-- cat/ear/folded/back — висловухе вухо (шотландська висловуха, українська левкоя) (слоти ear-far і ear-near — той самий кадр), ракурс back (¾ ззаду). Пакет A8a (варіанти форм), art/STYLE.md.
size 30×25; pivot (15, 16) — середина основи вуха, як у звичайного (точки ear-* голови); основа ховається під голову, тож без контуру.
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Низенька «шапочка» завширшки зі звичайну основу, ледь вища за контур черепа (верх ≈ 9 над pivot, у звичайного 11,7): кінчик складений уперед і вниз «дзьобиком» до ока, під ним виїмка й тінь, одна лінія складки (inner), без рожевого. back — спинка складеного вуха: низький круглий горбик без складки.
Маски шерсті (A9b) — як у звичайного: поінт — усе вухо, tortie-a — верх, tortie-c — основа, тікований — темний кінчик своєї форми. back — спинка вуха: без рожевого, тінь біля основи.
-->
