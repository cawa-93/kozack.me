<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 35" width="32" height="35">
<!-- cat/ear/tufted/front — вухо з китицями (мейнкун, норвезька лісова) (слоти ear-far і ear-near — той самий кадр), ракурс front (¾ спереду). Пакет A8a (варіанти форм), art/STYLE.md.
size 32×35; pivot (16, 26) — середина основи вуха, як у звичайного (точки ear-* голови); основа ховається під голову, тож без контуру.
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Китиця на кінчику — чорнильне «полум'я» (як у рисі); у front рожеве лише вгорі, знизу — пасма пуху кольору шерсті.
Маски шерсті (A9b) — як у звичайного: поінт — усе вухо, tortie-a — верх, tortie-c — основа, тікований — темний кінчик своєї форми. back — спинка вуха: без рожевого, тінь біля основи.
-->
