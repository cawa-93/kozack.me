<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 35 38" width="35" height="38">
<!-- cat/ear/tufted/back — вухо з китицями (мейнкун, норвезька лісова) (слоти ear-far і ear-near — той самий кадр), ракурс back (¾ ззаду). Пакет A8a (варіанти форм), art/STYLE.md.
size 35×38; pivot (18, 29) — середина основи вуха, як у звичайного (точки ear-* голови); основа ховається під голову, тож без контуру.
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Велике (майже як large: мейнкун великовухий), китиця на кінчику — чорнильне «полум'я» (як у рисі); у front рожеве лише вгорі, знизу — пасма пуху кольору шерсті.
Маски шерсті (A9b) — як у звичайного: поінт — усе вухо, tortie-a — верх, tortie-c — основа, тікований — темний кінчик своєї форми. back — спинка вуха: без рожевого, тінь біля основи.
-->
