size 33×33; pivot (18, 24) — середина основи вуха, як у звичайного (точки ear-* голови); основа ховається під голову, тож без контуру.
Шари: fill, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, detail, shade, ink.
Верхня третина вигнута дугою назад, кінчик дивиться назад і вниз; згин — лінія inner.
Маски шерсті — порожні групи (малює A9). back — спинка вуха: без рожевого, тінь біля основи.
-->
