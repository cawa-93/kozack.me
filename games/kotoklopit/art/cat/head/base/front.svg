<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 47 43" width="47" height="43">
<!-- cat/head/base/front — голова (з щоками, без вух і обличчя), ракурс front (¾ спереду). Еталон F1b, art/STYLE.md; пасма довгої шерсті — A7 (хвиля 2).
size 47×43; pivot (15, 27) — шия (основа черепа над плечима), навколо неї голова киває; points: ear-far (29.5, 10), ear-far-back (14.5, 11), ear-near (14.5, 11.5), ear-near-back (29, 10.5), eyes (26, 18.6), muzzle (27.8, 24.4), mouth (27.8, 25.8), top (22, -6).
Шари: fill, fluff, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, shade, ink, fluff-ink.
front: обличчя повернуте праворуч — точки очей, морди й рота зсунуті до правого краю. back: потилиця, видно праву щоку.
fluff / fluff-ink — «комір» довгої шерсті (лише довгошерсті): front — пасма, що звисають з-під щелепи перед грудьми, чорнило
лише «шевронами» пасом, без суцільного контуру (лінія навскіс через груди читалася нашийником); back — пасма на щоках і шиї.
-->
