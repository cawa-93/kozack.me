<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 43" width="52" height="43">
<!-- cat/head/base/back — голова (з щоками, без вух і обличчя), ракурс back (¾ ззаду). Еталон F1b, art/STYLE.md; пасма довгої шерсті — A7 (хвиля 2).
size 52×43; pivot (20, 27) — шия (основа черепа над плечима), навколо неї голова киває; points: ear-far (34.5, 10), ear-far-back (19.5, 11), ear-near (19.5, 11.5), ear-near-back (34, 10.5), eyes (31, 18.6), muzzle (32.8, 24.4), mouth (32.8, 25.8), top (27, -6).
Шари: fill, fluff, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, shade, ink, fluff-ink.
front: обличчя повернуте праворуч — точки очей, морди й рота зсунуті до правого краю. back: потилиця, видно праву щоку.
fluff / fluff-ink — «комір» довгої шерсті на щоках і під щелепою (лише довгошерсті).
-->
