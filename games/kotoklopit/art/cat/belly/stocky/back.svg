<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69 50" width="69" height="50">
<!-- cat/belly/stocky/back — живіт вагітної кремезної статури, ракурс back (¾ ззаду). A8b «Кіт — накладки тулубів і животи» (хвиля 2), маски шерсті — A9a; рукою еталонів F1b і основи A7, art/STYLE.md.
size 69×50; pivot (21, 26) — центр таза — те саме полотно й pivot, що cat/body/stocky; points: neck (44.1, 15.7), neck-back (46.9, 12.1), neck-base (40.4, 18.1), neck-base-back (43.2, 14.5), shoulder-far (49.7, 24), shoulder-far-back (44.6, 24), shoulder-near (44.6, 27.5), shoulder-near-back (49.7, 27.5), hip-far (25.1, 24), hip-far-back (20, 24), hip-near (20, 27.5), hip-near-back (25.1, 27.5), tail (14.4, 16.9), tail-back (15.3, 15.7), back (33, 12.1), back-back (31.1, 9.7).
Шари: fill, fluff, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, shade, ink, fluff-ink.
Окрема частина над тулубом (слот на z тулуба + 0,5, під ближніми лапами; та сама кістка й кадр-трансформ, що тулуб): видно лише в помітно вагітної (§9.8).
Верхній край захований у тулубі по верхній межі смуги тіні тулуба — без контуру; низ — круглий живіт між лапами майже до підлоги
(≈ 4 над нею; полотно тулуба — із запасом донизу), контур — лінза змінної ширини: 4,4 знизу посередині, нанівець на кінцях, де живіт
сходить на внутрішній край важкого контуру тулуба. Тінь — серп знизу, що на кінцях переходить у смугу тіні тулуба; верх живота світлий.
Маски шерсті (A9a) — ті самі фігури, що в тулубі цієї статури (cat/body/stocky), тож на межі з тулубом шва немає; білі плями сягають низу живота.
fluff / fluff-ink — дрібна бахрома довгої шерсті знизу живота (лише довгошерсті).
-->
