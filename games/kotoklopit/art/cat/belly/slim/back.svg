<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 46" width="72" height="46">
<!-- cat/belly/slim/back — живіт вагітної стрункої статури, ракурс back (¾ ззаду). A8b «Кіт — накладки тулубів і животи» (хвиля 2), маски шерсті — A9a; рукою еталонів F1b і основи A7, art/STYLE.md.
size 72×46; pivot (23, 22) — центр таза — те саме полотно й pivot, що cat/body/slim; points: neck (48.1, 14.3), neck-back (51.4, 12), neck-base (43.7, 15.9), neck-base-back (47, 13.5), shoulder-far (54.6, 20), shoulder-far-back (48.6, 20), shoulder-near (48.6, 23.5), shoulder-near-back (54.6, 23.5), hip-far (25.8, 20), hip-far-back (19.8, 20), hip-near (19.8, 23.5), hip-near-back (25.8, 23.5), tail (13.2, 15.1), tail-back (14.3, 14.3), back (35, 12), back-back (32.8, 10.4).
Шари: fill, fluff, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, shade, ink, fluff-ink.
Окрема частина над тулубом (слот на z тулуба + 0,5, під ближніми лапами; та сама кістка й кадр-трансформ, що тулуб): видно лише в помітно вагітної (§9.8).
Верхній край захований у тулубі по верхній межі смуги тіні тулуба — без контуру; низ — круглий живіт між лапами майже до підлоги
(≈ 4 над нею; полотно тулуба — із запасом донизу), контур — лінза змінної ширини: 4,4 знизу посередині, нанівець на кінцях, де живіт
сходить на внутрішній край важкого контуру тулуба. Тінь — серп знизу, що на кінцях переходить у смугу тіні тулуба; верх живота світлий.
Маски шерсті (A9a) — ті самі фігури, що в тулубі цієї статури (cat/body/slim), тож на межі з тулубом шва немає; білі плями сягають низу живота.
fluff / fluff-ink — дрібна бахрома довгої шерсті знизу живота (лише довгошерсті).
-->
