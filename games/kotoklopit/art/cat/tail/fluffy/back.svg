<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 55 58" width="55" height="58">
<!-- cat/tail/fluffy/back — пухнастий хвіст (мейнкун, норвезька лісова, сомалі, ангора), ракурс back (¾ ззаду). Пакет A8a (варіанти форм), art/STYLE.md.
size 55×58; pivot (32, 45) — корінь хвоста на крупі; points: tip (28.6, 16.2), tip-back (38.4, 17.6).
Шари: fill, fluff, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, shade, ink, fluff-ink.
Широкий, край — пасма-«плавці», зачесані до кінчика (у fill і ink: пухнастий і в короткошерстих); fluff / fluff-ink — ще довші пасма довгошерстих.
front — за тулубом, back — перед крупом. Маски (A9b) — як у довгого: поінт — увесь хвіст, tortie-a — кінчик, b — корінь, c — середина; кільця табі й темний кінчик; білого немає.
-->
