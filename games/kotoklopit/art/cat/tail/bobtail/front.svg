<!-- cat/tail/bobtail/front — бобтейл — помпон (японський, американський), ракурс front (¾ спереду). Пакет A8a (варіанти форм), art/STYLE.md.
size 37×34; pivot (22, 22) — корінь хвоста на крупі; points: tip (18.4, 10.8), tip-back (21, 10.2).
Шари: fill, fluff, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, shade, ink, fluff-ink.
Кулька з пасмами по колу; корінь усередині. fluff / fluff-ink — 4 довші пасма довгошерстих лише на зовнішньому боці (угорі й назад, геть від крупа).
front — за тулубом, back — перед крупом. Маски (A9b) — як у довгого: поінт — увесь хвіст, tortie-a — кінчик, b — корінь, c — середина; кільця табі й темний кінчик; білого немає.
-->
