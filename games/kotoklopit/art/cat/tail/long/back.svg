<!-- cat/tail/long/back — довгий хвіст, у вихідній позі — гачком угору, ракурс back (¾ ззаду). Еталон F1b, art/STYLE.md; пасма довгої шерсті — A7 (хвиля 2); візерунок на пасмах — A9a.
size 48×53; pivot (30, 41) — корінь хвоста на крупі; points: tip (25.6, 14.6), tip-back (35.8, 16.4).
Шари: fill, fluff, point, tortie-a, tortie-b, tortie-c, tabby-classic, tabby-mackerel, tabby-spotted, tabby-ticked, white-1, white-2, white-3, shade, ink, fluff-ink.
front — за тулубом (кінчик загнутий уперед), back — перед тулубом, піднятий угору.
fluff / fluff-ink — пасма довгої шерсті вздовж хвоста («пір'їна»), лише довгошерсті.
Кільця табі й темний кінчик тривають і на пір'їні (A9a): продовження обтято поза силуетом хвоста (clipPath …-plume), тож короткошерстих не змінює.
-->
