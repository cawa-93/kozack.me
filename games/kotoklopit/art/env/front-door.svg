<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 224" width="124" height="224">
<!-- env/front-door — вхідні двері квартири на повну висоту для фото титрів (§4.2, група «Втеча»): прочинені назовні, за ними — сходи.
size 124×224; pivot (62, 198) — точка підлоги посередині порогу, на лиці стіни (площина y = 0, як задня стіна); points — немає.
Отвір 0,88 клітинки × 160 у білому наличнику (enamelHi, 0,085 клітинки збоку, 9 зверху; «історія» — облуплена фарба на лівому
стояку). Стіни довкола немає, як у env/window-bird: усе за дверима обтято по отвору. Коробка завглибшки 0,12: лівий укіс enamel у тіні soft,
поріг woodHi. Полотно прочинене назовні на 27°, петлі праворуч на зовнішньому боці коробки: видно
внутрішню грань, оббиту, як і зовнішня в env/door, червоним дермантином (red, стьобка ромбами redLo, латунні цвяшки mustard), з латунними
ручкою, замком і вічком.
За дверима — сходовий майданчик у напівтіні (base: в отворі світла менше): світла плитка tile зі швами tileLo, марш угору сірими сходинками (grey, носки greyHi),
дерев'яний поручень woodLo на стійках darkHi, стіна під'їзду — олійна фарба green унизу, побілка enamel угорі, смуга greenLo між ними. Без станів і шарів.
-->
