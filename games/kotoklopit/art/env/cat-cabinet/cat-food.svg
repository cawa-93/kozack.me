<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 184" width="192" height="184">
<!-- env/cat-cabinet/cat-food — накладка шафки «котячий корм» (§6.4): що видно зовні, у полотні й з pivot шафки.
size 192×184; pivot (120, 120) — той самий, що в env/cat-cabinet; points: —.
Стани (FillStage): st-full-0 — порожньо: праві дверцята прочинені на 40°, нутро темне, полиця порожня; st-full-1 — мало:
пласкенький пакет лежить на кришці етикеткою догори; st-full-2 — половина: пакет до половини; st-full-3 — багато:
повний пакет із прищіпкою; st-full-4 — ущерть: роздутий пакет, гранули розсипані по кришці. Пакет червоний з
етикеткою-рибкою. Пакет стоїть на кришці, тож однаково лягає і на зачинену, і на відчинену котом шафку. Без шарів.
-->
