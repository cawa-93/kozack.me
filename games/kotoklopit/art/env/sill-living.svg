<!-- env/sill-living — підвіконня з батареєю у вітальні, під вікном у лівій задній стіні (клітинка 1,8). Пакет A1a.
size 144×156; pivot (72, 116) — точка підлоги під центром клітинки (1,5; 8,5); points: seat (47,5; 34) — де сидить кіт
(1,12; 8,5 — дзеркало спальні: посередині дошки на 0,12 від стіни; у симуляції кіт на (1,3; 8,5), а ізометричний вигляд
садовить його в цю точку, isoCatPerch) на верху дошки.
Те саме, що sill-bedroom, але біля стіни x = 1 (дзеркально за ізометрією, світло те саме): дошка y 8,04–8,96, глибина
0,28 (слід у грі — 0,3), верх z 70; батарея з трубою, важкий низ батареї й дошки. «Історія» — низенький кругленький
кактус (greenLo з ребрами green, щоб не зливатися з оливковою фіранкою) з рожевою квіткою в теракотовому
горщику (orange) на дальньому кінці дошки (≈ 1,16; 8,22): кіт на seat ближчий до камери й перекриває його правильно.
Без станів і шарів.
-->
