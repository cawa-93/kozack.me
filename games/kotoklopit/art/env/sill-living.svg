size 144×156; pivot (72, 116) — точка підлоги під центром клітинки (1,5; 8,5); points: seat (59, 39,5) — де сидить кіт
(WINDOWS: 1,3; 8,5) на верху дошки.
Те саме, що sill-bedroom, але біля стіни x = 1 (дзеркально за ізометрією, світло те саме): дошка y 8,04–8,96, глибина
0,34 (слід у грі — 0,3; кіт сидить на 0,3, тож дошка трохи глибша), верх z 70; батарея з трубою. «Історія» — кактус із
квіткою в теракотовому горщику на ближньому кінці дошки (≈ 1,17; 8,8). Без станів і шарів.
-->
