<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 172" width="144" height="172">
<!-- env/sink — умивальник на дерев'яній тумбі (клітинка 11,1; слід 1×1; стільниця 70, кран до 92). Пакет A3, art/STYLE.md.
size 144×172; pivot (72, 132) — точка підлоги під центром сліду; points: edge (72, 62) — середина стільниці над чашею, де сидить кіт (його корінь); tap (79, 43) — кінчик вилива крана, з якого п'є кіт.
Стани: st-off — кран закрито, важіль опущено; st-running — кран відкрили котові: важіль піднято, з вилива б'є струмінь, бризки й калюжка в чаші.
Лицьова грань — до кімнати (+y); праву частину тумби в грі закриває внутрішня стіна x = 12 (66), тож усе головне — на стільниці й ліворуч. «Історія» — склянка з двома щітками. Без шарів: один кадр у готових кольорах.
-->
