<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" width="120" height="72">
<!-- env/wire — дріт комп'ютера (§9.12, «Гризіння»): з вилки в системному блоці (A4, env/computer) по підлозі вільною петлею до стіни ряду 5
і вгору до вилки в розетці. Пакет A1b.
size 120×72; pivot (56, 52) — центр клітинки WIRE_TILE (8,5; 6,5) на підлозі; points: desk (22.1, 20.1) — вилка в системному
блоці (грань +x корпусу під столом, x 7,8), socket (99.2, 22.4) — вилка в розетці.
Розетку (накладку з гніздами, z 17–31) малює стіна env/wall/inner/row5-x5; тут лише вилки (сірі, з рифленням). Дріт сортується як точка pivot,
тобто після стола, тож вилку на грані системного блока видно поверх нього.
Стани: st-whole — цілий світло-сірий дріт у чорнильному контурі; st-chewed — перекушений посередині петлі (home.wireChewed: комп'ютер не
працює, доки не полагодять, — те саме, що icon/wire): два кінці трохи розведені, з кожного стирчать мідні жилки й обгризена ізоляція, між
ними порожньо, на підлозі крихти. Без іскор (іскра — fx/spark, A6).
Контур LINE_SMALL. Без шарів.
-->
