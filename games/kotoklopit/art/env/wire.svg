<!-- env/wire — дріт комп'ютера (§9.12, «Гризіння»): з-під правого краю стола по підлозі вільною петлею до стіни ряду 5 і вгору до вилки в розетці. Пакет A1b.
size 120×72; pivot (56, 52) — центр клітинки WIRE_TILE (8,5; 6,5) на підлозі; points: desk (29.1, 33.4) — де дріт виходить з-під стола, socket (99.2, 22.4) — вилка.
Розетку (накладку з гніздами, z 17–31) малює стіна env/wall/inner/row5-x5; тут лише вилка, що в ній сидить (сіра, з рифленням).
Стани: st-whole — цілий світло-сірий дріт у чорнильному контурі; st-chewed — посередині петлі ізоляцію згризено: видно мідь, кінці обтріпані, на підлозі крихти. Без іскор (іскра — fx/spark, A6).
Контур LINE_SMALL. Без шарів.
-->
