<!-- env/sterile-bin — бак корму для стерилізованих (клітинка 18, 6; слід 1 × 1; до 50). Пакет A4, art/STYLE.md.
size 160×130; pivot (72, 90) — точка підлоги під центром сліду; points: —.
Стани (FillStage, §6.4): st-full-0 — кришка знята й притулена праворуч, бак порожній; st-full-1…st-full-3 — кришка на місці, корм у віконці на ¼, ½ і ¾; st-full-4 — корм гіркою, кришка лежить криво, кілька гранул на підлозі.
Без шарів: один кадр у готових кольорах. Синій пластик; віконце рівня — на грані +y, етикетка з паличками — на грані +x. Корм — зеленуваті палички (green, greenHi), як у мисках для стерилізованих (A5), хвиля 3.
-->
