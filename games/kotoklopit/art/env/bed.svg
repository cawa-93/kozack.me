<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 184" width="208" height="184">
<!-- env/bed — ліжко з ковдрою (клітинки 1–2 × 1–3, слід 1 × 2; верх ковдри 40, узголів'я до 72). Пакет A4, art/STYLE.md.
size 208×184; pivot (104, 128) — точка підлоги під центром сліду (1,5; 2); points: blanket (91, 94.5) — верх ковдри, де спить кіт і горбик теплолюба (0,5 / 0,6 сліду, z 40); pillow (149, 61.5) — подушка (0,5 / 0,15, z 44).
Стани: st-made — застелене (лише спільні шматки); st-hump — під ковдрою спить теплолюб (§9.12): горбик ковдри біля blanket, вушка й кінчик хвоста малює скелет кота.
Без шарів: один кадр у готових кольорах. Історії: серце, вирізане в узголів'ї; гірчична латка на ковдрі. Під рамою — темна щілина (там ховаються коти).
-->
