<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 120" width="108" height="120">
<!-- env/window-bird — вікно з підвіконням для фото титрів (§4.2, група «Вікно»): за склом — пташка на гілці чи порожнє небо.
size 108×120; pivot (54, 82) — місце кота на підвіконні: верх дошки посередині, на 0,1 клітинки від стіни (як seat у
env/sill-*); points — немає.
Отвір у задній стіні (площина y = 0) 0,9 клітинки × 57, край outer; рама enamelHi в глибині 0,1 (лівий укіс — тінь soft):
вузька стулка з ручкою біля імпосту ліворуч, велика шибка праворуч, кватирки вгорі; небо blueHi з хмарою paper, на склі — косі смуги glassHi.
Підвіконня — дошка enamel/enamelHi 1 × 0,3 клітинки, завтовшки 10, верх на рівні низу отвору; «історія» — відбита
емаль на передньому краї. Стіни довкола немає: вікно стоїть на фото само, як накладка вікна на стіну квартири.
Стани: st-bird — у великій шибці гілка woodLo з листками green і на ній пташка того самого виду, що icon/bird у баблі думки (тулуб
blue — темніший за небо, черевце paper, крило й хвіст blueLo, дзьоб mustard), дивиться в кімнату; st-empty — лише небо. Без шарів.
-->
