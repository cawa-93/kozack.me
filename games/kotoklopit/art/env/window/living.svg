<!-- env/window/bedroom — вікно в задній стіні спальні (клітинка стіни 4,0), накладка поверх плити стіни. Еталон F1, art/STYLE.md.
size 128×204; pivot (100, 178) — верхня вершина ромба клітинки (4,0): кадр стає в toScreen(4, 0).
Отвір x 4,1–4,9, z 72–172 у грані y = 1; рама в глибині 0,1 клітинки (видно лівий і нижній укоси); кватирка зліва
вгорі; фіранки на карнизі z 188, x 3,7–5,3, до підвіконня (низ z 74–76). Підвіконня — окремий об'єкт sill-bedroom: верх
дошки 70 (SILL_TOP у маніфесті), вона стає під отвором і нічого в ньому не закриває. Без шарів.
-->
