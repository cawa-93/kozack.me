<!-- env/window/kitchen — вікно в задній стіні кухні (клітинка стіни 16,0) над правою стільницею, накладка поверх плити стіни. Пакет P2a «Арт і вигляд декору» (§8.9, рішення автора 2026-11-02: «Додати вікно на кухню» — лише декор, без підвіконня).
size 104×176; pivot (100, 172) — верхня вершина ромба клітинки (16,0): кадр стає в toScreen(16, 0), як вікно спальні; points: —.
Отвір x 16,1–16,9, z 125–185 у грані y = 1 (PANES у src/view/decor.ts): над кахельним фартухом (z 56–118), під кришкою стіни (200).
Рама в глибині 0,1 (видно лівий і нижній укоси), дві стулки — скло z 131–176 (ліва x 16,165–16,455, права 16,545–16,835), ручка на правій.
Рулонна штора в смужку (red / redHi): касета на стіні над отвором z 187–195 (виступ 0,075), полотно опущене до z 172 — закриває верхню
планку рами й верх скла (видне скло — z 131–170), планка-обважнювач, праворуч шнур із намистиною до z 150. Фіранок немає: місця під
кришкою мало. Без шарів.
-->
