<!-- env/candle — свічка в емальованому підсвічнику, лише в день відключення (§4.1 «Планове відключення», рішення автора 2026-11-02: свічки стоять по квартирі весь день і самі запалюються в темний час; лише вигляд — коти їх не чіпають). Пакет P2a «Арт і вигляд декору».
size 44×54; pivot (18, 42) — центр дна блюдця на поверхні господаря (CANDLES у src/view/decor.ts: at, z — висота поверхні); points: flame (18, 13) — середина полум'я, на 29 над поверхнею.
Синє емальоване блюдце Ø 0,25 клітинки з вушком праворуч, біла господарська свічка Ø 0,1 заввишки до 22 над поверхнею, трохи обгоріла: зверху ямка розтопленого воску (історія — свічку вже палили).
Стани: st-out — погашена, загнутий чорний ґніт; st-lit — язичок полум'я orange з серцевиною mustardHi (сяйво — код). Тінь на поверхні — base.
Контур LINE_RIG: дрібниця 20–40 (art/STYLE.md §5 [Уточнено]), як кухоль mess/trinket/mug на тому самому столі. Без шарів.
-->
