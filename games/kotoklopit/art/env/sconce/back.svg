<!-- env/sconce/back — бра на задній стіні y = 0 (лице y = 1) у спальні над узголів'ям ліжка (SCONCES у src/view/decor.ts, (1,5; 1)). Пакет P2a «Арт і вигляд декору» (§8.9, рішення автора 2026-11-02: «кілька настінних світильників як декор та світлові ефекти до них»).
size 48×142; pivot (36, 138) — точка підлоги біля лиця стіни під бра (як env/toilet-roll); points: lamp (22.5, 22.5) — центр абажура на висоті 122 (SCONCES[].lamp), вісь на 0,21 від стіни.
Латунна пластина на стіні (z 91–108), трубка-кронштейн, патрон; гірчичний тканинний абажур — зрізаний конус Ø 0,33 знизу, Ø 0,19 угорі, z 111–133.
Історія: шнурок-вимикач із дерев'яною намистиною (до z ≈ 82, вище за узголів'я 72).
Стани: st-off — тканина mustard, у верхньому отворі темне нутро й сіра колба; st-on — тканина mustardHi, світла смуга під обідком, нутро й колба paper
(сяйво домальовує код, BACKDROP.glow). Контур LINE_SMALL (річ менша за 60). Без шарів.
