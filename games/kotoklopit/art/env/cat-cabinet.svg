<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 184" width="192" height="184">
<!-- env/cat-cabinet — шафка з котячим кормом (клітинка 18,3; слід 1×1; заввишки 80). Дерев'яна, дві дверцята на видній грані
до кімнати: ліві з лапкою, праві з рибкою (§6.4), ручки-скоби біля стику.
size 192×184; pivot (120, 120) — точка підлоги під центром сліду; points: lock (90.5, 93.5) — центр корпусу
замка item/lock/* на скобах стику, lock-open (94.5, 95.5) — на скобі правих дверцят, top (120, 40) — центр кришки.
Стани: st-closed — зачинена; st-open — відчинив кіт (§9.12): ліві дверцята розчахнуті на 90° навколо петель біля лівого
кута (видно їхній внутрішній бік), усередині темно, на полиці совок; замок лишається на правих. Пакет корму зверху — накладка env/cat-cabinet/cat-food.
Подряпини кігтями на лівих дверцятах — котячий слід, накладка env/trace/cabinet (ті самі полотно, pivot і стани): з'являється
з котами (§9.12, «Котячі сліди в квартирі»), а без неї дверцята цілі. Пакет корму накладки стоїть на кришці праворуч спереду. Без шарів.
-->
