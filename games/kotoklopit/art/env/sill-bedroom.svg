size 144×156; pivot (72, 116) — точка підлоги під центром клітинки (4,5; 1,5); points: seat (96,5; 34) — де сидить кіт
(WINDOWS: 4,5; 1,12) на верху дошки.
Дошка enamel/enamelHi вздовж стіни y = 1: x 4,04–4,96, глибина 0,34 (слід у грі — 0,3), верх z 70, низ 58; під нею —
