<!-- env/sill-bedroom — підвіконня з батареєю в спальні, під вікном у задній стіні (клітинка 4,1). Пакет A1a.
size 144×156; pivot (72, 116) — точка підлоги під центром клітинки (4,5; 1,5); points: seat (96,5; 34) — де сидить кіт
(4,5; 1,12 — посередині дошки на 0,12 від стіни, як WINDOWS) на верху дошки.
Дошка enamel/enamelHi вздовж стіни y = 1: x 4,04–4,96, глибина 0,28 (слід у грі — 0,3), верх z 70, низ 58; під нею —
батарея з 7 секцій (x 4,12–4,86, глибина 0,15, z 12–52) з трубою в підлогу; решта клітинки — підлога з тінню base.
«Історія» — складений м'який плед (red у широку клітинку redLo) з опуклим верхом і шарами складок там, де сидить кіт;
ближній кут звисає через край дошки з трьома китицями. Без станів і шарів.
-->
