size 340×194; pivot (74, 24) — верхня вершина ромба першої клітинки (12, 11) на підлозі; points — немає.
Кришка — cut, видимі зовнішні грані — cut і тінь soft; контур: силует outer, ребра inner, низ heavy.
Лівий край (x = 12) — укіс вхідних дверей, силует; правий стикується з row11-x16 без контуру й на 0,03 клітинки заходить під нього.
Без станів і шарів.
-->
