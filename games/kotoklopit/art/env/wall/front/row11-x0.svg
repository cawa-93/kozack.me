<!-- env/wall/front/row11-x0 — передній плінтус: клітинки x 0–3, y 11–11, висота 14. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 340×194; pivot (74, 24) — верхня вершина ромба першої клітинки (0, 11) на підлозі; points — немає.
Кришка — cut, видимі зовнішні грані — cut і тінь soft; контур: силует outer, ребра inner, низ heavy.
Кутовий шматок (0, 11) упирається в торець задньої стіни вітальні — там кришка має лінію inner; правий край (x = 4) стикується з row11-x4 без контуру й на 0,03 клітинки заходить під нього.
Без станів і шарів.
-->
