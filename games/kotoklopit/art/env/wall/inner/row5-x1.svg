<!-- env/wall/inner/row5-x1 — низька внутрішня стіна: клітинки x 1–2, y 5–5, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 212×182; pivot (74, 76) — верхня вершина ромба першої клітинки (1, 5) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань y = 6 — шпалери вітальні з гілочками, плінтус 15; «історія» — відклеєний на шві кутик шпалер угорі (x ≈ 2,3). Торець x = 3 — одвірок проходу до спальні (біла фарба enamel). Лівий край (x = 1) упирається в задню стіну вітальні — внутрішній кут лінією inner.
Без станів і шарів.
-->
