<!-- env/wall/inner/row5-x17 — низька внутрішня стіна: клітинки x 17–18, y 5–5, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 212×182; pivot (74, 76) — верхня вершина ромба першої клітинки (17, 5) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань y = 6 — шпалери вітальні, плінтус 15; «історія» — кут біля проходу до кухні (x 17–17,35), який дере «Руйнівник диванів», стоячи в проході на DOORFRAME (16, 5) (§9.12; лівий торець x = 17 камері не видно, тож сліди — на лицьовій грані біля самого кута): чотири борозни від кігтів wallLivingLo нижче зливаються в обдерту до штукатурки enamelLo латку (рваний край зі світлим волокном паперу), клапоть праворуч відстав і загнувся виворотом enamel, на лаку плінтуса — подряпини woodHi. Торець x = 19 — зріз (cut і тінь base), як торець задньої стіни кухні: передню стіну x = 19 зрізано до плінтуса, і низ торця закриває плінтус col19-y4.
Без станів і шарів.
-->
