<!-- env/wall/inner/row5-x17 — низька внутрішня стіна: клітинки x 17–18, y 5–5, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 212×182; pivot (74, 76) — верхня вершина ромба першої клітинки (17, 5) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань y = 6 — шпалери вітальні, плінтус 15; шпалери й лак плінтуса цілі: котячий слід — кут біля проходу до кухні (x 17–17,35), який дере «Руйнівник диванів», — окрема накладка env/trace/doorframe, з'являється з котами (§9.12, «Котячі сліди в квартирі»); під нею перший стовпчик гілочок сітки (x ≈ 17,16), як на інших сегментах ряду 5. Торець x = 19 — зріз (cut і тінь base), як торець задньої стіни кухні: передню стіну x = 19 зрізано до плінтуса, і низ торця закриває плінтус col19-y4.
Без станів і шарів.
-->
