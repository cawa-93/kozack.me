<!-- env/wall/inner/col12-y1 — низька внутрішня стіна: клітинки x 12–12, y 1–4, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 340×246; pivot (266, 76) — верхня вершина ромба першої клітинки (12, 1) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань x = 13 — до кухні: шпалери wallKitchen з ромбиками wallKitchenLo (як еталон F1), плінтус 15; «історія» — паперовий календар із червоною шапкою між холодильником і столом (y ≈ 2,5). Дальній край (y = 1) упирається в задню стіну кухні — лінія inner; ближній (y = 5) стикується зі стіною row5-x12 без контуру й на 0,03 клітинки заходить під неї.
Без станів і шарів.
-->
