<!-- env/wall/inner/row5-x5 — низька внутрішня стіна: клітинки x 5–9, y 5–5, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 404×278; pivot (74, 76) — верхня вершина ромба першої клітинки (5, 5) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань y = 6 — шпалери вітальні, плінтус 15; над (8,75; 6) — розетка дроту комп'ютера (біла накладка з двома гніздами, z 17–31; вилку малює env/wire). Торець x = 10 — одвірок проходу до ванної. Кришка над (7, 5) без контуру позаду: там стикується стіна col7-y1.
Без станів і шарів.
-->
