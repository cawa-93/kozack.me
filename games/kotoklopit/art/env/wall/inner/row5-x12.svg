<!-- env/wall/inner/row5-x12 — низька внутрішня стіна: клітинки x 12–14, y 5–5, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 276×214; pivot (74, 76) — верхня вершина ромба першої клітинки (12, 5) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань y = 6 — шпалери вітальні, плінтус 15. Торець x = 15 — одвірок кухні (DOORFRAME, §9.12: його дере «Руйнівник диванів»): біла фарба з подряпинами кігтів, де видно дерево. Кришка над (12, 5) без контуру позаду: там стикується стіна col12-y1.
Без станів і шарів.
-->
