<!-- env/wall/inner/col7-y1 — низька внутрішня стіна: клітинки x 7–7, y 1–4, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 340×246; pivot (266, 76) — верхня вершина ромба першої клітинки (7, 1) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань x = 8 — до ванної: кахель wallBathroom 0,25 клітинки × 15 зі швами wallBathroomLo (як задня стіна ванної A1a), плінтус 15; дві кахлини з синьою квіточкою, як у фризі A1a, навскіс над котячими туалетами (y ≈ 3,1, z 45–60 і y ≈ 3,9, z 30–45); «історія» — гачок зі сливовим рушником (plum, дві смужки plumHi; гірчичний уже висить на душі A3) (y ≈ 2,45). Дальній край (y = 1) упирається в задню стіну — внутрішній кут лінією inner; ближній (y = 5) стикується зі стіною row5-x5 без контуру й на 0,03 клітинки заходить під неї.
Без станів і шарів.
-->
