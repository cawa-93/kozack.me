<!-- env/wall/inner/col7-y1 — низька внутрішня стіна: клітинки x 7–7, y 1–4, висота 66. Пакет A1b, за еталоном F1 (art/STYLE.md, §11 «Внутрішні стіни», «Передні плінтуси»).
size 340×246; pivot (266, 76) — верхня вершина ромба першої клітинки (7, 1) на підлозі; points — немає.
Кришка — cut; видима грань до кімнати — оздоблення тієї кімнати з плінтусом 15; контур: силует outer, ребра inner, низ heavy.
Лицьова грань x = 8 — до ванної: кахель wallBathroom 0,25 клітинки × 15 зі швами wallBathroomLo (як задня стіна ванної A1a), плінтус 15; «історія» — гачок із гірчичним рушником у червону смужку (y ≈ 2,45). Дальній край (y = 1) упирається в задню стіну — внутрішній кут лінією inner; ближній (y = 5) стикується зі стіною row5-x5 без контуру й на 0,03 клітинки заходить під неї.
Без станів і шарів.
-->
