<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 224" width="192" height="224">
<!-- env/fridge/food — накладка холодильника «продукти» (§6.4): наповнення, у полотні й з pivot еталона env/fridge.
size 192×224; pivot (124, 188) — той самий, що в env/fridge; points: —.
Стани (FillStage; холодильник за iso/looks.ts: full-0 — на відчиненому, full-1…4 — на зачиненому):
st-full-0 — порожньо: прочинений і вимкнений — нутро в густій тіні, полиці й полички дверцят порожні (накладка закриває
їжу еталона open); 1–4 — на зачиненому горить зелений вогник, а нагорі — стільки продуктів, скільки запасу, як у
шафки з кормом і мішка (доробки після хвилі 3: вогник ≈ 3 одиниці на телефоні не видно, і мало від порожнього не
відрізнялося): st-full-1 — мало: банка огірків; st-full-2 — половина: + хлібина; st-full-3 — багато: + пакет молока
з двосхилим верхом позаду хлібини; st-full-4 — ущерть: + боки роздуті, дверцята не зачиняються — з щілини стирчать
морква й ковбаса. Без шарів: один кадр у готових кольорах.
-->
