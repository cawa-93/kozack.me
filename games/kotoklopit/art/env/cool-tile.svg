<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 70" width="132" height="70">
<!-- env/cool-tile — шматок прохолодної плитки з підлоги ванної для фото титрів (§4.2, «Теплолюбність −»: кіт лежить на плитці).
size 132×70; pivot (66, 35) — центр шматка на підлозі (там лежить кіт); points — немає.
Шматок 0,8 × 0,8 клітинки, 3 × 3 плитки «восьмикутник із вставкою» (≈ як у env/room/bathroom/floor, де плитка — третина клітинки): тло — шви floorTileLo, восьмикутники
floorTile, вставки wallBathroom (на краю — обтяті). Плиток 3 × 3, а не 2 × 2: на фото кіт лежить посередині, і візерунок має
лишатися видно по кутах. Плаский, як плита підлоги: силует outer, передні краї heavy.
«Історія» — тріщина через ріг однієї плитки (inkSoft). Без станів і шарів.
-->
