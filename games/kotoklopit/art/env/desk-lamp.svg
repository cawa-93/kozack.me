<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 66" width="62" height="66">
<!-- env/desk-lamp — настільна лампа на столі з комп'ютером (§8.9 «День і ніч», рішення автора 2026-11-03: «Додати лампу на робочий стіл»), у задньому правому куті стола біля стіни (DESK_LAMP у src/view/decor.ts).
size 62×66; pivot (33, 47.5) — центр основи на стільниці (висота 54); points: lamp (21, 19) — лампочка в абажурі, на 28.5 над стільницею і -12 убік від pivot.
Зелена емальована основа Ø 0,18 з кнопкою-вимикачем, металева стійка до шарніра (z 29), плече вперед-угору, зелений абажур-конус дивиться ліворуч-униз — на стіл перед монітором, тож видно нутро абажура.
Історія: кабель від основи назад, за задній край стола (до розетки на стіні ряду 5).
Стани: st-off — нутро абажура greenLo в тіні, лампочка greyHi; st-on — нутро mustardHi / paper, лампочка enamelHi (сяйво й пляма на столі й підлозі — код). Вмикається сама з лампами квартири (lampsOn), у день відключення — off.
Контур LINE_RIG: річ 20–40 (art/STYLE.md §5). Без шарів.
-->
