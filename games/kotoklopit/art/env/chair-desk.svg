<!-- env/chair-desk — офісне крісло до стола з комп'ютером (вітальня): синя подушка на газліфті, хрестовина з п'ятьма колесами, спинка на кронштейні. Пакет «Стики персонажа» хвилі 3, art/STYLE.md.
size 96×116; pivot (48, 88) — точка підлоги під центром сидіння; points: seat (48, 53) — середина верху сидіння (35).
Стани — шматки для глибини: st-seat — тінь, хрестовина, колона й сидіння (за тим, хто сидить); st-backrest — кронштейн і спинка (перед ним: персонаж сидить спиною до камери). Обидва разом — ціле крісло.
Сидіння 0,42 × 0,4 клітинки, верх 35 (`PERSON_SEAT` 34 — низ таза), спинка z 42–75 з нахилом назад. Історія: латка сріблястого скотчу на порваній оббивці спинки.
Без шарів: один кадр у готових кольорах.
-->
