<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 204" width="272" height="204">
<!-- env/sofa — диван у вітальні (клітинки 13–15 × 10, слід 3 × 1; сидіння 34, спинка 60). Пакет A4, art/STYLE.md.
size 272×204; pivot (136, 132) — точка підлоги під центром сліду (14,5; 10,5); points: seat (142.5, 95) — сидіння, де сидять і сплять коти (0,5 / 0,4 сліду, z 34).
Без станів і шарів: один кадр у готових кольорах. Стоїть під передньою стіною: сидіння дивиться в кімнату (−y), камера бачить спинку й правий підлокітник; з-над спинки визирає дальній край подушок.
Історії: гірчичний плед у смужку на спинці; подерта кігтями оббивка на торці правого підлокітника.
-->
