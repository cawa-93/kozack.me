<!-- env/washer/detergent — пральний засіб (§6.4, §8.7): бірюзова каністра з помаранчевим ковпачком-міркою на кришці пральної машини, ззаду праворуч (кіт сідає посередині). Накладка наповнення, пакет A3.
size 168×172; pivot (96, 116) — те саме полотно й pivot, що env/washer.
