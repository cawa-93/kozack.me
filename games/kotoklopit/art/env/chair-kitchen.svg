<!-- env/chair-kitchen — кухонний стілець до стола: дерев'яний, як стіл, дві планки спинки, червона подушка з ґудзиком. Пакет «Стики персонажа» хвилі 3, art/STYLE.md.
size 80×116; pivot (40, 92) — точка підлоги під центром сидіння; points: seat (40, 57) — середина верху подушки (35).
Стани — шматки для глибини: st-seat — тінь, передні ніжки, царга, сидіння й подушка (за тим, хто сидить); st-backrest — задні ніжки-стояки й планки спинки (перед ним: персонаж сидить спиною до камери). Обидва разом — цілий стілець.
Сидіння 0,42 × 0,4 клітинки, подушка до 35 (`PERSON_SEAT` 34 — низ таза), стояки до 80 з нахилом назад. Історія: сердечко, вирізане на верхній планці.
Без шарів: один кадр у готових кольорах.
-->
