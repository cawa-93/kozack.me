<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 172" width="144" height="172">
<!-- env/sink/dressing — пластир і бинт (§6.4, §6.5): рожева коробочка пластирів із паперовим хрестиком і білі рулони бинта на стільниці умивальника, ззаду ліворуч між склянкою зі щітками й краном (флакон ліків — праворуч від крана). Накладка наповнення.
size 144×172; pivot (72, 132) — те саме полотно й pivot, що env/sink.
Стани full-0…full-4 (FillStage): 0 — порожня коробочка без кришки лежить на спинці, згори видно порожнє нутро; 1 — коробочка стоїть сторч; 2 — перед нею рулон бинта лежить на боці торцем зі спіраллю праворуч; 3 — два рулони; 4 — ущерть: третій рулон зверху в жолобі між двома. Без шарів: один кадр у готових кольорах.
Межі: праворуч — лівіше за вилив крана (x до 76: кран ближчий до глядача, а накладка лягає поверх умивальника), ліворуч — правіше за склянку й щітки (x від 53), спереду — до краю чаші. Контур дрібний, як у флакона ліків: силует 2,5, ребра й торці 2.
-->
