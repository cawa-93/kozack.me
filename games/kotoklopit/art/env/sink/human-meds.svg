<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 172" width="144" height="172">
<!-- env/sink/human-meds — ліки для себе (§6.4, §6.5): бурштиновий флакон пігулок з білою кришкою на стільниці умивальника, ззаду праворуч від крана. Накладка наповнення, пакет A3.
size 144×172; pivot (72, 132) — те саме полотно й pivot, що env/sink.
Стани full-0…full-4 (FillStage): 0 — порожній флакон перекинувся, кришка поруч; 1–3 — пігулок чверть, половина, три чверті (видно крізь бурштиновий пластик); 4 — повний: кришку знято й покладено поруч, пігулки горбиком над горлечком. Без шарів: один кадр у готових кольорах.
-->
