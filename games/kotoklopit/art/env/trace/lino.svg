<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 344" width="672" height="344">
<!-- env/trace/lino — котячий слід (GAME_DESIGN §9.12): надірваний і загнутий клапоть лінолеуму на кухні. Котячі сліди, підлоги.
size 672×344; pivot (272, 12) — як у env/room/kitchen/floor (верхня вершина ромба клітинки (13,1)); points — немає.
Накладка на підлогу кухні: те саме полотно й pivot, лягає в ту саму точку трохи над нею й під усім, що стоїть на підлозі.
Між плитою й столом (≈ 16,2; 2,5), де його не закривають меблі, миски й стіна ряду 5: дірка (cardboardLo — основа під
лінолеумом, з тінню під клаптем) і клапоть, загнутий назад на лінолеум виворотом (cardboardHi, тінь soft на згині). Разом із
підлогою — той самий клапоть, що був у плиті підлоги до котячих слідів. Без станів і шарів: один кадр у готових кольорах.
-->
