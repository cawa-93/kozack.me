<!-- env/trace/sofa — котячий слід (§9.12, «Котячі сліди в квартирі»): подерта кігтями оббивка на спинці дивана біля правого
підлокітника — на грані спинки +y, яку бачить камера (торець підлокітника, грань +x, закриває шафа з пилососом на (16, 10)).
Накладка на диван env/sofa: з'являється, щойно кіт уперше подер диван.
size 272×204; pivot (136, 132) — як у господаря (точка підлоги під центром сліду (14,5; 10,5)): стає в ту саму точку, трохи над ним.
Латка мішковини rope під розідраною тканиною в тіні soft, чотири рвані розрізи-лінзи ink від кігтів і три нитки inkSoft,
що звисають донизу; у правій третині спинки (x 151–174), між швом під валиком і низом, який у грі ховає передня стіна, —
праворуч від кота, що лежить на сидінні. Поверх сліду в господарі нічого не лягає (шов, контур підлокітника й важкий низ —
поза ним), тож рамки-обтинання немає. Без станів і шарів.
-->
