<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 672 344" width="672" height="344">
<!-- env/trace/bedroom-rug — котячий слід (GAME_DESIGN §9.12): петля, що вибилася з плетеного килимка біля ліжка, і подряпини кігтів на паркеті посеред спальні. Котячі сліди, підлоги.
size 672×344; pivot (272, 12) — як у env/room/bedroom/floor (верхня вершина ромба клітинки (1,1)); points — немає.
Накладка на підлогу спальні: те саме полотно й pivot, лягає в ту саму точку трохи над нею й під усім, що стоїть на підлозі.
Петля вибилася з краю круглого килимка (≈ 2,5; 2,0) з ближнього правого боку (≈ 3,0; 2,1) і лягла на дошки. Подряпини
кігтів — лінзи floorWoodLo на дошках: три паралельні борозни вздовж дошок посеред кімнати (≈ 4,5; 2,8) і дві коротші
навскіс дошок ближче до проходу (≈ 3,3; 3,5). Разом із підлогою — той самий паркет і килимок, що були в плиті підлоги до
котячих слідів. Без станів і шарів: один кадр у готових кольорах.
-->
