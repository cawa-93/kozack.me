size 192×184; pivot (120, 120) — той самий, що в env/cat-cabinet (полотно теж його); points: —.
Стани — ті самі, що в шафки: st-closed — три борозни від кігтів (woodLo, лінзами) знизу на лівих дверцятах біля стику, де кіт
лапав їх («Кмітливість у бешкеті»); st-open — порожньо: ліві дверцята розчахнуті й видно їхній внутрішній бік, а подряпини — на
зовнішньому. Без накладки дверцята цілі. Без шарів.
-->
