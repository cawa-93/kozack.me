size 252×158; pivot (106, 100) — той самий, що в env/door/leaf і env/door (точка підлоги під центром сліду дверей (11; 11,5)); points: —.
Чотири світлі борозни від кігтів (woodHi, лінзами) знизу на внутрішній дерев'яній грані прочиненого полотна, біля ручки: тут «Втікач»
проситься на сходи. Видно лише тоді, коли двері відчинені (зачинене полотно env/door показує зовнішній дермантин без подряпин). М'яка
тінь низу полотна й важкий низ контуру лягають на борозни, як на всю грань, — тому вони повторені тут, обтяті по борознах. Без
накладки грань ціла. Без шарів.
