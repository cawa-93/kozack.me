<!-- env/trace/wardrobe — котячий слід «подряпини кігтями на шухляді шафи в спальні» (§9.12, «Котячі сліди в квартирі»): накладка на env/wardrobe.
size 144×250; pivot (72, 210) — той самий, що в env/wardrobe (полотно теж його); points: —.
Три борозни від кігтів (woodLo, лінзами) на лівому краю шухляди внизу фасаду: кіт видерся на шафу, чіпляючись за неї
(«Лазіння»). Лягає на дерево шухляди між її контуром і ручкою, нічого з господаря не закриваючи, тож разом із ним — той самий
малюнок, що був у шафі до котячих слідів. Без накладки шухляда ціла. Без станів і шарів: один кадр у готових кольорах.
-->
