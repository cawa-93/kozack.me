<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
<!-- env/trace/boxes-claws/front — котячий слід «подряпини кігтями на коробках» (§9.12, «Котячі сліди в квартирі»): накладка на env/boxes/front.
size 144×144; pivot (72, 104) — той самий, що в env/boxes/front і env/boxes; points: —.
Стани — ті самі, що в купи (st-pile-1…4). Ті самі три борозни (cardboardLo), що й env/trace/boxes-claws, але на кадрі передніх стінок, який
у грі лягає поверх кота у верхній коробці й закриває всю купу нижче за борт: без цієї частини подряпини ховалися б під ним. Борозни
лежать нижче за край обтинання передніх стінок, тож обтинати їх не треба. Без накладки коробки цілі. Без шарів.
-->
