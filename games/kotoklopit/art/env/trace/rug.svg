<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1504 760" width="1504" height="760">
<!-- env/trace/rug — котячий слід (§9.12, «Котячі сліди в квартирі»): великий килим вітальні RUG (9–12 × 7–9), на якому
потягується й дере кігтями кіт. Накладка на підлогу вітальні env/room/living/floor: з'являється з котами.
size 1504×760; pivot (336, 12) — як у господаря (верхня вершина ромба клітинки (1, 6)), res 1,25: стає в ту саму точку, трохи над ним.
Загнутий дальній кут (9,1; 7,1): спершу латка паркету floorWood «ялинкою» (ті самі дошки й шви floorWoodLo, що в господаря) там,
звідки кут піднявся, — трикутник над лінією згину з полем під контур і бахрому; далі контур килима inner уздовж згину; тоді
загнутий кут виворотом догори — carpetHi з нитками основи carpetLo, смужка облямівки redLo на згині, під ним тінь soft.
Затяжки кігтями — три світлі лінзи redHi на полі праворуч від медальйона. Без станів і шарів.
-->
