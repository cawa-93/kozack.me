<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 310" width="544" height="310">
<!-- env/trace/bath-mat — котячий слід (GAME_DESIGN §9.12): загнутий куточок смугастого килимка перед душем. Котячі сліди, підлоги.
size 544×310; pivot (272, 12) — як у env/room/bathroom/floor (верхня вершина ромба клітинки (8,1)); points — немає.
Накладка на підлогу ванної: те саме полотно й pivot, лягає в ту саму точку трохи над нею й під усім, що стоїть на підлозі.
Ближній куточок килимка (≈ 8,9; 2,57) загнуто вгору: на його місці — плитка (floorTile) з тінню килимка вздовж краю, сам
куточок лежить на килимку виворотом (blueLo), обрізаний край — кінці контуру. Разом із підлогою — той самий килимок, що був
у плиті підлоги до котячих слідів. Без станів і шарів: один кадр у готових кольорах.
-->
<g id="p-floor">
<path d="M218.2 85.6L237.4 85.6L238.5 87.7L227.8 93.1L217.1 87.7Z" fill="#b8bdb2"/>
<path d="M218.2 85.6L227.8 90.4L237.4 85.6L238.5 87.7L227.8 93.1L217.1 87.7Z" fill="#3f2541" fill-opacity="0.16"/>
</g>
<g id="p-flap">
