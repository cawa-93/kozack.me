<path d="M237.4 85.6L218.2 85.6L229.1 82.1Z" fill="none" stroke="#2e1f29" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M216.4 84.7L218.2 85.6M237.4 85.6L239.2 84.7" fill="none" stroke="#2e1f29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
