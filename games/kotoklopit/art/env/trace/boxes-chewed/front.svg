<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
<!-- env/trace/boxes-chewed/front — котячий слід «погризений клапан коробки» (§9.12, «Котячі сліди в квартирі»): накладка на env/boxes/front.
size 144×144; pivot (72, 104) — той самий, що в env/boxes/front і env/boxes; points: —.
Стани — ті самі, що в купи (st-pile-1…4). Той самий зубчастий надгриз лівого переднього клапана, що й env/trace/boxes-chewed (з контуром
клапана поверх, обтятим рамкою довкола надгризу), але на кадрі передніх стінок, який у грі лягає поверх кота у верхній коробці: без цієї частини
надгриз ховався б під клапаном. Тут надгриз обтятий по самому клапану: його верх, що заходить на внутрішню стінку коробки за котом,
лишається лише в env/trace/boxes-chewed, тож не лягає на кота (у старому env/boxes/front ця латка висіла над котом). Без накладки
клапани цілі. Без шарів.
-->
