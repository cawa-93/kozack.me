<!-- env/trace/doorframe — котячий слід (§9.12, «Котячі сліди в квартирі»): кут низької стіни ряду 5 біля проходу до кухні
(x 17–17,35, лицьова грань y = 6 до вітальні), який дере «Руйнівник диванів», стоячи в проході на DOORFRAME (16, 5). Накладка
на сегмент env/wall/inner/row5-x17: з'являється з котами.
size 212×182; pivot (74, 76) — як у господаря (верхня вершина ромба клітинки (17, 5) на підлозі): стає в ту саму точку, трохи над ним.
Чотири борозни від кігтів wallLivingLo нижче зливаються в обдерту до штукатурки enamelLo латку (рваний край зі світлим волокном
паперу enamelHi, контур inner), клапоть праворуч відстав і загнувся виворотом enamel з тінню soft; на лаку плінтуса — подряпини
woodHi. Усе обтято по внутрішньому краю чорнила господаря (силует outer ліворуч, важкий низ heavy), як і було під ним.
Без станів і шарів.
-->
