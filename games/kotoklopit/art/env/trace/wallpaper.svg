<!-- env/trace/wallpaper — котячий слід (§9.12, «Котячі сліди в квартирі»): шпалери вітальні, подерті котом над плінтусом у
передньому куті (y 10,19–10,79, z 28–130). Накладка на задню стіну вітальні env/room/living/wall: з'являється з котами.
size 474×449; pivot (397, 276) — як у господаря (верхня вершина ромба клітинки (1, 6)): стає в ту саму точку, трохи над ним.
Чотири подряпини wallLivingLo віялом (лінзи ≈ 3,5) сходяться до рваного отвору до штукатурки enamelLo (неправильна замкнена
форма з контуром inner і світлим волокном паперу по зубцях); шматок шпалер тримається за верхній край отвору й відстає низом
уперед — лице wallLiving з гілочкою в тіні soft, вільний низ закрутився трубочкою (виворіт enamel, на торці спіраль), під ним —
тінь soft. Лише слід: цілі шпалери під ним (гілочки, шви, плінтус) малює господар. Без станів і шарів.
-->
