<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 266" width="144" height="266">
<!-- env/shower/figure — силует персонажа в душовій кабіні (§8.7): тінь за склом правої стулки, під лійкою.
size 144×266; pivot (72, 226) — те саме полотно й pivot, що env/shower; поверх кадру кабіни.
Стани: st-wash-1…4 — кадри миття, голова, плечі й руки над краєм пари кадру running (нижче їх закриває сама пара, тож вони обрізані по цьому краю); st-steam — пара поверх силуету; st-legs — решта тіла нижче цього краю: її видно лише крізь чисте скло холодного душу (running-cold).
Без контуру: shade із двох шарів — ширший і світліший дає м'який край.
-->
