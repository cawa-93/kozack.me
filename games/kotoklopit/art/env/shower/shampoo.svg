<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 266" width="144" height="266">
<!-- env/shower/shampoo — шампунь для котів (§6.4, §8.7): приземкувата рожева пляшечка з кришкою-вушками на поличці душу, перед гелем. Накладка наповнення, пакет A3.
size 144×266; pivot (72, 226) — те саме полотно й pivot, що env/shower: пляшечка стоїть на кутовій поличці (z 140) у дальньому куті кабіни, над склом.
Стани full-0…full-4 (FillStage): 0 — порожня пляшечка лежить на боці; 1–3 — рівень шампуню чверть, половина, три чверті; 4 — повна, з-під кришки лізе піна. Без шарів: один кадр у готових кольорах.
-->
