<!-- env/shower/hygiene — засоби гігієни персонажа (§6.4): синя пляшечка гелю з дозатором на поличці душу. Накладка наповнення, пакет A3.
size 144×266; pivot (72, 226) — те саме полотно й pivot, що env/shower: пляшечка стоїть на кутовій поличці (z 140) у дальньому куті кабіни, над склом.
Стани full-0…full-4 (FillStage): 0 — порожня пляшечка лежить на боці; 1–3 — рівень гелю чверть, половина, три чверті (видно крізь пластик); 4 — повна, з дозатора лізе піна. Без шарів: один кадр у готових кольорах.
-->
