<!-- env/vacuum — шафа з пилососом у вітальні (клітинка 16, 10; слід 1 × 1; висота 140). Пакет A4, art/STYLE.md.
size 192×220; pivot (72, 180) — точка підлоги під центром сліду; points: —.
Стани: st-closed — дверцята зачинені, з-під них визирає шланг; st-open — дверцята відчинені на 90° навколо дальньої петлі (площина y = −0,36), усередині порожньо: пилососом прибирають (env/vacuum/cleaner).
Без шарів: один кадр у готових кольорах. Металева шафа стоїть під передньою стіною, тож дверцята — на видній грані +x. Історії: дитячий малюнок котика на скотчі; шланг пилососа з-під дверцят.
-->
