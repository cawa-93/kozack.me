<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 178" width="144" height="178">
<!-- env/vacuum — вертикальний пилосос, що стоїть на підлозі (рішення автора 2026-11-02, GAME_DESIGN §8.7 «Пилосос у руках»); пакет «Арт пилососа», art/STYLE.md.
size 144×178 (полотно сліду 1 × 1, висота 98); pivot (72, 138) — точка підлоги під серединою щітки; points: grip (58, 44.5) — хват ручки (середина гумового хвата на задній планці петлі).
Без станів і шарів: один кадр у готових кольорах, LINE_SMALL (річ вузька: корпус ≈ 21, трубка 8). Щітка дивиться вздовж +x (праворуч-униз), видно її перед і бік +y; над щіткою на шарнірі — корпус: знизу прозорий контейнер із пилом, згори мотор; далі трубка й ручка-петля з гумовим хватом.
Історія: трубку колись лагодили — обмотана скотчем. Тінь на підлозі — лише під щіткою.
-->
