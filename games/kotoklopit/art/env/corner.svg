<!-- env/corner — кут кімнати для фото титрів (§4.2, група «Мітки»: кіт задкує в кут): дві стіни сходяться, плінтус, шматок паркету.
size 132×132; pivot (66, 90) — підлога в самому куті; points — немає.
Стіни заввишки 76, 0,8 клітинки кожна: права — у площині y = 0, ліва — x = 0. Зріз (кришка й торці, cut) тонкий — 0,07 клітинки, без
ребра inner між кришкою й гранню: з товстим темним зрізом довкола й бузковими шпалерами в зірочку кут читали скляним еркером уночі.
Шпалери світлі й теплі (enamel: світлішого токена шпалер немає) у спокійну вертикальну смужку (enamelLo), без швів і без «історії» на стіні
(відклеєний кутик читали подертим котом); у самому куті — м'яка тінь soft. Плінтус 15 (wood, планка woodHi). Паркет floorWood дошками
вздовж правої стіни, передній край підлоги — зріз x + y = 1,04 (на екрані горизонтальний). Без станів і шарів.
-->
