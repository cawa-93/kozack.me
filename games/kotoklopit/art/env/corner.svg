<!-- env/corner — кут кімнати для фото титрів (§4.2, група «Мітки»: кіт задкує в кут): дві стіни спальні сходяться, плінтус, шматок паркету.
size 132×132; pivot (66, 90) — підлога в самому куті; points — немає.
Стіни заввишки 76 (кришка cut, як зрізи стін у квартирі), 0,8 клітинки кожна, завтовшки 0,1: права — у площині y = 0, ліва — x = 0.
Шпалери wallBedroom з чотирипелюстковим мотивом wallBedroomLo, шви полотнищ, плінтус 15 (wood, планка woodHi). Торці — cut і тінь base.
Паркет floorWood дошками вздовж правої стіни, передній край підлоги — зріз x + y = 1,04 (на екрані горизонтальний). «Історія» — відклеєний
вгорі кутик шпалер на шві лівої стіни. Без станів і шарів.
-->
