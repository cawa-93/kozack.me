<!-- env/power-station — портативна зарядна станція (узагальнена, на кшталт EcoFlow, без логотипа й назви марки) у вітальні праворуч від стола з комп'ютером, біля внутрішньої стіни ряду 5 (POWER_STATION у src/view/decor.ts). Пакет P2a «Арт і вигляд декору» (§4.1 «Планове відключення», рішення автора 2026-11-02: «Зарядна станція в формі EcoFlow»).
size 99×77; pivot (62, 53) — точка підлоги під центром сліду (8.27; 6.21); points: display (59.5, 43) — середина дисплея (висота 18, POWER_STATION.display).
Корпус 0,46 × 0,3 клітинки заввишки 30 (темний пластик dark / darkHi), дві світло-сірі ручки зверху на кінцях (до 37); на лицьовій грані +y — сіра панель:
ліворуч два гнізда (у лівому — вилка) і три USB, праворуч світний дисплей (tealHi) зі смужками заряду й зелена кнопка; на грані +x — решітка.
Кабель від вилки по підлозі до системного блока (грань +x корпусу, x 7,8; y ≈ 6,5) — станція живить комп'ютер. Стоїть лише в день відключення.
Без станів. Контур LINE_SMALL (річ менша за 60). Без шарів.
-->
