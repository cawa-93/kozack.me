<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 99 83" width="99" height="83">
<!-- env/power-station — портативна зарядна станція (узагальнена, на кшталт EcoFlow, без логотипа й назви марки) у вітальні під розеткою дроту комп'ютера, біля внутрішньої стіни ряду 5 праворуч від стола (POWER_STATION у src/view/decor.ts). Пакет P2a «Арт і вигляд декору» (§4.1 «Планове відключення», рішення автора 2026-11-02: «Зарядна станція в формі EcoFlow»; 2026-11-03: «Потрібно трошки змістити зарядну станцію до розетки. І кабель повинен вставлятись в неї, а не в розетку»).
size 99×83; pivot (62, 59) — точка підлоги під центром сліду (8.75; 6.21875); points: display (59.5, 49) — середина дисплея (висота 18, POWER_STATION.display), cord (31.5, 64) — де шнур вилки лягає на підлогу й переходить у дріт env/wire (стан station, його точка station (59.5, 56)).
Корпус 0,46 × 0,3 клітинки заввишки 36 (темний пластик dark / darkHi): стоїть перед розеткою на стіні (z 17–31) і закриває її — верх корпусу вищий за неї на екрані;
дві світло-сірі ручки зверху на кінцях (до 43); на лицьовій грані +y — сіра панель: ліворуч два гнізда і три USB, праворуч світний дисплей (tealHi) зі смужками
заряду й зелена кнопка; на грані +x — решітка.
У ліве гніздо вставлено вилку дроту комп'ютера (світло-сіра, як вилки env/wire): шнур із неї звисає на підлогу перед лицьовою гранню й лягає ліворуч, до
системного блока, — далі його малює env/wire (станція є лише з дротом у стані station чи station-chewed). Стик безшовний: останні ≈ 10 одиниць шнура лежать
поверх дроту на тій самій прямій, тими самими кольорами й товщинами; чорнило шнура закінчується на 4 раніше за світлу середину, тож заокруглений край
контуру лягає на контур дроту під ним. Сама станція в розетку не ввімкнена (світла немає). Стоїть лише в день відключення.
Без станів. Контур LINE_SMALL (річ менша за 60). Без шарів.
-->
