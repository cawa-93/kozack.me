<!-- env/counter-right — права стільниця кухні 2×1 між плитою й смітником (клітинки 16–17,1; висота 62).
size 208×174; pivot (104, 118) — точка підлоги під центром сліду; points: dish (104, 56) — страва на стільниці.
Синій фарбований корпус (дві секції дверцят і шухляд), дерев'яна стільниця. Історії: глечик із дерев'яними ложками
й вазон біля стіни праворуч (ліворуч над глибиною полотна немає місця на високе). Середина стільниці вільна під страву.
Без станів і шарів: один кадр у готових кольорах.
-->
