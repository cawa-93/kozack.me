<!-- env/door — вхідні двері в передній стіні y = 11 (клітинки 10–11), §8.4, §8.5. Пакет A1b, за еталоном F1 (art/STYLE.md, §11).
size 252×154; pivot (106, 96) — точка підлоги під центром сліду (11; 11,5); points — немає.
Стіна зрізана до плінтуса, тож двері — поріг і низьке полотно (до z 40, верх — зріз cut) у білій коробці (стояки до z 46). Підлога прорізу: паркет
із боку кімнати, дерев'яний поріг (z 5) і сіра плитка сходового майданчика назовні; важкий низ продовжує низ плінтусів, ліворуч — внутрішній кут
із торцем row11-x7, праворуч підлога на 0,03 клітинки заходить під row11-x12.
Стани: st-closed — полотно в прорізі, назовні червоний дермантин зі стьобкою й латунними цвяшками (одного бракує), ручка й замок ліворуч;
st-open — прочинене в кімнату на 72° на завісах праворуч (видно внутрішню дерев'яну грань із подряпинами кігтів знизу — кіт проситься
на сходи, §9.12 «Втікач»; під полотном падаюча тінь), прохід на сходи вільний. Полотно стоїть у межах x 11,3–11,9: на ящики (12, 9) не заходить.
Без шарів.
-->
