<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 158" width="252" height="158">
<!-- env/door — вхідні двері в передній стіні y = 11 (клітинки 10–11), §8.4, §8.5. Пакет A1b, за еталоном F1 (art/STYLE.md, §11).
size 252×158; pivot (106, 100) — точка підлоги під центром сліду (11; 11,5); points — немає.
Стіна зрізана до плінтуса, тож двері — поріг і низьке полотно (до z 40, верх — зріз cut) у білій коробці. Стояки (до z 45) — від кімнати до
зовнішнього краю коробки (y 11–11,65): білий укіс із боку кімнати й коробка (enamel, шов enamelLo), як одвірки проходів ряду 5, тож торця
плінтуса row11-x7 (x = 10) з боку кімнати не видно; назовні від коробки (y 11,65–12) — зріз стіни cut, як зовнішні грані плінтусів. Підлога
прорізу: паркет із боку кімнати, дерев'яний поріг урівень із підлогою й сіра плитка сходового майданчика назовні; важкий низ продовжує низ
плінтусів, праворуч підлога на 0,03 клітинки заходить під row11-x12.
Стани: st-closed — полотно в прорізі, назовні червоний дермантин зі стьобкою й латунними цвяшками (одного бракує), ручка й замок ліворуч;
st-open — прохід на сходи вільний: лише поріг і лівий стояк. Прочинене полотно (env/door/leaf) і правий стояк (env/door/post) — окремі
записи на тому самому полотні з тим самим pivot: у грі в кожного своя коробка глибини (iso/apartment.ts), бо полотно стоїть у кімнаті, і
кіт праворуч від нього — перед ним, а хто ліворуч — за ним; правий стояк у стані st-closed — тут, разом із полотном у прорізі.
Без шарів.
-->
