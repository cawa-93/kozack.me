<!-- env/door/leaf — прочинене полотно вхідних дверей (env/door, стан open), §8.4, §8.5, §9.12. Пакет A1b, хвиля 3 — окремим записом.
size 252×158; pivot (106, 100) — точка підлоги під центром сліду дверей (11; 11,5), як у env/door; points — немає.
Прочинене в кімнату на 72° на завісах праворуч: видно внутрішню дерев'яну грань із подряпинами кігтів знизу (кіт проситься на сходи, «Втікач»),
під полотном падаюча тінь. Полотно стоїть у кімнаті в межах x 11,3–11,8, y 9,7–11,4 (на ящики (12, 9) не заходить), тож у грі воно має свою
коробку глибини: кіт праворуч від полотна — перед ним, персонаж біля дверей (11; 10,5) — за ним; поріг (env/door) — під полотном, правий
стояк (env/door/post) — над завісами.
Без шарів.
-->
