й плитою (x 14–18, z 56–118) з тріснутою кахлиною, плінтус 15. Кришка (z = 200)
і торець (x = 19) — зріз стіни кольором cut. Лівий край (x = 12) без контуру: там стіна ванної. Без шарів.
-->
