<!-- env/room/kitchen/floor — підлога кухні (кімната x 13–18, y 1–4, і прохід 15–16 у ряду 5). Еталон F1, art/STYLE.md.
size 672×344; pivot (272, 12) — верхня вершина ромба клітинки (13,1): плита стає в toScreen(13, 1).
Лінолеум «шахівницею» 2×2 на клітинку; заходить під стіни на 0,06 клітинки; прохід у ряду 5 належить кімнаті над ним
і закінчується поріжком на межі з вітальнею (y = 6). «Історія» — надірваний і загнутий клапоть лінолеуму між плитою
й столом (≈ 16,2; 2,5), де його не закривають меблі, миски й стіна ряду 5. Без шарів: один кадр у готових кольорах.
-->
