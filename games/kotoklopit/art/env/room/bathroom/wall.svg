size 411×418; pivot (77, 276) — верхня вершина ромба клітинки (8,1), та сама точка, що й у підлоги.
Лицьова грань (y = 1, x 7–12): кахель wallBathroom 0,25 клітинки × 15 від плінтуса до z 150 зі швами wallBathroomLo і
кромкою inner; у фризі (z 105–120) — кожна друга кахлина з синьою квіточкою; тріснута кахлина над пральною машиною
(≈ 10,35; z 90–105). Вище — фарбована стіна того ж кольору. Плінтус 15. Кришка — cut. Лівий край (x = 7, стіна спальні)
без контуру; правий (x = 12, стіна кухні) без контуру й на 0,03 клітинки заходить під плиту кухні. Без шарів.
