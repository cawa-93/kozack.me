<!-- env/room/bedroom/floor — підлога спальні (кімната x 1–6, y 1–4, і прохід 3–4 у ряду 5). Пакет A1a, за еталоном F1 (кухня).
size 672×344; pivot (272, 12) — верхня вершина ромба клітинки (1,1): плита стає в toScreen(1, 1).
Дошки вздовж x (ряди по 1/3 клітинки, стики врозкид, кожна восьма дошка — floorWoodHi), шви floorWoodLo; заходить під
стіни на 0,06 клітинки; прохід у ряду 5 належить спальні й закінчується поріжком на межі з вітальнею (y = 6).
Подряпини кігтів посеред кімнати. «Історія» — круглий плетений килимок біля ліжка (≈ 2,5; 2,0), тут рівний; петля, що
вибилася з нього, — котячий слід, накладка env/trace/bedroom-rug: з'являється з котами (GAME_DESIGN §9.12).
Уздовж задніх стін (y = 1 і x = 1) — смуга тіні soft. Без шарів: один кадр у готових кольорах.
-->
