<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 86" width="54" height="86">
<!-- env/toilet-roll — рулон туалетного паперу на задній стіні ванної між душем і пральною машиною (§9.12, «Мисливський інстинкт»). Пакет A1b.
size 54×86; pivot (37, 83) — основа стіни під тримачем (TOILET_ROLL (9,5; 1)); points: holder (26, 25.5) — вісь рулону на висоті 63.
Тримач — сіра накладка на стіні ліворуч, кронштейн і вісь; рулон уздовж стіни (вісь x, Ø 22 × 22 — більший за справжній, щоб читався на 0,72).
Стани: st-full — повний білий рулон (на торці один ледь помітний виток і невелика картонна втулка) і хвостик із пунктиром перфорації;
st-unrolled — на тій самій осі порожня коричнева втулка (картон зі спіральним швом, на торці темна порожнина) і рваний навскіс хвостик
з одного шару паперу. Стрічки на підлозі тут немає: її малює mess/paper (A6), а низ стіни все одно закривають пральна машина й кошик.
Повний і порожній відрізняються кольором (білий і коричневий) уже на 0,72. Контур LINE_SMALL (папір — тонка річ). Без шарів.
-->
