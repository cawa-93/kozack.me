<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 78 114" width="78" height="114">
<!-- env/toilet-roll — рулон туалетного паперу на задній стіні ванної між душем і пральною машиною (§9.12, «Мисливський інстинкт»). Пакет A1b.
size 78×114; pivot (61, 83) — основа стіни під тримачем (TOILET_ROLL (9,5; 1)); points: holder (50, 25.5) — вісь рулону на висоті 63.
Тримач — сіра накладка на стіні ліворуч і вісь; рулон уздовж стіни (вісь x, Ø 22 × 22 — більший за справжній, щоб читався на 0,72), видно ближній торець із витками й картонною втулкою.
Стани: st-full — повний рулон і хвостик із пунктиром перфорації; st-unrolled — тонкий залишок на втулці, стрічка звисає до підлоги й лягає петлею в кімнату з рваним кінцем (далі — mess/paper).
Контур LINE_SMALL (папір — тонка річ). Без шарів.
-->
