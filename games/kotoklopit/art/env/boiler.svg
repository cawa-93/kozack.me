<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 208" width="56" height="208">
<!-- env/boiler — електричний бойлер на задній стіні ванної над пральною машиною (BOILER у src/view/decor.ts: (10,18; 1), z 118–196). Пакет P2a «Арт і вигляд декору» (§4.1 «Планове відключення», рішення автора 2026-11-02: «бойлер — індикатор роботи зазвичай горить, у відключення ні»).
size 56×208; pivot (41, 204) — точка підлоги біля лиця стіни під бойлером; points: led (21, 90) — індикатор роботи на ковпаку (висота 130, BOILER.led; на передньому боці «бочки», ≈ 0,4 клітинки від стіни).
Біла емальована «бочка» Ø 0,4 клітинки на осі за 0,215 від стіни: циліндр z 126–188 з куполами (низ 118, верх 196), синій пластиковий ковпак
унизу з індикатором і ручкою терморегулятора; дві труби з-під купола ліворуч до стіни й донизу за пральну машину — з синім (холодна) і
червоним (гаряча) кільцем; історія — стара паперова наліпка з загнутим кутиком. Тріснуту кахлину (≈ 10,375; z 90–105) і павутину кута (12,1)
не закриває: бойлер лівіше й вище за кахлину, труби — ліворуч від корпусу.
Стани: st-on — індикатор світиться (greenHi з відблиском), st-off — погашений сірий (greyLo). Сяйво індикатора — код. Контур LINE. Без шарів.
-->
