<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 57" width="41" height="57">
<!-- env/candle-shelf/back — настінна поличка зі свічкою на задній стіні y = 0 (лице y = 1), лише в день відключення (§4.1 «Планове відключення», рішення автора 2026-11-03: «Настінні полички» — по одній у кімнаті, високо на задній стіні). Ванна й кухня (CANDLE_SHELVES у src/view/decor.ts).
size 41×57; pivot (26, 28.5) — точка на лиці стіни під серединою дошки, на висоті верху дошки (CANDLE_SHELVES[].z: полички однієї стіни висять на різній висоті); points: flame (24.5, 13) — середина полум'я, на 15.5 над верхом дошки.
Дерев'яна дошка 0,25 × 0,17 клітинки завтовшки 5 на фігурній консолі (до 15 під дошкою), тінь під дошкою на стіні — base. Склянка Ø 0,12 заввишки 15 (glass, коса смуга glassHi), крізь неї видно віск (enamelHi, нижче за обідок — свічку вже палили), зверху — поверхня воску paper і гніт.
Історія: червоний коробок сірників на лівому кінці дошки (етикетка paper) — чим запалюють свічку.
Стани: st-out — погашена, загнутий ґніт; st-lit — язичок полум'я orange з серцевиною mustardHi (сяйво — код, BACKDROP.glow). Контур LINE_RIG: річ 20–40 (art/STYLE.md §5). Без шарів.
-->
