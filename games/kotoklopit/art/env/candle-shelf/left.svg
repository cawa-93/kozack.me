<!-- env/candle-shelf/left — настінна поличка зі свічкою на задній стіні x = 0 (лице x = 1), лише в день відключення (§4.1 «Планове відключення», рішення автора 2026-11-03: «Настінні полички»). Спальня й вітальня (CANDLE_SHELVES у src/view/decor.ts). Свій малюнок, не дзеркало env/candle-shelf/back (art/STYLE.md §10).
size 46×66; pivot (16.5, 36.5) — точка на лиці стіни під серединою дошки, на висоті верху дошки (CANDLE_SHELVES[].z); points: flame (21.5, 13.5) — середина полум'я, на 23 над верхом дошки.
Дерев'яна дошка 0,3 × 0,19 клітинки завтовшки 5 на двох латунних кутниках (mustard, гвинти ink), тінь під дошкою на стіні — base. Синє емальоване блюдце Ø 0,18 і свічка-стовпчик Ø 0,1 заввишки 17, обгоріла навскіс.
Історія: підтік воску по боці свічки (enamelHi з краєм inkSoft).
Стани: st-out — погашена, загнутий ґніт; st-lit — язичок полум'я orange з серцевиною mustardHi (сяйво — код, BACKDROP.glow). Контур LINE_RIG: річ 20–40 (art/STYLE.md §5). Без шарів.
-->
