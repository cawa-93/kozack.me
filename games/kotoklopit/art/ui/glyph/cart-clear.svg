<!-- ui/glyph/cart-clear — очистити кошик (⌫, кнопка без тексту в смузі кошика, `src/ui/shop.ts`): той самий гірчичний візок, що в гліфі кошика 🛒, а в правому верхньому куті — червоний бейдж із паперовим хрестиком, «прибрати з кошика». Рішення автора 2026-11-03 (GAME_DESIGN §6.4, «Бірка знижки й кошик унизу»), малюнок — рішення виконавця; art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів. Гліф DOM (src/ui/glyphs.ts): стоїть на кнопці ≈ 26–30 px на папері.
Бейдж — геометрією позначок «✓» і «?» (коло r 11,3 з центром (46,5; 17,5), контур 4, паперове кільце 3, обтяте полем), але червоний і з хрестиком:
таких бейджів серед позначок іконок немає («ні» — мазок навскіс через усю іконку). Смітника не беремо — смітник у грі річ квартири (§9.12).
-->
