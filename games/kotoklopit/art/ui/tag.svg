<!-- ui/tag — бірка знижки «−X%» у каталозі (`.price-tag`, `src/ui/shop.ts`): як цінник-знижка в супермаркеті — червона бірка з
гострим кінцем ліворуч і пробитим отвором біля нього, верх світліший (redHi), низ — губа тіні. Напис «−X%» — текстом CSS поверх
(паперовим кольором, праворуч від отвору), навскіс бірку ставить CSS. Рішення автора 2026-11-03 (GAME_DESIGN §6.4, «Бірка знижки
й кошик унизу»), малюнок — рішення виконавця; art/STYLE.md.
