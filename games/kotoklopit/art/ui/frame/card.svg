<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
<!-- ui/frame/card — чорнильна рамка картки: дев'ять частин (CSS border-image, зріз points.slice 24).
size 96×96; pivot (48, 48) — центр; points: slice (24, 24) — відступ кутів від краю.
Папір paper до самого контуру (CSS кладе той самий колір і волокна ui/paper під середину), контур кільцем: верх і боки
≈ 4,7, низ 6,6 — важкий. Ребра злегка надуті (до 1,4) двома кубічними з горизонтальними дотичними на межах зрізу, тож
розтяг середніх частин не дає зламу; кути кожен свого радіуса, правий нижній загнутий «вушком» (клапоть enamel, тінь base
під ним). Вушко разом із тінню, штрихом і зрізом внутрішнього контуру — лише в кутовому шматку (x, y ≥ 73,5), тож
border-image його не тягне. Поле 4,6: у CSS — border-image-outset 4px; папір картки (CSS) — лише під серединою
(background-clip: padding-box), під смугою рамки папір дає сама рамка.
-->
