<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
<!-- ui/hud/fullscreen — кнопка повного екрана HUD (§10).
size 48×48; pivot (24, 24) — центр; без points. Стани: st-enter, st-exit.
Коло darkHi (світліше за смугу панелі dark), кутики paper (3,5): enter — вершини назовні (розгорнути), exit — вершини до
центру (згорнути). Зовні — паперовий обідок paper 1,6 (силует на темній смузі), далі кільце ink (низ товщий).
-->
