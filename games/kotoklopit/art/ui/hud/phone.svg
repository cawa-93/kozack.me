<!-- ui/hud/phone — кнопка телефону HUD (доставка, §6.4).
size 60×60; pivot (30, 30) — центр; без points. Стани: st-idle, st-hint.
idle — коло darkHi (світліше за смугу панелі dark) зі світлим телефоном (корпус enamelHi, екран teal); hint — коло
mustard, екран засвічений highlight, телефон «дзвонить»: дужки ліворуч і вгорі праворуч (правий нижній кут вільний — там
код кладе іконку запасу). Зовні — паперовий обідок paper 1,8 (силует на темній смузі), далі кільце ink (низ товщий).
-->
