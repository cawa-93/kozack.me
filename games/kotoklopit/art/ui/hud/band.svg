<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 80" width="256" height="80">
<!-- ui/hud/band — смуга панелі HUD угорі (hud.ts, висота HUD_HEIGHT 76): темний папір із чорнильним краєм унизу.
size 256×80; pivot (128, 40) — центр; points: slice (24, 0) — тягнеться вшир: кінці по 24 не тягнуться.
Тло dark, над краєм тінь soft, край ink 5 з пологою хвилею (дотичні на межах зрізу горизонтальні), під краєм падаюча
тінь base на світ (до y 72). Верх і боки без контуру: смугу ставлять так, що вони за екраном (поле 4,6).
-->
