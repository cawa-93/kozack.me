<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 334 200" width="334" height="200">
<!-- race/lot — парковка пункту згори (GAME_DESIGN §8.5 «На місці — кадр парковки»): майданчик асфальтом greyLo з бордюром,
4 місця носом угору (розмітка paper), проїзд і з'їзд з дороги. «Історії»: латка з тріщиною в проїзді, плями мастила на
місцях, опале листя в кутах біля бордюру.
size 334×200; pivot (25, 144) — середина з'їзду на бордюрі (точка рамки RACE_LOT entrance (165, 0); полотно = рамка + (−140, 144));
points: entrance (25, 144), slot-0 (82, 46), slot-1 (146, 46), slot-2 (210, 46), slot-3 (274, 46) — середини місць.
З'їзд (x 4…60 полотна) малюється над дорогою: асфальт від правого краю лінії краю дороги (x 5,75) перекриває бордюр і
стовпчики race/road, а бордюр з'їзду заходить у бордюр дороги вище й нижче (greyHi, лінії 3,5 і 6 — як у race/road),
тож стик без шва; сама лінія краю дороги (x 144 рамки) лишається видимою — шов між дорогою й з'їздом.
Без шарів і станів: один кадр у готових кольорах; пласке — без падаючої тіні.
-->
