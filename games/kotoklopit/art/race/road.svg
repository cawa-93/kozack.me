<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 512" width="372" height="512">
<!-- race/road — дорога гонки згори: асфальт на три смуги по 96 (переривчаста розмітка між ними, суцільна по краях),
бетонні бордюри, за ними стовпчики. «Історії»: латка свіжого асфальту, люк у правій смузі, решітка зливостоку біля бордюру.
size 372×512; pivot (186, 256) — середина дороги; points: lane-0 (90, 256), lane-1 (186, 256), lane-2 (282, 256) — середини смуг.
Плитка повторюється вгору з кроком 496: вміст y 4…508, смуга 4…12 збігається з 500…508 (перекриття 8, без щілин);
ці смуги симетричні відносно середини дороги, тож ряд плиток можна віддзеркалити (люк і латка переходять на інший бік).
Без шарів і станів: один кадр у готових кольорах; одиниці — пікселі полотна гри 1280 × 720 (k = 1).
-->
