<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 96" width="36" height="96">
<!-- race/progress — смуга прогресу дороги збоку від неї: track — паперова доріжка з картатим «фінішем» угорі,
fill — пройдене, зелена пігулка в жолобку доріжки (тягнеться знизу вгору), без власного чорнильного контуру.
size 36×96; pivot (18, 48) — центр; points: slice (18, 22) — межа верхньої частини (нижня — y 74).
Код розтягує кадр на висоту екрана трьома частинами: верх 0…22 і низ 74…96 — як є, середину — розтягнуто,
тож у середині (y 22…74) малюнок однаковий по вертикалі. Стани: st-track, st-fill. Без шарів: готові кольори.
-->
