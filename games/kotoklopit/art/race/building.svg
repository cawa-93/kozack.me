<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 188" width="282" height="188">
<!-- race/building — плаский дах будівлі пункту згори (GAME_DESIGN §8.5 «На місці — кадр парковки»): парапет, кондиціонер,
витяжка з жалюзі, грибки вентиляції, відкрита труба, люк; табличка paper з рамкою ink, на якій код малює іконку пункту.
«Історії»: калюжа біля зливу, паперовий літачок.
size 282×188; pivot (141, 94) — середина даху (точка рамки RACE_BUILDING pivotAt (327, −240); полотно = рамка + (−186, 334));
points: sign (141, 150) — середина таблички: сторона 64 разом із рамкою 4,5, папір усередині — 55, іконка пункту 52.
Дах — x 4…278, y 4…180 разом із контуром, падаюча тінь base — силует на 8 нижче (видно ≈ 4 під важким низом), до y 184;
табличка стоїть на передньому парапеті й виступає за край даху на 2 (до y 182), контур даху й тіні під нею обтяті.
Шари: fill, detail, shade, ink (як race/car/traffic). fill — білий дах, який код фарбує кольором пункту (DESTINATION_ROOFS);
detail — без Hi/Lo сім'ї даху: grey, glass, paper і отвір вентилятора shade deep; shade — падаюча тінь поза дахом і поза
табличкою, тінь від верхнього парапету й тіні речей поза речами, нижня половина грибків, отвір труби; компонувальник кладе
його звичайним накладанням (source-over), як у race/car/traffic. ink — контур, парапет, шви покрівлі inkSoft.
-->
