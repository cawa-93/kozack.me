<!-- fx/brawl-cloud — хмара бійки (§9.4, «Клубок бійки»): кругла пилова хмара між двома котами; лапи й хвости, що з неї стирчать, малюють скелети котів (код).
size 138×104; pivot (69, 52) — центр на висоті котів; points: —.
Стани — кадри кипіння: st-a, st-b, st-c (горби хмари дихають по колу, клубочки пилу й зірочки ударів перескакують) — чергуються по колу a → b → c.
Хмара greyHi, верх paper, низ — тінь soft, контур LINE_SMALL з важким низом; зірочки mustardHi.
Шматки верхнього рівня зсунуті transform="translate(3 4)" (підгонка полотна під поле 4); pivot і points — у координатах полотна.
-->
