size 64×40; pivot (60, 20) — правий край посередині: хвіст кота; ефект тягнеться назад, ліворуч (кіт ліворуч — віддзеркалення). points: —.
Без станів і шарів. Чотири клини ink різної довжини (товсті біля кота, гострі ззаду); унизу три клубочки пилу paper / greyHi з тінню soft і контуром inkSoft 2,5, як fx/sweep-dust (пил легкий, не чорнило), що дрібнішають назад, і порошинки grey.
-->
