<!-- icon/cat-house — котячий будиночок: картонний, з двосхилим дахом і круглим входом, на боці — червоне сердечко, як дешевий item/house/cheap. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Будиночок» у магазині (THING_ICONS, symbols.ts). Навскіс, картоном і темним отвором замість дверей — щоб не плутати з гліфом дому ui/glyph/home (червоний дах, двері, спереду) і з коробками (box, cat-box).
-->
