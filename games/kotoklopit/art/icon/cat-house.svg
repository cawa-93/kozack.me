<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-house — котячий будиночок: картонний, навскіс, з двосхилим дахом, по ребру даху — смужка скотчу; на фасаді — круглий темний вхід (≈ третина фасаду) і гофрований зріз картону, на боці — червоне сердечко. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Як дешевий item/house/cheap. Біля назви «Будиночок» у магазині (THING_ICONS, symbols.ts). Круглий отвір замість арочних «людських» дверей, картон і скотч — котячий будиночок, а не дім (ui/glyph/home: червоний дах, двері, спереду), не будка й не коробки (box, cat-box). Сердечко — лише тут: притулок shelter має вивіску з лапкою.
-->
