<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/spine — хвороба хребта: стовпчик із чотирьох хребців різної ширини, вигнутий дугою, як вигнута спина; на кожному — остистий відросток-трикутник убік і вниз, між хребцями — рожеві диски; третій хребець болить — він червоний, і ліворуч від нього — товсті червоні рисочки болю. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — пакет «Іконки хвороб»), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Біля «Хвороби хребта» у ветеринара. Складена форма: чорнило 7 під усім стовпчиком (облямівка 3,5), хребці (ropeHi, тінь base знизу), відростки й диски — фарбою зверху з тонким контуром 2,2. Дуга й відростки відрізняють стовпчик від стосу тарілок чи одягу (folded, meal, table); не joints (дві кістки кутом) і не worms (рожева хвиляста трубка).
-->
