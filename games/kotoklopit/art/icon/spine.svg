<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/spine — хвороба хребта: стовпчик із трьох хребців (тіло й «крильця» відростків) з рожевими дисками між ними; середній хребець болить — він червоний, і з боків від нього червоні рисочки. Пакет «Іконки хвороб» (іконки біля назв, GAME_DESIGN §11.4), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Хвороби хребта» у ветеринара. Складена форма: чорнило 9 під усім стовпчиком (облямівка 4,5), хребці й диски — фарбою зверху з тонким контуром 2,5. Не joints (дві кістки кутом) і не worms (рожева хвиляста трубка).
-->
