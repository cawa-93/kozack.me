<!-- icon/stolen — кіт украв страву: руда голова з хитрими очима тікає праворуч, у зубах — куряча ніжка впоперек (кісточка стирчить з одного боку рота, м'ясо — з другого), позаду — рисочки руху. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Не страва на плиті чи столі (meal), не ласощі (treats — рибка) і не продукти: це втрата. Ніжка — та сама, що в meal (A11a), менша за голову; ікла впиваються в м'ясо. Кісточка — enamel (paper на папері бульбашки зникає).
-->
