<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/stolen — кіт украв страву й тікає: рудий кіт у швидкому бігу праворуч — лапи врозліт, хвіст навздогін, голова подана вперед, вуха прибиті назад, очі хитро скоса назад; у зубах упоперек — велика куряча ніжка: золотаво-руде м'ясо праворуч поза головою, кісточка з двома кругляками стирчить ліворуч; позаду — три товсті рисочки руху. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Втрата, не «страва готова» (meal) і не ласощі (treats — рибка): кіт тікає з їжею. Від aloof (кіт іде з-під руки) — бігом, ніжкою в зубах і рисочками руху. Кіт — складена форма (тулуб, хвіст і ближні лапи одним чорнилом 8 під фарбою), дальні лапи — у тіні; ніжка — теж складена форма (чорнило 7,4): м'ясо mustard (верх mustardHi), не темний корм, що зливався з тінню підборіддя; кісточка enamel, кругляки по 7.
-->
