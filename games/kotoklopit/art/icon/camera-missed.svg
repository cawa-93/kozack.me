<!-- icon/camera-missed — летучку пропущено: той самий силует, що icon/camera (корпус і ріжок об'єктива), але сірий і вимкнений — вогник погас (greyLo); унизу праворуч, частково поверх корпусу, — червона ламана стрілка «пропущений дзвінок», як у журналі дзвінків телефона: ↘ з різким зламом ↗ і вістрям. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур 6, важкий низ 8,5, лінії 3,5.
Стрілка — заливками, бо ширша за межу stroke 9: червона 6,1 завтовшки, чорнильна облямівка 1,55 і паперовий просвіт 2,4 довкола, що відрізає її від корпусу. Так «пропущено» відходить від родини «немає чи вимкнено» з рискою «\» (no-internet, no-power) і від позначки «ні».
-->
