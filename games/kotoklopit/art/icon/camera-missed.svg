<!-- icon/camera-missed — летучку пропущено: знак «пропущений дзвінок» зі статус-рядка телефона — зелена слухавка «лежить» (ручка дугою, дві чашки донизу), а над нею червона стрілка, що прийшла праворуч згори, «відскочила» від слухавки й пішла вгору ліворуч (короткий хвіст, довге плече, великий трикутний наконечник). Ревізія іконок 2026-11-03, раунд 3: зі сліпого порівняння чотирьох варіантів обрано «слухавку»; art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур 6, важкий низ 8,5 (під чашками); стрілка — червоний штрих 5 у чорнильній облямівці 9 (граматика риски no-internet), наконечник — трикутник 15 × 19 з облямівкою 4.
Слухавка ≈ 77 % ширини, стрілка — верхні ≈ 40 % поля, між ними паперовий просвіт ≈ 3 (низ облямівки стрілки y ≈ 29,1, верх контуру слухавки ≈ 32,2) — не зменшувати: у 24 px стрілка злипнеться зі слухавкою. Плечі стрілки нерівні (≈ 18 і 11), а наконечник — суцільний трикутник, щоб не читалось червоною галочкою «✓»: ламану стрілку на камері (раунд 1) читали галочкою «записано». Напрям — як у знаку phone_missed: прийшла праворуч згори, відскочила вгору ліворуч. Камери на іконці немає: бабл висить над комп'ютером о 10:00 поруч зі станом icon/camera, тож «дзвінок пропущено» в контексті повне. Слухавка зелена (green, верх greenHi), хоч «зелене» й нагадує «прийняти»: темна тонула б на темному тлі. Від чого відмовились у раунді 3: сірий корпус камери з годинником (раунд 2) читали «скоро мітинг / таймер», а годинник у 24 px — червоною цяткою REC; камеру з бейджем «1» — «нове сповіщення від камери»; галерею квадратиків із «?» — «хто це?». Від phone (смартфон навскіс), loud (гучномовець), bell (дзвіночок), camera (темний корпус із ріжком), no-internet (сірий Wi-Fi) і mood-down (розбите серце) — силуетом класичної слухавки без корпусу; зелена слухавка — «дзвінок», червона стрілка — «пропущено».
-->
