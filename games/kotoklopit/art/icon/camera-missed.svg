<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/camera-missed — летучку пропущено: той самий силует, що icon/camera (корпус і ріжок «відео»), але сірий і вимкнений — корпус grey (верх greyHi), вогник погас (greyLo); унизу праворуч поверх корпусу — годинник «час минув»: паперовий диск, чорнильний обідок, дві товсті чорнильні стрілки й червоний сектор минулого часу від 12 до 4. Ревізія іконок 2026-11-03 (раунд 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур 6, важкий низ 8,5, лінії 3,5; обідок і стрілки годинника — 4.
Камеру піднято на 6 одиниць, щоб верх ріжка лишився над годинником. Годинник — коло r 11,5 з центром (46; 46), з обідком ≈ 42 % ширини; паперове кільце 3 (обтяте полем) відрізає його від корпусу. Без рисок, стрілок, галочок і мазків: риску «\» читали «камеру вимкнено» (родина no-internet, no-power), ламану стрілку «пропущений дзвінок» — червоною галочкою «записано». Від camera (летучка йде) — сірий корпус і годинник; камери з годинником ніде більше немає (glyph/clock — лише в DOM).
-->
