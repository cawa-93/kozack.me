<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/detergent-premium — концентрат для прання (дорогий варіант товару «пральний засіб»): та сама каністра icon/detergent з ручкою-дугою, кришкою-носиком і футболкою на паперовій етикетці, але синя з гірчичною кришкою, а в куті етикетки — гірчична іскорка-зірочка. art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Від icon/detergent відрізняють колір (корпус blue / blueHi замість помаранчевого, кришка mustard / mustardHi з рубчиками ropeLo замість синьої) й іскорка mustard з контуром 2,5, що сидить на правому верхньому куті етикетки. Силует, ручка й футболка — ті самі: предмет той самий.
-->
