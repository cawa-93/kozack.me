<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/lungs — проблеми з диханням: дві рожеві легені з гілочками бронхів, а між ними вгору — трахея з кільцями, що розходиться в легені. Пакет «Іконки хвороб» (іконки біля назв, GAME_DESIGN §11.4), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Проблем з диханням» у ветеринара. Не pleasant (два рожеві серця): дві половинки однакового розміру з трахеєю-«ніжкою» посередині вгору. Трахея — складена форма (чорнило 7 під фарбою).
-->
