<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/kibble-sterile — корм для стерилізованих: синій бак із паперовою етикеткою, повний з гіркою зелених паличок. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Корм для стерилізованих у грі зелений — «зеленуваті палички» в мисці, годівниці й совку (A5) і в icon/mix; тут ті самі палички, а не бурі трикутні гранули звичайного корму (icon/kibble). Синій бак, як сховище корму для стерилізованих у квартирі (§6.4), — високий, а не низька миска. Палички — не трикутники-листки, щоб бак не читався вазоном. Етикетка ≥ 10 одиниць із тією самою паличкою.
-->
