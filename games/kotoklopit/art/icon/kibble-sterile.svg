<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/kibble-sterile — корм для стерилізованих: синій бак із віконцем, повний з гіркою гранул. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Той самий корм, що icon/kibble (ті самі гранули), але в синьому баку з віконцем — як сховище корму для стерилізованих у квартирі (§6.4). Високий бак, а не низька миска. Гранули не зелені: зелені трикутники в синьому баку читалися як вазон із листям (і м'ята — теж листя).
-->
