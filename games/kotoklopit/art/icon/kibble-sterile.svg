<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/kibble-sterile — корм для стерилізованих: високий синій бак (світла лицьова стінка), повний гіркою світло-зелених паличок, з гірки стирчить сталевий совок ручкою вгору ліворуч; кришку відкинуто набік — стоїть на ребрі за баком праворуч; на великій паперовій етикетці — та сама зелена паличка. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Ручка совка й палички — облямівка під фарбою (6 і 5), щоб світлий колір не з'їдав контур.
Синій пластиковий бак — як сховище в квартирі (env/sterile-bin). Корм для стерилізованих у грі зелений — «зеленуваті палички» в мисці, годівниці й совку (A5); тут ті самі палички-капсули, а не бурі гранули звичайного корму (icon/kibble), і той самий зелений, що в icon/mix. Бак вищий за ширину — сховище, а не миска чи вазон (catnip, pot); совок і етикетка кажуть «корм», від litter (мішок) і bin-tipped (сірий смітник) — синім баком і зеленим кормом. З позначкою «ні» (совок у руках, «сюди не покласти») совок і гірка лишаються ліворуч угорі від мазка ↗, а етикетка й низ бака — праворуч унизу.
-->
