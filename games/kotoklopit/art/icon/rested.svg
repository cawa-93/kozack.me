<!-- icon/rested — пухка подушка з ямкою й іскоркою над лівим кутом: персонаж виспався (стан на панелі й у профілі телефона, §8.8);
з ✓ — добре виспався (rested+ok).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
Подушка blueHi з ріжками, ямка від голови — лінія, іскорка mustardHi угорі ліворуч: кут угорі праворуч вільний для бейджа «✓».
Не сон (zz) і не будильник недосипу (alarm) — подушка, з якої встали відпочилими; не спека (hot: сонце).
-->
