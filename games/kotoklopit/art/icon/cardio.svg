<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cardio — хвороба серця кота: червоне серце, через яке біжить кардіограма — паперова лінія пульсу з чорнильною облямівкою, з високим піком, ширша за серце. Пакет «Іконки хвороб» (іконки біля назв, GAME_DESIGN §11.4), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Хвороби серця» у ветеринара. Не heart (здоров'я персонажа — саме серце), не mood-down (розбите) і не pleasant (два рожеві): силует — серце, перетнуте лінією пульсу через усю іконку. Лінія — складена форма (чорнило 8 під папером 3).
-->
