<!-- icon/food-bowl-plastic — пластикова миска для корму (дешевий варіант): та сама широка низька миска, що icon/food-bowl, боки розходяться донизу, нутро затінене, на дні дві крихти корму. Іконки варіантів товарів (GAME_DESIGN §11.4 «Іконка біля назви»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви дешевого варіанта «Миска для корму» в магазині (VARIANT_ICONS, symbols.ts). Від food-bowl (гірчична кераміка) — бірюзовий пластик, тонший бортик (нутро ширше, світлого кільця обідка майже не видно) і світлі подряпини на бочку, як потерта item/bowl/cheap. Не синя: синя миска — kibble і drink.
-->
