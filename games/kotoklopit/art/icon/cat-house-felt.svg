<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-house-felt — повстяний будиночок (дорогий варіант): той самий будиночок навскіс, що icon/cat-house, з двосхилим дахом, круглим входом на фасаді й сердечком на боці, але зі сливової повсті: краї м'якші (кути й гребінь заокруглені, стіни трохи опуклі), без скотчу й гофрованого зрізу, вхід у товстому кремовому канті, у ньому — рожева подушка, на гребені — гірчичний помпон. Іконки варіантів товарів (GAME_DESIGN §11.4 «Іконка біля назви»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви дорогого варіанта «Будиночок» у магазині (VARIANT_ICONS, symbols.ts). Колір, кант і помпон — як у item/house/premium (сливова повсть, не сіра: сірий повстяний будиночок у грі не трапляється). Від cat-house у 22–28 px відрізняють колір і світле кільце довкола входу.
-->
