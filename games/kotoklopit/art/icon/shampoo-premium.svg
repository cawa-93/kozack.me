<!-- icon/shampoo-premium — делікатний шампунь (дорогий варіант товару «шампунь для котів»): та сама висока пляшка icon/shampoo з «талією» й плечима, піною над носиком і лапкою на етикетці, але бузкова, з гірчичною («золотою») відкидною кришкою й носиком. art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Від icon/shampoo відрізняє лише колір: корпус plum (плечі plumHi) замість рожевого, кришка mustard (верх mustardHi) замість бірюзової. Силует, піна й етикетка — ті самі: предмет той самий.
-->
