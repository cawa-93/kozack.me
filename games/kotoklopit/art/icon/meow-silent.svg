<!-- icon/meow-silent — беззвучне нявкання «Тихоні»: руда голова з відкритим порожнім ротом, а праворуч на рівні рота — три великі крапки в рядок «…». Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Від meow — силуетом: замість дуг звуку рядок крапок (не по діагоналі — не хвостик думки); голова пряма, очі широко відкриті.
-->
