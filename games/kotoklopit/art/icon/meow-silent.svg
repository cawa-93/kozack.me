<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/meow-silent — беззвучне нявкання «Тихоні»: руда голова з відкритим порожнім ротом, а праворуч на рівні рота — три великі гірчичні крапки в рядок «…» з контуром. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Від meow — силуетом: замість дуг звуку рядок крапок (не по діагоналі — не хвостик думки); голова пряма, очі широко відкриті. Крапки гірчичні з контуром, як дуги meow, — читаються й на темному тлі.
-->
