<!-- icon/meow-silent — беззвучне нявкання «Тихоні»: голова з icon/meow (задране підборіддя, роззявлений рот із рожевим язиком, відкриті очі), ×0,8, а праворуч на рівні рота — три гірчичні крапки з контуром у рядок «…». Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Від meow — силуетом: замість дуг звуку рядок крапок (не по діагоналі — не хвостик думки). Крапки ≈ 8 з контуром 2,5, проміжки ≈ 4; рот ≈ 7 заввишки — лишається в 24 px. Очі звичайні, відкриті: не pain (зажмурені) і не fright (вирячені). Голова зменшена (0,8), щоб крапки були великі.
-->
