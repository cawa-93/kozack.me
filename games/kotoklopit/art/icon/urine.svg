<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/urine — цистит: три світло-жовті краплі сечі ланцюжком згори ліворуч униз праворуч, ніби падають одна за одною (кіт часто й потроху ходить у лоток); у кожної гостра верхівка й білий відблиск; з боків — товсті червоні рисочки болю. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — пакет «Іконки хвороб»), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Біля «Циститу від стресу» у ветеринара. Краплі рідкі: mustardHi з легкою тінню soft, контур 4, відблиск paper (свідомий виняток із «без блиску», STYLE §4, за ревізією іконок) — темний низ і товстий контур робили з них зернята. Червоні рисочки (4,6, як у stomach) лишають у 24 px ознаку хвороби. Не drop (бірюзова крапля води), не drops (пляшечка з бірюзовою краплею), не піт hot, не гранули kibble і не washed (сорочка з бірюзовими краплями).
-->
