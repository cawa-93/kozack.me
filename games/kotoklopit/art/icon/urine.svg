<!-- icon/urine — цистит: три жовті краплі сечі різного розміру — кіт часто й потроху ходить у лоток; збоку — червоні рисочки болю. Пакет «Іконки хвороб» (іконки біля назв, GAME_DESIGN §11.4), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Циститу від стресу» у ветеринара. Не drop (одна бірюзова крапля води), не drops (флакон крапель), не spit-drops і не washed: кілька гірчичних крапель купкою. Не pain (крик болю сечокам'яної в лотку).
-->
