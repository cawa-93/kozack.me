<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/taken — місце зайняте: на дерев'яній стільниці стоїть тарілка зі смаженою ніжкою (як icon/meal), а згори навскіс, без руки, опускається друга тарілка й стукається об її край — дві риски удару; угорі ліворуч — вузький гірчичний «!». Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур тарілок, страви, стільниці й «!» — 3,5: дрібні шари не зливаються в чорнило.
Відмова «Місце зайняте»: на плиті, столі чи стільниці вже страва. Конфлікт видно з малюнка — другій тарілці нема куди стати. Перша тарілка — ≥ 55 % ширини. «!» — окремий гірчичний знак, спільна ознака з no-room (не трикутник alert), але вужчий і на третину висоти: головна — пара тарілок. Від meal (одна тарілка з парою), stolen (кіт краде ніжку) і hands (руки) — друга тарілка в повітрі й риски удару.
-->
