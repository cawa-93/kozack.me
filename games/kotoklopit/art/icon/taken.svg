<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/taken — місце зайняте: на дерев'яній стільниці ліворуч стоїть тарілка зі стравою, а праворуч на ніжці — табличка «в'їзд заборонено» (червоний круг із паперовою смугою). Ревізія іконок 2026-11-03, раунд 3, art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова occupied: персонаж хоче покласти страву на плиту, стіл чи стільницю, а там уже стоїть страва. Без позначки: код показує { icon: "taken" } без mark — з ✓ (раунд 2) іконку читали «готово / подано», а «!» (раунд 1) — «увага». Стільниця на всю ширину поля (woodHi, wood, шов woodLo; контур 4,5, низ 6) нейтральна для плити, столу й стільниці. На ній — та сама тарілка з ніжкою, що в icon/meal, дзеркально (кісткою вліво), ≈ 59 % ширини; її правий край заходить під ніжку знака: страва й знак стоять на одному місці — «тут уже стоїть», а не загальне «стіл під забороною». Знак — у куті бейджа: круг r 11 з центром (46; 18), контур 6 — разом із контуром торкається поля 4…60 праворуч і згори; паперова смуга 7,2 заввишки, кінцями під обідком; тінь base — нижня частина круга. Ніжка grey ≈ 5,8 завширшки з контуром 4, п'ятка — на верхній грані стільниці: табличка не «висить» і на темному тлі. Лінії тарілки й м'яса 2,5–4, тонші за LINE: з 6 тарілка зливалася в чорнило. Не alert (не трикутник і без «!»), не table із ✗ (без мазка навскіс і високих ніжок стола), не lock (немає замка), не no-room (шафа з «!»), не meal (є стільниця й знак), не stolen (немає кота).
-->
