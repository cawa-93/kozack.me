<!-- icon/taken — на стільниці вже стоїть тарілка зі стравою: місце зайняте.
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Відмова occupied — плита, стіл чи стільниця вже зі стравою. Стільниця-брила на всю ширину (верх woodHi, лице wood, важкий низ), на ній тарілка paper, пюре mustardHi й котлета kibble (контур inner, як гранули kibble), пара grey. Не страва без поверхні (meal, A11a) і не стіл на ніжках зі скатертиною (table, A12b).
Пакет A11b (хвиля 2 кроку 16), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
-->
