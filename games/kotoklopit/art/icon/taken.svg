<!-- icon/taken — зайнято: на краю дерев'яної стільниці стоїть тарілка зі смаженою ніжкою (як icon/meal, без пари), а праворуч — великий гірчичний знак оклику. Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Місце зайняте» — на плиті, столі чи стільниці вже страва (GAME_DESIGN §11.4: «тарілка на столі зі знаком оклику»). Тарілка — та сама, що в meal (страву видно одразу), але без пари й на стільниці; головне, що відрізняє від meal і pot, — знак оклику на всю висоту. Від table (стіл на ніжках, з позначкою «ні») — без ніжок і з «!».
-->
