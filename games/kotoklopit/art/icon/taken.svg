Відмова occupied — плита, стіл чи стільниця вже зі стравою. Стіл-піктограма: стільниця wood на чорнильних ніжках, тарілка paper, пюре mustardHi й котлета kibble (контур inner, як гранули kibble), пара grey. Не страва без стола (meal, A11a) і не стіл-заборона кота (table, A12 — з кухлем).
Пакет A11b (хвиля 2 кроку 16), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
