<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/taken — місце зайняте: на товстій дерев'яній стільниці на всю ширину (верхня грань woodHi, передня wood) стоїть та сама тарілка зі смаженою ніжкою, що в icon/meal. «✓» («це вже є») ставить код позначкою mark/ok (refusalBubble, відмова occupied). Ревізія іконок 2026-11-03 (раунд 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур стільниці, тарілки й м'яса 4,5, низ стільниці 6, низ тарілки — заливка до 4,5, лінії 3, кістка 3,5: з LINE 6 тарілка в масштабі 0,85 зливалась зі стільницею в чорнило.
Граматика бейджа «✓ — це вже є», як kibble і drop з ✓ (миска й вода повні): «!» читали «увага» чи «зараз упаде», а другу тарілку згори — кришкою чи лупою. Стільниця нейтральна: і плита, і стіл, і кухонна стільниця. Тарілка — ≈ 65 % ширини, трохи кругліша, ніж у meal (видно згори); ніжку повернуто кісткою вправо-вниз, щоб правий верхній кут ≈ 30 × 30 лишився вільним під ✓. Без другої тарілки, «!» і рук. Від meal — стільниця під тарілкою й ✓, від stolen — без кота.
-->
