size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Сковорідка з ручкою й клубчаста хмара диму — не каструля з легкою парою-хвилями (icon/pot) і не тарілка зі стравою (icon/meal). Над пригорілою стравою на плиті й у руках.
