<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/smoke — пригоріло: сковорідка збоку — пласка неглибока миса з довгою прямою дерев'яною ручкою ліворуч (на третину ширини, 8 завтовшки), у ній чорна грудка з помаранчевим язиком полум'я, а вгору ростуть три великі клуби темного диму з контуром (нижній — dark, верхні — світліші darkHi). Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; силует сковорідки, ручки й диму — 4,5 (важкий низ 6), грудка — 3,5.
Стан плити «підгоріло» й пригоріле в руках (з ✗ у відмові «сюди не покласти»): горизонтальна сковорідка з ручкою лежить обабіч діагоналі мазка «ні». Сковорідка — сірий метал зі світлим обідком, грудка й дим на ній — темні. Силует збоку з ручкою — сковорідка, а не диск робота-пилососа (robot-vacuum); дим — чорний дим пригорілого, а не світла пара каструлі (pot) чи світло-сірий пил бійки (fight). Не мозок (mind) і не грудка шерсті (fur).
-->
