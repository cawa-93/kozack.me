<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/smoke — пригоріло: на сковорідці чорна грудка з жаринкою, з неї здіймаються три окремі клуби сірого диму. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Сковорідка з ручкою й три окремі клуби диму, що зміщуються S-подібно й ростуть догори (нижній темніший), — не каструля з легкою парою-хвилями (icon/pot), не тарілка зі стравою (icon/meal), не мозок (icon/mind) і не грудка шерсті (icon/fur): між клубами просвіти, тож це стовп диму, а не крона чи гриб. Сковорідка — darkHi зі світлим обідком, щоб не зливалася з чорнилом. Над пригорілою стравою на плиті й у руках.
-->
