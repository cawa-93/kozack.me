<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cv-rejected — відмова з вакансії: резюме — аркуш паперу із загнутим кутом, угорі ліворуч велике фото (силует голови й плечей, ≥ 1/3 ширини аркуша), два-три товсті рядки, а на нижній правій половині — великий червоний «✗» двома лінзами 8 завтовшки, відбитком red без контуру й без кружечка. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур 6, лінії 3,5 і 4.
Вголос над комп'ютером. Круглий штамп із тонким паперовим хрестиком у 40 px зливався в червону пляму; великий «✗» читається з 24 px. Не «Х» терпіння (cross: самі мазки з контуром) — аркуш із загнутим кутом і фото; не злість (angry) і не попередження (alert).
-->
