<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/radio — приймач на тумбочці вітальні: радіо в списку речей вкладки «Дім» телефона (§8.10, §8.4).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
Той самий приймач, що в квартирі (env/radio): бірюзовий корпус (teal, світліша смуга згори), темний динамік із ґраткою ліворуч, шкала частот paper із червоною стрілкою праворуч, дві темні ручки під нею й антена навскіс.
-->
<defs><clipPath id="icon-radio-body"><path d="M15 23H49Q55 23 55 29V47Q55 53 49 53H15Q9 53 9 47V29Q9 23 15 23Z"/></clipPath></defs>
