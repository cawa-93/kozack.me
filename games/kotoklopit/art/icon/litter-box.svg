<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/litter-box — лоток: сливовий пластиковий лоток спереду-згори, повний чистого наповнювача, у ньому стоїть гірчичний совок — той самий лоток, що в icon/hiss-litter. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Лоток» у магазині (THING_ICONS, symbols.ts). Сама річ: наповнювач як запас — icon/litter (мішок із лапкою), брудний лоток — icon/dirty (купка з запахом); тут лоток чистий. Держак совка ламає прямокутний силует, щоб лоток не плутався з коробками й скриньками (box, pills, mom-meal).
-->
