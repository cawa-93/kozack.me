<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/litter-box — лоток: низьке широке відкрите корито з товстим бортиком, ширшим за стінку; над бортиком — світла пухирчаста гірка наповнювача зі світло-сірими крупинками, у ній ліворуч — великий світлий совок: лопатка з двома прорізами й товстий держак навскіс. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Річ магазину «Лоток» (THING_ICONS), значок біля назви (22–26 px на paper і enamel). Стінка — світліший фіолетовий (plumHi), тінь лише внизу. Той самий лоток — у icon/hiss-litter. Крупинки світлі: темні цятки читалися як бруд (dirty). Корито, а не коробка (box, pills, mom-meal): бортик ширший за стінку, гірка вища за бортик.
-->
