<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-laptop — кіт на ноутбуці: відкритий ноутбук (сірий екран зі склом, світла клавіатура), а на клавіатурі розлігся рудий кіт — голова ліворуч, очі заплющені, хвіст лежить на клавішах праворуч. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Кіт сів на клавіатуру — вголос над комп'ютером і відмова сісти за нього (той самий випадок); з позначкою «ні» — кіт пам'ятає «ні»
про стіл (§9.12, §11.4). Від icon/cat, cat-box, cat-high — силуетом ноутбука: екран і передня смуга клавіатури видно довкола кота.
-->
