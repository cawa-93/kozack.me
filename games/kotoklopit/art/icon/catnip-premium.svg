<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/catnip-premium — мататабі (дорогий варіант товару «котяча м'ята»): та сама гілочка icon/catnip з парами листочків, але замість зеленого стебла — бура дерев'яна паличка, а обабіч верхнього листка звисають два світлі довгасті плодики. art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (листя 6, паличка — чорнило 9 під деревом 5, плодики 3,5: з 6 від них лишаються цятки).
Від icon/catnip відрізняють колір і форма: паличка wood товща за стебло й бура, а не зелена; плодики mustardHi з легкою тінню знизу — краплинки кінчиком униз-назовні, різні за розміром, щоб пара не читалася вушками. Плодики лежать поверх бічного листя, а верхній листок — поверх них (тому він останнім шматком): так вони «ростуть» з-під нього. Листя те саме: предмет той самий.
-->
