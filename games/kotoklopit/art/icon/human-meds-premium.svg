<!-- icon/human-meds-premium — надійні ліки (дорогий варіант товару «ліки для себе»): та сама капсула icon/human-meds навскіс згори-зліва вниз-праворуч, але коротша половинка бірюзова замість червоної, друга так само біла, а на бірюзовій — світлий відблиск уздовж верхнього боку. art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, стик 3,5).
Від icon/human-meds відрізняють колір (teal замість red) і відблиск-лінза paper (свідомий виняток із «без блиску», STYLE §4: глянцева капсула). Силует, стик і тінь — ті самі: центр (32; 32) так само на білому. Не круглі котячі таблетки icon/pills (ні звичайні, ні pills-premium).
-->
