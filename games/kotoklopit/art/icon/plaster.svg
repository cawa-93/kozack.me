<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/plaster — товар «Звичайний пластир» (§6.5, §6.4): синя пачка, з прорізу вгорі віялом визирають два рожеві пластирі.
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, смужка на пачці 3,5), пластирі — LINE_SMALL (4,5), щоб рожеве не з'їв контур.
Силует — пачка з віялом, а не пластир навскіс icon/bandage (травма) і не рулон icon/dressing (бинт): «немає пластиру» не читається травмою.
-->
