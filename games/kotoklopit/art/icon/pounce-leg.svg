<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/pounce-leg — кидається на ногу з засідки: рудий кіт у стрибку летить праворуч — тулуб навскіс, хвіст і задні лапи позаду, брови зведені, очі круглі, передні лапи вже вчепилися в литку; праворуч — нога: синя штанина з підкотом і бурий черевик носаком до кота; ліворуч унизу — дві рисочки руху, звідки кіт злетів. art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Лише фото титрів (GAME_DESIGN §4.2, знімок риси «Засідки»: думка з «ні» — не нападає); у грі засідку показує dizzy. Без кігтів і червоного: мазок «ні» ↗ іде через центр, голова кота — ліворуч угорі від нього, черевик — праворуч унизу, тож обабіч мазка їх видно. Від claws (три червоні подряпини) — кіт і нога; від stolen (кіт біжить із ніжкою в зубах) — нога в черевику й лапи вперед; від aloof (кіт іде від долоні) — кіт летить до ноги, а не йде геть.
-->
