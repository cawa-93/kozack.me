<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/exhausted — виснаження: обличчя персонажа з темними мішками під напівзаплющеними очима й скуйовдженим волоссям. Іконки біля назв (GAME_DESIGN §11.4 «Іконка біля назви»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля «Виснаження» в лікаря (ILLNESS_ICONS, symbols.ts): кілька ночей поспіль сну замало (§6.5, §8.8). Виснаження ривка не забирає, тож це не розряджена батарейка icon/battery-low (відмова ривка, коли здоров'я нижче 25). Від zz (сонливість — літери «Z»), dizzy (спіраль), mind (рожевий мозок) і котячих голів sad, fright, bored — силуетом: кругла людська голова під шапкою волосся з одним скуйовдженим пасмом угорі (два пасма по боках у 22 px читалися котячими вухами), без вух; головне — сливові серпики під очима з важкими повіками. Шкіра — pinkHi, як долоні в іконках; волосся — wood.
-->
