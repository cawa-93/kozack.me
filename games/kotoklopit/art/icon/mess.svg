<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mess — безлад на очах: бура пляма-клякса на підлозі, у ній три черепки розбитого кухля, від неї — два сліди котячих лап. Стан персонажа на панелі й у профілі телефона (§8.4, §8.1): у кімнаті безлад, він дратує — здоровий глузд тане. art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
«Розлито й розбито», без гидоти: пласка широка калюжа з відблиском, з якої стирчать гострі білі черепки, — не купка з хвилями (icon/dirty), не смітник (icon/bin-tipped), не краплі (icon/urine) і не динамік (icon/loud). Пляма kibble (відблиск kibbleHi, низ — тінь shade 0,16), черепки enamelHi (низ — тінь shade 0,3), на великому — смужка red біля вінця: той самий кухоль, що mess/broken. Сліди лап — kibble на тонкій чорнильній підкладці (облямівка 1,4): легші за пляму, бо це слід, а не річ; без облямівки в 24 px вони блякнуть. Черепки — складені форми: чорнило під фарбою (облямівка 2,75 / 2,5 / 1,75). Важкий низ плями — заливка ink змінної ширини.
-->
