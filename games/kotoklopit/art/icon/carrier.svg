<!-- icon/carrier — переноска: червона пластикова переноска спереду — ґратчасті дверцята з темним нутром і гірчичною засувкою, згори ручка дугою, як item/carrier/premium. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Переноска» в магазині (THING_ICONS, symbols.ts). Від коробок (box, cat-box, empty) — пластиком, ручкою й ґратами з темним нутром; від пральної машини (washer) — ґратами замість круглого вікна.
-->
