<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/carrier — переноска: округлий червоний пластиковий корпус, згори висока товста сіра ручка-дуга, спереду — великі дверцята в темне нутро (≈ 55 % фасаду) з двома товстими сірими прутами, а в темряві світяться гірчичні котячі очі. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Ручка й прути — облямівка під фарбою (5,4 і 4,6).
Як item/carrier/premium. Темне нутро з очима й лише два прути — вхід, а не часта решітка динаміка чи обігрівача; округлий корпус — не прямокутна коробка приладу. Від судочка mom-meal (прозора стінка, синя кришка), пральної машини washer (кругле вікно), аптечки kit (зелена з лапкою) і кота в коробці cat-box — червоним пластиком, ручкою й очима в темряві.
-->
