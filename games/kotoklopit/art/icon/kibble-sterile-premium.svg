<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/kibble-sterile-premium — корм «Гурман» для стерилізованих (дорогий варіант запасу корму для стерилізованих, §11.4 «Іконка біля назви»): той самий високий синій бак із совком, відкинутою кришкою й паперовою етикеткою, що icon/kibble-sterile, але палички темніші зелені, а між ними — світлі помаранчеві шматочки-кубики, і на гірці, і на етикетці. Картка товару в магазині.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Ручка совка, палички й шматочки — облямівка під фарбою (6 і 5), щоб світлий колір не з'їдав контур.
Від icon/kibble-sterile відрізняють колір паличок (green замість greenHi) і шматочки orangeHi іншої форми (скруглені кубики) — як совок item/scoop у стані sterile-premium: на гірці два кубики замість двох паличок (на вершині й у совку), на етикетці паличка коротша, а поруч — кубик (у 28 px етикетка читається першою, тож відмінність має бути й на ній). Бак, кришка, совок і етикетка — ті самі.
-->
