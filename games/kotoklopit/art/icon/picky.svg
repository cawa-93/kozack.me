<!-- icon/picky — перебірливий: руда голова задерла носа й відвернулась праворуч, очі зверхньо заплющені, а ліворуч унизу — миска простого корму, та сама, що icon/kibble. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Не хоче простого корму. Миска з купкою гранул — символ корму з icon/kibble (той самий випадок «корм»), менша й з тоншим контуром — другорядна. Не перекреслений корм (відмова персонажа «корм сюди не покласти»).
-->
