<!-- icon/picky — перебірливий: руда голова в профіль праворуч, потилицею до миски, ніс задертий високо, око напівприкрите прямою повікою над видимою зіницею (погляд убік), з рота — рожевий язик «бе»; ліворуч унизу, окремо, — миска простого корму з купкою гранул, як icon/kibble. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Думка кота: не хоче простого корму. Між мискою й котом — проміжок ≥ 6. Миска ×0,5 (≈ 40 % поля). Граматика спільна з bored: «відвернувся від речі — не хоче її». Очі не заплющені дугами (те читається «смакота», pleasant). Від hiss-bowl — без знака злості й без сірого кота.
-->
