<!-- icon/pills — таблетки для котів: світла сріблясто-сіра пластинка фольги злегка навскіс, у ній три опуклі рожеві таблетки з рискою посередині й білим відблиском, а четверту вже видавили — світла порожня лунка з рваним краєм і відгорнутим клаптем фольги. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A11a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Світла фольга greyHi з тонкою рамкою 4,5 і перфорацією grey (не темний лоток, не коробка цукерок mom-meal і не пакунок box); пластинка нахилена на 9°, щоб не читалася коробкою. Таблетки — ті самі котячі «сочевиці», що в spit-pill: верх pinkHi, низ pink у тіні, риска inkSoft, відблиск paper; не червоно-біла капсула людських ліків human-meds. Відблиск — свідомий виняток із «без блиску» (STYLE §4) за ревізією іконок: так таблетка опукла.
-->
