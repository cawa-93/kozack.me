<!-- icon/cat — кіт: сидить спереду — голова з вухами, тулуб-груша, лапки й хвіст набік, знизу важкий контур. Ревізія іконок 2026-11-03 (пачка b4; був пакет A12a хвилі 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
У грі — лише з позначкою: «потрібен кіт» (?) і «сюди не можна» (✗). Кіт зсунутий ліворуч-униз і трохи менший, тож у правому верхньому куті справді повітря: обидва вуха й маківка лишаються відкриті й під бейджем «?» (коло з центром (46,5; 17,5)), а хвіст закручено праворуч нижче за бейдж. Мазок «ні» (↗) перетинає тулуб і щоку, голова з вухами — над ним ліворуч. Без рота — не нявкання.
-->
