<!-- icon/palms — дві розкриті порожні долоні (знизує плечима): потрібна річ у руках (з позначкою ?).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Завжди з «?» (відмова need: item): ліва рука вища, права нижча — верх праворуч ≈ 24 × 28 вільний під позначку. Рука — мовою hiss-hand (A12b): пальці й великий палець — капсули pinkHi на чорнильній підкладці, розділені щілинами; зап'ясток — важкий низ. Не «руки зайняті» (hands — руки тримають ящик) і не долоня «Незалежного» чи «хоче уваги» (A12).
Пакет A11b (хвиля 2 кроку 16), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
-->
