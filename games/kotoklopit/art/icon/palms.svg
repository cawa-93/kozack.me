<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/palms — потрібна річ у руках («долоня просить»): одна велика кисть долонею догори, порожнім «ківшиком» — великий палець стоїть угору ліворуч, пальці праворуч загинаються вгору, між ними — широка порожнина; синій рукав заходить з лівого краю. Над порожниною — бейдж «?» (mark/ask): питання стоїть там, де мала б лежати річ. Ревізія іконок 2026-11-03, раунд 3, art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Завжди з «?» (відмова need: item — потрібна якась річ у руках). Кисть — pinkHi на чорнильній підкладці (облямівка 4,5), великий палець — окремим шматком поверх; рукав blue з тією самою облямівкою, манжет ≈ 15 заввишки на висоті y 39…55; тінь base — нижня третина кисті, soft — низ рукава; одна лінія 3,5 між пальцями (≈ 8 завдовжки). U-силует «порожньої пригорщі»: кінчик великого пальця ≈ (27; 31), кінчики пальців ≈ (53; 38), порожнина між ними ≈ 20 завширшки й ≈ 7–15 завглибшки — у 24 px кисть не злипається в «сардельку». Уся фарба — щонайменше за 21,3 від центру бейджа (46; 18): паперове кільце (r 16,8) не з'їдає облямівку. Пунктиру немає: у раунді 2 пунктирне коло читали крихтами на купі. Одна кисть у профіль, не дві долоні до глядача: дві долоні читали «стоп / дай п'ять», «квітка / лапки», «купка». Від hands (✗) — одна порожня кисть без коробок; від fur — та сама рука долонею догори, але порожня, «ківшиком» і з «?» замість жмута шерсті; від attention і hiss-hand — долоня догори знизу, а не рука згори; від bite — «ківшик» із великим пальцем угору, без червоних слідів.
-->
