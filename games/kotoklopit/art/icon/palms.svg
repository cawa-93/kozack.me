<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/palms — «розвести руками»: дві порожні долоні вгору, трохи складені човником — пальці в боки й трохи вгору, як краї човника, великі пальці вгору, — а знизу сині рукави. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Потрібна якась річ у руках — завжди з «?» (відмова need: item): «нічого немає, що взяти?». Долоні порожні, на них нічого. Рука — словником icon/attention: рожеві пальці-капсули на чорнильній підкладці (облямівка 4,5), синій рукав; пальці товсті (капсули 5,4), щоб у 24 px долоні не злипалися. Пальці не вгору: долоні пальцями вгору до глядача читаються як «дай п'ять», «руки вгору» чи «стоп». Права рука нижча на 5 — правий верхній кут вільний під бейдж «?». Ті самі руки, повні, — icon/hands (з ✗).
-->
