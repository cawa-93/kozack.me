<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/palms — порожні руки «човником»: дві кисті-«рукавички» (зімкнуті пальці однією формою й окремий великий палець — як кисть рига персонажа) долонями догори сходяться кінчиками пальців посередині, від зап'ястків униз і назовні — довгі сині рукави; над долонями — пунктирне коло «тут має бути річ». Ревізія іконок 2026-11-03, раунд 2 (пачка r2-hands-ask), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Потрібна якась річ у руках — завжди з «?» (відмова need: item). Кисть — pinkHi на чорнильній підкладці (облямівка 4,5), без проміжків між пальцями; великий палець угору й до середини, відділений ямкою. Рукав — blue з контуром 4; передпліччя ≈ 40 % руки, щоб читалася рука людини, а не лапа. Пунктир — коло d 18: шість рисок ink 3,5 завдовжки ≈ 6 із просвітами 3,4; просвіти — знизу (там коло заходить за пальці) і навпроти бейджа, тож кільце бейджа риски не зрізає. Коло й права кисть лежать поза кутом ≈ 30 × 30 угорі праворуч — під бейдж «?»; права рука трохи нижча. У раундах 0–1 пальці були розчепіреними капсулами зі щілинами: вертикальні долоні читали «дай п'ять / стоп», горизонтальні — «квітка / лапки». Ті самі руки з повним оберемком — icon/hands (з ✗).
-->
