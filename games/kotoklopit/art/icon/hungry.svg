<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hungry — голод: порожня тарілка згори з трьома крихтами, обабіч — виделка (ліворуч) і ніж (праворуч). Стан персонажа на панелі й у профілі телефона (§8.4): ситість на межі — рухається повільніше, здоров'я тане. art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Сервірування без страви: кругла тарілка між двома високими приборами — не страва на овальній тарілці з парою (icon/meal), не яблуко з батоном (icon/food), не стільниця з табличкою (icon/taken). Тарілка — та сама емаль, що в meal: enamelHi, обідок заглибини enamelLo; крихти kibbleHi — двійко внизу ліворуч і одна вгорі праворуч, бо трикутником і дугою вони читаються обличчям. Прибори — метал greyHi, складені форми: чорнило під фарбою, облямівка 3,3; тарілка лежить поверх їхніх ручок, тож силует один. Тінь shade 0,3 — серп унизу тарілки й низ ручок. Важкий низ тарілки — заливка ink змінної ширини.
-->
