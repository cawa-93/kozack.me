size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Силует — рулон (торець-еліпс зі спіраллю ліворуч) і широка стрічка-хвіст із сіткою марлі; від icon/bandage (лише пластир навскіс — травма) відрізняє рулон, від туалетного паперу — хрестик і марля. Головне (торець і хвіст) — поза правим верхнім кутом під плашку «0».
