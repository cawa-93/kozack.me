<!-- icon/hiss-window — шипіння з причиною: червоний знак злості «💢» угорі ліворуч (як icon/angry), а великим — вікно: дерев'яна рама, скло з хрестом і підвіконня. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Кіт шипить на іншого кота за цю причину (§9.4, Р2) — вголос над ним. П'ять причин різняться силуетом предмета: миска, лоток, вікно, долоня, кошеня.
-->
