<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hiss-window — шипить за підвіконня: знак злості «💢» угорі ліворуч, а праворуч унизу — вікно: рама ширша, ніж висока, хрест на чотири шибки з блакитним небом і хмаринкою, гірчичні фіранки зібрані в кутах, широке дерев'яне підвіконня, що виступає за раму, і на ньому — маленька сіра голова суперника. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Знак злості — той самий, що icon/angry (чотири окремі дужки, паперові проміжки між кінцями), у масштабі 0,72 угорі ліворуч, з паперовою облямівкою 2,5 — лежить поверх причини, як наліпка (STYLE «Шипіння з причиною»); контур знака 3,4, дужки на 10 % товщі. Сірий кіт — «інший кіт», той самий в усіх hiss-*: на нього шипить рудий. Хрест рами — 3,5, рама enamelHi, небо blueHi; ні дверцят (cabinet-open, door-ask), ні ґраток (carrier), ні полиць (no-room). Знак-наліпка накриває лівий верхній кут рами.
-->
