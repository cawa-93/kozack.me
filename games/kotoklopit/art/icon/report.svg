<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/report — стос паперів: на верхньому аркуші стовпчикова діаграма, з-під нього стирчать кути двох повернутих аркушів. Квартальний звіт:
звітний тиждень, робота виснажує більше (стан персонажа на панелі й у профілі телефона, §8.6, §8.4); з ✓ — цікавий проєкт.
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / краї аркушів і стовпчики 3,5.
Аркуші paper (нижні — у тіні shade 0,16 і 0,3), стовпчики blue, контур ink.
Діаграма — ліворуч і внизу верхнього аркуша: кут ≈ 30 × 30 угорі праворуч лишається бейджу «✓», під ним — лише кути нижніх аркушів. Стовпчики «високий — низький — середній»: найвищий — ліворуч, далі від бейджа, і це не п'єдестал.
Не резюме (cv-rejected: один аркуш із загнутим кутом, фото й ✗), не лікарняний (sick-leave: листок календаря на кільцях), не квитанція (utilities: вузька смужка із зубчастим низом) і не лупа (job-search) — широкий стос із кількох аркушів.
-->
