<!-- icon/store — магазин: бірюзова вітрина спереду під смугастим навісом із фестонами (червоне з паперовим), велике скло й двері. Іконки пунктів поїздок (GAME_DESIGN §11.4 «Іконка біля назви», §8.5 «На місці — кадр парковки»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля «Магазин» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Вітрина, а не кошик: кошик ui/glyph/cart — замовлення з телефона, інший випадок. Низька й широка, з навісом — не офіс (icon/office, висока вежа з вікнами) і не дім (ui/glyph/home, двосхилий дах).
-->
