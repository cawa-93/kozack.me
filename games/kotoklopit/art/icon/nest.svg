<!-- icon/nest — новонароджене: глибоке плетене гніздо з товстим обідком і трьома великими гілочками, а в ньому — руде кошеня-немовля: велика кругла голова з крихітними круглими вушками, заплющені очі дужками, тільце-грудочка поруч, нижня частина — за обідком. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «новонародженого не гладять і з ним не граються» (GAME_DESIGN §11.4). Кошеня ≈ 40 % ширини гнізда, руде — на відміну від сірого сидячого кошеняти hiss-kitten. Гніздо глибоке, з плетінням rope/ropeLo — не миска (food-bowl), не лежанка й не коробка (cat-box). Без «zz».
-->
