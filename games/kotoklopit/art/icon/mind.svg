<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mind — здоровий глузд: рожевий мозок збоку — великий півкуля з виступом лобної частки спереду, вирізом скроневої частки внизу, мозочком позаду й коротким стовбуром донизу; на ньому 4 товсті борозни 3,5 (головна — бічна, від вирізу навскіс угору). Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Здоровий глузд (HUD, думка персонажа). Силует мозку збоку впізнається й без звивин — такої форми немає в інших іконках: не шлунок stomach (J-подібний мішок), не легені lungs (дві частки) і не дим smoke (сірі хмарки). Борозен мало й вони товсті, тож у малому розмірі на паперовому кружечку HUD лишається хоча б головна. Без спіралі (запаморочення — icon/dizzy) і без «!».
-->
