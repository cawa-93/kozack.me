<!-- icon/office — офіс: дві вежі — висока світла й нижча сіра попереду праворуч — із синіми вікнами рядами. Іконки пунктів поїздок (GAME_DESIGN §11.4 «Іконка біля назви», §8.5 «На місці — кадр парковки»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля «Офіс» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Висока будівля з вікнами — не магазин store (низька вітрина з навісом), не відеодзвінок camera і не резюме cv-rejected; не шафа no-room.
-->
