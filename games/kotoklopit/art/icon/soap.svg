<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/soap — мило: плаский широкий бірюзовий брусок-«подушечка» (висота ≈ половина ширини, круглі кути) зі світлою верхньою гранню й утисненим овалом, на ньому шапка білої піни, над нею — дві великі блакитні бульбашки. Гігієна (HUD) і запас засобів гігієни. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Брусок — не пляшка шампуню (icon/shampoo) і не каністра (icon/detergent); піна лежить шапкою на брусці, а не всередині, тож брусок не читається мискою з водою (icon/water-bowl). Бульбашки — glassHi з контуром 3,5 і цяткою paper, ≥ 9 одиниць: не розчиняються в папері бабла й паперовому кружечку HUD на темній панелі.
-->
