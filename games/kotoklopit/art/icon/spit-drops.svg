<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/spit-drops — струшує краплі: ліворуч унизу — маленька бурштинова пляшечка-крапельниця (та сама, що в drops) носиком до кота; велика руда голова рішуче відвернута від неї праворуч, очі міцно стулені «> <», язик висолоплений «тьфу», ліворуч від голови — дуги трусіння; від голови навсібіч відлітають три бірюзові краплі ліків. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Дали краплі зарано після попередніх — вголос над котом (§9.5). Одна родина зі spit-pill («кіт відкидає ліки»): та сама голова, різниться предметом — пляшечкою й краплями. Краплі — та сама бірюзова форма з відблиском, що в drops, і летять від голови, а не висять біля очей (не сльоза sad і не піт hot); не хмара бризок sneeze, не washed і не fright (гладкий переляканий силует). Пляшечка ≈ 30 % ширини, голова ≈ 40 % (менша за задуману 55 %, щоб краплі відлітали з повітрям, а не стирчали з вух ріжками).
-->
