<!-- icon/spit-drops — струшує краплі: руда голова трусить — нахилена, вуха прибиті вбік, очі міцно стулені прямими рисками зі складочками, ліворуч довгі дуги руху, праворуч коротка, а краплі розлітаються врізнобіч. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Від sneeze (хмара бризок з носа) — дуги трусіння й краплі навсібіч; від fright — гладкий силует. Очі не «‿» (задоволення) і не «> <» (біль, чхання): прямі риски зі складкою — міцно стулені.
-->
