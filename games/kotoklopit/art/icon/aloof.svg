<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/aloof — «Незалежний» іде з-під руки: рудий кіт у профіль іде геть праворуч — ніс угору, око зверхньо заплющене, лапи в кроці, хвіст трубою окремо від голови, — а позаду вгорі лишилась рука долонею донизу, що щойно гладила. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Від attention (голова бодається в долоню) — силуетом: цілий кіт на ходу, рука (той самий словник, що hiss-hand) окремо, між ними повітря. Кіт — складена форма: тулуб, хвіст і ближні лапи одним контуром, без перехрещених ліній; дальні лапи — у тіні.
-->
