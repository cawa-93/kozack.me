<!-- icon/aloof — «Незалежний» іде з-під руки: великий рудий кіт у профіль іде геть праворуч, ніс угору, хвіст трубою, а позаду вгорі лишилась рука, що щойно гладила. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Від attention (голова бодається в долоню) — силуетом: цілий кіт на ходу, дві лапи, рука маленька й окремо, між ними повітря.
-->
