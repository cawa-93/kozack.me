<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/aloof — «Незалежний» іде з-під руки: рудий кіт у профіль іде геть праворуч — ніс угору, око зверхньо заплющене, лапи в кроці, хвіст трубою, — позаду нього три товсті рисочки руху, а вгорі ліворуч лишилась розкрита порожня рука долонею донизу, що щойно гладила. Ревізія іконок 2026-11-03 (пачка b4; був пакет A12a хвилі 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Рука — словником attention: три товсті пальці-капсули віялом і великий палець на чорнильній підкладці (облямівка 4,5), синій рукав; ≈ 40 % поля, розкрита, не кулак; рукав короткий — не брусок. Від attention (голова бодається в долоню) — силуетом: цілий кіт на ходу, між ним і рукою повітря й рисочки руху. Кіт — складена форма: тулуб, хвіст і ближні лапи одним контуром, без перехрещених ліній; дальні лапи — у тіні.
-->
