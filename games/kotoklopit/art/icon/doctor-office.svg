<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/doctor-office — лікар: стетоскоп — дві оливи вгорі, синя трубка розгалуженням донизу й сіра металева голівка праворуч унизу. Іконки пунктів поїздок (GAME_DESIGN §11.4 «Іконка біля назви», §8.5 «На місці — кадр парковки»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Трубка — шар чорнила під шаром фарби (облямівка замість окремого штриха, як ручка kit), щоб не тоншала до волосини.
Біля «Лікар» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Інструмент лікаря, а не ліки чи хвороба: не градусник thermometer (застуда), не пластир bandage, не капсула human-meds і не таблетки pills; і не кіт у конусі ветеринара vet-clinic.
-->
