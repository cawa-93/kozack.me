<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hiss-hand — ревнощі: знак злості «💢» угорі ліворуч, а праворуч унизу — рука долонею донизу гладить сіру котячу голову із задоволено заплющеними очима (мініатюра icon/attention). Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Знак злості — той самий, що icon/angry (чотири окремі дужки, паперові проміжки між кінцями), у масштабі 0,72 угорі ліворуч, з паперовою облямівкою 2,5 — лежить поверх причини, як наліпка (STYLE «Шипіння з причиною»); контур знака 3,4, дужки на 10 % товщі. Сірий кіт — «інший кіт», той самий в усіх hiss-*: на нього шипить рудий. Рука — словник icon/attention, дзеркально (рукав угору-праворуч), ×0,7, облямівка ≈ 4; сіра голова ≈ 19. Ні вертикальної долоні «стоп» (так іконку плутали з cat-annoyed і hands), ні рудого кота (attention).
-->
