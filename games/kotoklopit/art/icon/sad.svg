<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/sad — сум: руда голова з вухами, звислими вниз-убік (кінчики нижче маківки й нижче основи вуха), брови будиночком (внутрішні кінці вгору), відкриті очі, під лівим оком на щоці — блакитна сльоза від нижньої повіки, рот — дуга кутиками донизу. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Думка сумного кота. Сльоза ≈ 9 × 12, blueHi з контуром 4, усередині силуету голови — окрема крапля під підборіддям була б мовою drink, thirst і hot. Очі відкриті: від pain (зажмурені, без сліз). Вуха вниз, а не горизонтально (горизонтальні — злий, cat-annoyed); від fright — немає білих очей і шерсті дибки.
-->
