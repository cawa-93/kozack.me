<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/computer — монітор на ніжці: комп'ютер у списку речей вкладки «Дім» телефона (§8.6, §8.4).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
Той самий монітор, що на столі у вітальні (env/computer): сіра рамка (grey-lo), увімкнений екран (світла бірюза з відблиском навскіс), зелений світлодіод у кутку, темна ніжка й сіра підставка.
Не кіт на ноутбуці (cat-laptop: кіт улігся на клавіатуру) — просто комп'ютер.
-->
<defs><clipPath id="icon-computer-screen"><path d="M14 15H50V37H14Z"/></clipPath></defs>
<g id="p-stand">
<path d="M28 43H36V49.5H28Z" fill="#4b4146"/>
