<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/scratcher-bed — кігтеточка з лежанкою (дорогий варіант речі «Кігтеточка», §8.7): той самий сизалевий стовпчик із чотирма темними витками, килимок унизу й червоний помпон на шворці, але нагорі — широка дерев'яна полиця майже на ширину килимка, а на ній пухка сливова подушка; килимок теж сливовий. Іконки варіантів (a26-variant-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Полиця, подушка й килимок — облямівка 5,2 під фарбою, як полиця й килимок у icon/scratcher.
Від icon/scratcher (дешевої) — формою верху (широка полиця з подушкою замість вузької сірої полички) і сливовим кольором подушки й килимка, як дерев'яна полиця з подушкою-пуфом і сливова повсть на підставці в item/scratcher/premium.
-->
