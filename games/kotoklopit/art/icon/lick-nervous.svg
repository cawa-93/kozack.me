<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/lick-nervous — нервове вилизування: рудий кіт зіщулився й квапливо лиже підняту передню лапу — вуха притиснуті назад (обидва лежать ліворуч, уздовж голови), брови будиночком, очі круглі й білі, зіниці скоса назад, над чолом велика крапля поту, збоку від тулуба дві дуги тремтіння. art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Думка нервового кота (GAME_DESIGN §9.12, подія nervous). Від lick (спокійно лиже лапу: вуха сторч, очі заплющені; у грі лише з «ні») — притиснуті вуха, білі очі, крапля й дуги; від fright (сама голова, шерсть дибки, рот «о») — кіт цілий, із лапою та язиком; від hot (сонце з краплею) — крапля тут біля голови кота. Крапля glass ≈ 10 × 16 з контуром 3,5, як піт у hot; дуги — 3,9, як у fright.
-->
