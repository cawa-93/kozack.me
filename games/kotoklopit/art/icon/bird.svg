<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/bird — пташка: велика світла синя пташка (тулуб blueHi, темне — лише крило) сидить на тонкій світлій гілочці мордою ліворуч — велика кругла голова з оком угорі ліворуч, великий гірчичний дзьоб, тулуб навскіс, хвіст двома пір'їнами вниз-праворуч. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур 4,5, гілочка й лапки — 3,5 і 2,5.
Кекає на птахів за вікном (вголос над котом на підвіконні); з позначкою «ні» — злиться на них (bird+no). Перемальовано під малі розміри: силует «кругла голова + великий дзьоб + хвіст», унизу немає темної маси (гілочка тонка й світла). Мазок «ні» (↗) проходить тулубом, а голова з дзьобом угорі ліворуч лишається вільною. Від treats (рибка) і catnip — силуетом; не злість hiss-window.
-->
