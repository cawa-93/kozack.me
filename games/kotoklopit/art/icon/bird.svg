<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/bird — пташка: синя пташка сидить на гілочці мордою ліворуч — тіло нахилене вгору, кругла голова окремим горбиком, великий гірчичний дзьоб, крило з вирізами пір'я, хвіст двома пір'їнами навскіс униз-праворуч, лапки обхопили гілочку. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Кекає на птахів за вікном; з позначкою «ні» — злиться на них. Від treats (рибка: лежачий овал і хвіст-вилка посередині висоти) — силуетом: тіло навскіс, голова горбиком, дзьоб, гілочка з лапками. Мордою ліворуч, тож мазок «ні» (↗) перетинає тіло впоперек, а не лягає вздовж.
-->
