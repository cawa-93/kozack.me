<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-annoyed — кіт сердиться під рукою: велика руда голова з вухами, притиснутими «літачком», зведеними бровами й примруженими очима, рот підковою, а під нею праворуч — хвіст, що б'є зигзагом, із рисочками руху. Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «кіт щойно попереджав чи вкусив під рукою» (GAME_DESIGN §11.4: «котяча голова з притиснутими вухами й примруженими очима, а збоку б'є хвіст»; А8). Голова більша, ніж була (на телефоні руда пляма губила вуха й хвіст): очі — щілини під важкими бровами, хвіст окремо від голови — товста руда зигзаг-трубка з чорнильним контуром у правому нижньому куті. Від fright — гладкий силует; від angry — це кіт, не знак злості.
-->
