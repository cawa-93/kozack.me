<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-annoyed — кіт сердиться під рукою: велика руда голова з вухами «літачком», товстими темними бровами, зведеними до носа, щілинами очей і ротом підковою, а праворуч — хвіст: одна суцільна товста руда трубка, що звужується до кінчика, різким S-змахом убік від голови, з двома серпиками руху з контуром. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «кіт щойно попереджав чи вкусив під рукою» (GAME_DESIGN §11.4, А8). Брови й щілини очей ≈ 5 — злість читається в 24 px. Хвіст ≈ 27 заввишки (≈ 40 % іконки), без окремих сегментів і кульок — не грудка шерсті (fur) і не какашка (dirty). Без знака «💢» — не angry і не hiss-*.
-->
