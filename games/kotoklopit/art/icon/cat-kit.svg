<!-- icon/cat-kit — котяча аптечка як річ, яку переставляють (§8.7, «Переставити річ»): низька широка зелена скринька, видна згори; у кришці — віконце, крізь скло видно блістер із рожевими таблетками й гірчичну пляшечку крапель; на лицьовій стінці — шов кришки з сірою клямкою, ліворуч нижче — паперова лапка. Як env/cat-kit у квартирі (кришка-віконце, стани full-1…full-3). Іконки сховищ (a27-storage-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
На кнопці перестановки (що візьме персонаж) і як річ у руках. Від kit (аптечка порожня, «0»: високе лице скриньки з ручкою й великою лапкою) — скринька низька й видна згори, без ручки, з віконцем у кришці й речами за ним; від pills і drops — таблетки й краплі лише крізь скло, головне — зелена скринька.
-->
