<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/litter-premium — силікагелевий наповнювач (дорогий варіант запасу наповнювача, §11.4 «Іконка біля назви»): той самий мішок із зав'язаною горловиною, крихітним лотком на смузі й купкою біля мішка, що icon/litter, але смуга бузкова, а наповнювач — блакитно-білі кристали. Картка товару в магазині.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Від icon/litter відрізняють колір смуги (plum замість teal), гірка в лотку на смузі — кристали glassHi з гострими верхівками замість круглої сірої, і купка біля мішка того самого силуету — glassHi з кутастими кристалами blueHi й paper замість сірих круглих гранул (силікагель у грі — світлі кристали з блакитними цятками, item/litter, стан premium). Мішок, горловина й лоток — ті самі.
-->
