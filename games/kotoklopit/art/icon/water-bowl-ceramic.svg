<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/water-bowl-ceramic — керамічна поїлка (дорогий варіант): та сама миска з водою, що icon/water-bowl, спереду-згори, звужується донизу. Іконки варіантів товарів (GAME_DESIGN §11.4 «Іконка біля назви»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви дорогого варіанта «Миска для води» в магазині (VARIANT_ICONS, symbols.ts). Від water-bowl (сірий метал із вм'ятиною) — кераміка під поливою, як item/water/premium: бока сині (не бірюзові, як у грі: бірюзова вода в бірюзовій мисці зливається), губа й нутро кремові, відблиск глазурі світлою лінзою ліворуч, на місці вм'ятини — кремова крапля-візерунок.
-->
