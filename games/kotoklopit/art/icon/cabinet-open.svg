<!-- icon/cabinet-open — шафка з кормом клацнула й відчинилася: дерев'яна шафка спереду, дверцята прочинені праворуч до нас, у темряві — червоний пакет корму з круглою етикеткою, як у світі (A2 env/cat-cabinet/cat-food). Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Звук речі — вголос над шафкою (§9.12, «Кмітливість у бешкеті»). Не icon/lock (замок брязкає — шафка не відчинилася).
-->
