<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cabinet-open — шафка з кормом клацнула й відчинилася: низька дерев'яна тумба, ширша за висоту, зі світлою стільницею; стулка розчахнута праворуч до нас — широка світла трапеція в перспективі з ґудзиком; у темному нутрі — червоний пакет корму з круглою етикеткою (той самий, що в chew-bag, ≈ 50 % ширини тумби); біля клямки ліворуч — три гірчичні риски «клац». Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12b), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Звук речі — вголос над шафкою (§9.12, «Кмітливість у бешкеті»). Від no-room (висока шафа, з якої випирають запаси) — висотою й тим, що пакет усередині, а не назовні; від door-ask (вхідні двері й кіт) і hiss-window — силуетом тумби; від lock (замок брязкає, шафка не відчинилася) — відчиненою стулкою. Риски «клац» — ті самі гірчичні риски з облямівкою, що «хрум» у chew-bag і chew-wire.
-->
