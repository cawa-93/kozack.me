<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/litter — наповнювач для лотка: мішок із зав'язаною горловиною й бірюзовою смугою з лапкою, біля нього — купка сірих гранул. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Мішок — як сховище наповнювача в квартирі (env/litter-bag, §6.4: «мішок із зав'язаною горловиною й лапкою»): та сама бірюзова смуга з білою лапкою — з нею мішок не читається як «мішок грошей». Круглий і зав'язаний — не паперовий пакет продуктів (icon/food); сірі гранули біля мішка — наповнювач, не корм.
-->
