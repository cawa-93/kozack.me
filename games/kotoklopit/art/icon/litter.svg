<!-- icon/litter — наповнювач для лотка: мішок із зав'язаною горловиною й лапкою, з нього висипались сірі гранули. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Мішок — як сховище наповнювача в квартирі (§6.4: «мішок із зав'язаною горловиною й лапкою»); круглий і зав'язаний — не паперовий пакет продуктів (icon/food); сірі гранули біля мішка — наповнювач, не корм.
-->
