<!-- icon/human-meds — ліки для себе: капсула, червона й біла половинки. Ревізія іконок 2026-11-03 (пачка b4; був пакет A11a), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Капсула лежить навскіс згори-зліва вниз-праворуч — поперек перекреслення «ні» (✗ — здоровий), щоб риска її не ховала. Стик половинок зсунуто на ≈ 9 до верхнього лівого кінця: червона ≈ 40 % довжини, біла ≈ 60 %, тож центр (32; 32), де йде мазок «ні», лягає на біле — червоний мазок не губиться на червоному. Стик — чітка чорнильна лінія 3,5 на всю ширину. Правий верхній кут вільний під ✓. Котячі ліки — круглі таблетки з лапкою (icon/pills) і флакончик із піпеткою (icon/drops).
-->
