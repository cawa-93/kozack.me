size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Розладу шлунка» у ветеринара. Без блювання й бруду (§2.1). Не kibble і не food (їжа), не dirty (брудний лоток).
-->
