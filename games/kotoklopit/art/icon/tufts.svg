<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/tufts — шерсть по квартирі: три руді кошлаті жмути шерсті — великий і малий лежать на підлозі, третій летить навскіс, за ним у повітрі три волосинки. По квартирі жмути шерсті, гігієна персонажа падає швидше: стан персонажа на панелі (§8.7 «Шерсть»).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Той самий рудий жмут із пасмами, що в icon/fur, але без руки й утрьох: не жмут на долоні після пестощів (fur), не кіт, що чухається (itch), і не сіро-бура грудка перед котом (cough). Жмути orange, верх orangeHi, низ у тіні shade 0,3, пасма й волосинки — лінзи ink. Контур — шар чорнила під фарбою (облямівка 3,5; у малого 3,1), низ лежачих важчий (≈ 4,5); жмут у польоті — без важкого низу, з опуклим дном.
-->
