<!-- icon/empty — порожньо: відкрита картонна коробка з широко розкинутими клапанами, всередині нічого — лише темне дно. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Відкрита й порожня — не заклеєний пакунок (icon/box), не коробка, з якої все пре (icon/no-room), і не коробка з котом (icon/cat-box). Без перекреслення: «ні» — позначка icon/mark/no. У коді назва поки ніде не показується.
-->
