size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Кавомашина» в магазині й у «Домі» (THING_ICONS, symbols.ts; GAME_DESIGN §8.7). Від icon/mug відрізняє корпус «С» довкола чашки, від icon/washer — виріз ніші й чашка замість круглих дверцят.
-->
