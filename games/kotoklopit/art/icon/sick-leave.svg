Аркуш paper, шапка blue, хрест red у чорнильній облямівці 3,5.
Не резюме (cv-rejected: аркуш із загнутим кутом і фото), не аптечка (kit) і не лікар (doctor-office) — день у календарі, закреслений хворобою.
