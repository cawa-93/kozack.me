<!-- icon/robot-vacuum-smart — розумний робот-пилосос (дорогий варіант речі «Робот-пилосос», §8.7): той самий плаский диск спереду-згори з кришкою в обідку, дугою бампера, великим зеленим вогником і трьома рисками руху позаду, але весь темний, а ззаду на кришці замість високої вузької темної башточки — ширша й нижча кругла башточка лідара, світла, з темним віконцем по колу. Іконки варіантів (a26-variant-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Від icon/robot-vacuum (дешевого) — кольором (темний диск dark / darkHi замість сірого) і формою й кольором башточки (світла широка «шайба» лідара замість високого темного циліндра), як темний розумний item/robot/premium зі світлим металевим диском на кришці.
-->
