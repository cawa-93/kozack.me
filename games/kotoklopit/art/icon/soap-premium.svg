<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/soap-premium — «Ароматний набір для душу» (дорогий варіант запасу засобів гігієни, §11.4 «Іконка біля назви»): той самий плаский брусок-«подушечка» з піною й бульбашками, що icon/soap, але бузковий, на верхній грані праворуч від піни — рожева квіточка, а бульбашок чотири замість двох. Картка товару в магазині.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5; квіточка — облямівка 5 під фарбою, тобто 2,5 назовні).
Від icon/soap відрізняють колір бруска (plum / plumHi замість teal / tealHi; утиснений овал — plum), квіточка pinkHi із серцевиною mustard (≈ 11 у діаметрі, лежить поверх ребра бруска) і дві додаткові бульбашки (ліворуч над піною й праворуч біля бруска). Силует, піна й дві старі бульбашки — ті самі.
-->
