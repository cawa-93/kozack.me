<!-- icon/door-ask — «Втікач» проситься на сходи: кіт сидить перед вхідними дверима й тягне до них лапу. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Не нявкання над дверима (кіт уже на сходах — meow): тут двері зачинені, кіт ще вдома. Око — ink-овал з цяткою paper, як у решти котів пакета.
-->
