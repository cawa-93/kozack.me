<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/lick — вилизується: рудий кіт сидить, голову схилив до піднятої передньої лапи, очі заплющені; лапа — одна форма з тулубом, видовжена від грудей угору до рота, з рожевими подушечками на кінці; широкий рожевий язик торкається подушечок. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Нервове вилизування (думка); з позначкою «ні» — не терпить, щоб його вилизували: мазок «ні» ↗ іде через центр, а лапа з язиком — праворуч нижче від нього, тож обабіч мазка лишаються видними. Від attention і hiss-hand — лапка кота, не рука людини; від itch — передня лапа до рота, а не задня до вуха; від fur — кіт, не жмут на долоні. Язик pink, як ніс і подушечки (STYLE §3), ≈ 7 завширшки. Рисочок «нервує» немає: дрібні рисочки в 24 px були шумом.
-->
