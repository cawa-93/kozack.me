<!-- icon/lick — вилизується: рудий кіт сидить, голову схилив до піднятої передньої лапки, що спирається на груди, і лиже її рожевим язиком — лапа-рукавичка з рожевою подушечкою біля самого рота. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Нервове вилизування; з позначкою «ні» — не терпить, щоб його вилизували. Від attention — лапка кота, не рука людини; язик pink, як ніс і подушечки (STYLE §3).
-->
