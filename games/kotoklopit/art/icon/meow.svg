<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/meow — нявкання: руда голова задерла підборіддя й широко роззявила рота, праворуч — три великі гірчичні дуги звуку з контуром (як хвилі icon/loud) на всю висоту. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Голова — як у всіх котячих іконок пакета (руда, вуха з рожевим), очі відкриті. Від «Тихоні» (meow-silent — три гірчичні крапки в рядок) — силуетом дуг звуку; гірчичні з контуром — читаються й на темному тлі.
-->
