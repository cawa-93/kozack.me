size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Голова — як у всіх котячих іконок пакета (руда, вуха з рожевим), очі відкриті. Від «Тихоні» (meow-silent — три крапки в рядок) — силуетом дуг звуку.
