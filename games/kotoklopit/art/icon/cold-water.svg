<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cold-water — холодна вода: велика синя крапля, а в ній — світла крижана сніжинка.
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Планове відключення (§4.1, рішення автора 2026-11-02): бойлер не гріє, у душі холодна вода — бабл вголос над душовою кабіною замість краплі «тече вода» (showerIcon). Перемальовано за рішенням автора 2026-11-03 («Іконка холодного душу не дуже зрозуміло що означає. Треба переробити»): сіра лійка з тонкими струменями й дрібною сніжинкою в баблі (≈ 35 px на телефоні) читалася лампою чи просто душем. З трьох варіантів (лійка з бурульками, мокра голова цокотить зубами, крапля зі сніжинкою) обрано краплю: той самий знак води, що й у звичайному баблі душу (drop), а сніжинка всередині каже «крижана» — впізнається з першого погляду навіть у 24 px.
Крапля — рука великої краплі icon/drop, ширша в 1,2 раза; одна й посередині, синя (blue, верх blueHi, низ у тіні base) — не бірюзова пара крапель drop і не перекреслена крапля thirst. Сніжинка — шість променів-капсул glassHi (крига) з «галочками», без контуру, як візерунок на краплі; нижні промені — у тіні soft. Від chilly (кіт мерзне: окрема сніжинка з чорнильним контуром) — силуетом краплі.
Рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6, важкий низ — заливка змінної ширини, як у icon/drop.
-->
