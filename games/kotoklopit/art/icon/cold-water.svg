<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cold-water — холодна вода: лійка душу, з якої б'ють сині струмені, а внизу замість краплі — сніжинка.
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Планове відключення (§4.1, рішення автора 2026-11-02): бойлер не гріє, у душі холодна вода. Лійка-купол grey (верх greyHi, низ у тіні) на трубці-капсулі зліва; три струмені blueHi віялом — капсули з чорнильною облямівкою (складена форма, STYLE §11 icon); посередині під струменем — сніжинка blueHi тією самою рукою. Не «мерзне» (chilly: велика сніжинка сама по собі), не «вода тече» (drop: крапля) і не «помитий» (washed: футболка з краплями).
Пакет P2b «Арт відключення» (2026-11-02), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
-->
