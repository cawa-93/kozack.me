<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/groomer — грумер: великі розкриті ножиці «X» на ≥ 70 % ширини — широкі світлі сталеві леза з паперовим відблиском донизу, два великі червоні кільця-ручки з темними отворами вгорі; за ножицями внизу — менший горизонтальний бірюзовий гребінець із чотирма товстими зубцями. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Леза, ручки й гребінець — облямівка під фарбою (5,4 і 4,6), щоб світлий метал не тонув у чорнилі.
Біля «Грумер» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Одна головна форма — ножиці; кільця великі з дірками ≥ 8 — ручки, а не ягоди; гребінець другорядний. Пасма шерсті немає: рудий жмут — це fur; не нудьга bored і не кігті claws.
-->
