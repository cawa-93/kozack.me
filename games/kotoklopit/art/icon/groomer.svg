size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Зубці гребінця — прорізи чорнилом 3,5.
Біля «Грумер» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Інструменти грумера, а не засіб: не шампунь shampoo (пляшечка) і не жмут шерсті fur.
-->
