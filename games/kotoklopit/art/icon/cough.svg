<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cough — кахикає перед шерстяною грудкою: рудий кіт у профіль праворуч у «позі грудки шерсті» — низько присів, видно передні лапи, стегно й хвіст, шия витягнута вперед, голова внизу, вуха назад, око зажмурене, рот широко роззявлений; перед ротом на підлозі — велика кошлата сіро-бура грудка шерсті з рудими пасмами, над ротом — три товсті чорнильні дуги «кх». Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Силует — кіт, а не помаранчевий горб: руда спина ≤ третини площі. Грудка carpetLo (верх carpet) з рудими пасмами — темніша за яскравий рудий жмут fur; ≈ 27 % ширини. Дуги «кх» — не хмара бризок sneeze. Від sulk (кіт спиною), bored (голова позіхає), nest (кошеня в гнізді), dirty (купка в лотку) і spit-pill (таблетка летить від рота) — позою й грудкою. Кіт — складена форма (тулуб, стегно, лапи, хвіст і шия одним чорнилом 8 під фарбою).
-->
