<!-- icon/cough — кахикає: кіт присів, витягнув шию вперед і роззявив рота, а з рота — рисочки кашлю. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Перед шерстяною грудкою — та сама поза. Від sneeze (голова й хмаринка з бризками з носа) і bored (буханець з піднятою головою) — силуетом: низький кіт з витягнутою шиєю.
-->
