<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cough — кахикає: рудий кіт згорбився — спина високою дугою, голова попереду внизу, вуха розвело, очі зажмурені, рот роззявлений, а перед ним на підлозі — велика сіра грудка шерсті; над головою — рисочки «кх». Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Перед шерстяною грудкою. Від sneeze (голова й хмара бризок) і bored (буханець, поруч вудочка) — силуетом: висока дуга спини, голова внизу, грудка шерсті.
-->
