<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/vet-clinic — ветеринар: руда голова кота в профіль (два вуха, око, ніс, вуса) усередині захисного конуса — світло-блакитного пластикового «абажура», що вузьким краєм обхоплює шию й широко розкривається вперед, за мордою; на пластику паперовий відблиск і два шви променями, широкий край — контур 6. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля «Ветеринар» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Конус збоку — класичний силует «конуса сорому»: спереду він ставав кільцем довкола морди й плутався з котом (ui/glyph/cat) і нашийником (collar). Одна голова в профіль — не розплідник breeder (дві голови спереду) і не стетоскоп лікаря doctor-office; не ліки й не аптечка (kit, pills, human-meds, bandage, thermometer). Медичного хрестика немає: червоний «+» у кутку в 24 px плутався б із хрестиком cross.
-->
