<!-- icon/vet-clinic — ветеринар: руда котяча голова в захисному комірі-конусі (блакитний пластик, шви променями, обідок). Іконки пунктів поїздок (GAME_DESIGN §11.4 «Іконка біля назви», §8.5 «На місці — кадр парковки»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля «Ветеринар» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Кіт у конусі — після ветеринара, а не ліки: не аптечка kit (зелена скринька з лапкою), не пластир bandage, не градусник thermometer, не таблетки pills і human-meds; і не стетоскоп лікаря doctor-office.
-->
