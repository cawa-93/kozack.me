<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/fight — бійка: світло-сірий клубок пилу (≈ 55 % поля), з якого в різні боки стирчать товсті лапи-«рукавички» — дві руді й сіра, кожна з рожевою подушечкою й пальцями, — руде вухо й сірий хвіст; обабіч — дві гірчичні зірочки. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Один бабл стану над клубком котів, що б'ються. Без спіралі (вона — dizzy). Хмара світла greyHi — не темний дим smoke; лапи ≥ 10 завширшки (складена форма: чорнило 7,6 під фарбою) — не жмут шерсті fur. Зірочки 14–15 одиниць, контур 4. Від angry (знак) і loud (звук) — силуетом клубка з лапами.
-->
