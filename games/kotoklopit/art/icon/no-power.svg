<!-- icon/no-power — лампочка, сіра й перекреслена: немає світла.
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Планове відключення (§4.1, рішення автора 2026-11-02: світла немає весь день) і відмова «немає світла» (пральна машина). Колба greyHi з погаслою ниткою greyLo, цоколь grey з різьбою greyLo і темним контактом (важкий низ); стик колби й цоколя — внутрішня лінія. Риска «\» з паперовим просвітом, як у no-internet і camera-missed. Не перегризений дріт (wire: кабель з іскрою), не розряджена батарейка (battery-low: лежить, червона поділка) і не пральна машина (washer).
Пакет P2b «Арт відключення» (2026-11-02), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
-->
