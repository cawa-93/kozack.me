<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/no-power — немає світла: велика сіра лампочка, погасла й перекреслена. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур колби 6, цоколя 4,5, лінії 3,5 і 3.
Планове відключення (§4.1, рішення автора 2026-11-02: світла немає весь день) і відмова «немає світла» (пральна машина). Колба — ≈ 60 % висоти поля, grey (greyHi на папері майже зливався з тлом), погасла нитка — товста петля greyLo 4; цоколь grey з двома чіткими смугами різьби й темним контактом. Риска «\» з паперовим просвітом коротка: перетинає колбу в одному місці, а круглий верх колби й цоколь лишаються вільні, — як у no-internet і camera-missed родина «немає». Не перегризений дріт (wire: кабель з іскрою), не розряджена батарейка (battery-low) і не пральна машина (washer).
-->
