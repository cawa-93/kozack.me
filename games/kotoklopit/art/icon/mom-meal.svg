<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mom-meal — мамині судочки: харчовий контейнер — крізь прозору стінку видно котлету, гарнір і зелень, синя кришка з двома клямками-защіпками по боках, по центру передньої кромки кришки — червоне сердечко. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Сердечко (≈ 15) — облямівка 5 під фарбою.
Як судочок у квартирі (§6.4; a05 item/mom-meal: прозорий контейнер, синя кришка, сердечко). Сердечко — головна ознака «від мами»; клямки й їжа крізь скло — харчовий контейнер, а не скриня, пакунок box чи переноска carrier; не тарілка готової страви (icon/meal) і не яблуко з батоном (icon/food).
-->
