<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/camera — відеодзвінок: загальновідомий знак «відео» із застосунків відеодзвінків — широкий заокруглений корпус (dark, верх darkHi) і праворуч трапеція-ріжок об'єктива, що розширюється назовні (darkHi), без циліндра й скла; угорі ліворуч на корпусі — червоний вогник запису з контуром. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур 6, важкий низ 8,5, лінії 3,5.
Летучка чи нарада на відеодзвінку — стан над комп'ютером і вголос. Ручну камеру з циліндричною блендою читали ліхтариком; цей силует — ≈ 80 % ширини. Пропущена летучка (camera-missed) силуету камери не бере: з раунду 3 ревізії іконок це зелена слухавка з червоною стрілкою «відскоку». Вогник ⌀ 8,8: читається з 24 px. Від detergent (коробка з віконцем), bin-tipped (перекинутий смітник), loud (гучномовець) і phone (телефон) — широкий корпус із ріжком праворуч.
-->
