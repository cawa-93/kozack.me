<!-- icon/chew-wire — кіт гризе дріт: товстий сірий кабель дугою до білої вилки, на його краї відкушено два кружечки, над укусом — рисочки «хрум». Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Хрумтить — вголос над котом (§9.12, «Гризіння»). Не icon/wire (перегризений: два кінці й іскра) — цей дріт ще цілий, з вилкою, лише надкушений.
-->
