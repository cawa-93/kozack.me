<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/chew-wire — кіт гризе дріт: тонкий сірий дріт легкою S-хвилею поперек до білої вилки праворуч; на прямій ділянці відкушено два кружечки, угору праворуч летять крихти ізоляції, угору — рисочки «хрум». Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Хрумтить — вголос над котом (§9.12, «Гризіння»). Укус — той самий, що в icon/chew-bag (фестончаста виїмка, крихти, «хрум» назовні). Не icon/wire (перегризений навскіс, кінці й іскра) — цей дріт ще цілий, лежить хвилею з вилкою, лише надкушений.
-->
