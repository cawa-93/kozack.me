<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/spit-pill — випльовує таблетку: руда голова на три чверті праворуч, очі міцно стулені, рот відкритий, висолоплений язик звисає вниз праворуч, до таблетки; на рівні рота праворуч горизонтально відлітає велика кругла рожева таблетка-«сочевиця» у три чверті (видно її товщину) з рискою й білим відблиском, між ротом і таблеткою — три короткі горизонтальні риски руху, окремо від голови й таблетки. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Дали таблетку зарано після попередньої — вголос над котом (§9.5). Одна родина зі spit-drops («кіт відкидає ліки»): та сама голова з міцно стуленими очима «> <» і висолопленим язиком, різниться предметом. Таблетка ≈ 25 % ширини — та сама котяча «сочевиця», що в pills, лише в три чверті, щоб не читалася знаком у колі (верх pinkHi, бортик pink у тіні, риска inkSoft, відблиск paper — свідомий виняток із «без блиску», STYLE §4); не червоно-біла капсула людських ліків human-meds. Над головою нічого — колись таблетку над головою читали як кульку на паличці чи бульбашку думки. Від cough (грудка шерсті внизу, дуги «кх»), lick (язик до лапи), toy, sulk і stolen — таблеткою й рисками руху.
-->
