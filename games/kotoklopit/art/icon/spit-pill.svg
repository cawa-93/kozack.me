<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/spit-pill — випльовує таблетку: руда голова скривилась і висолопила язика, а кругла рожева таблетка (як у icon/pills) відлітає від рота праворуч угору, позаду — рисочки руху. Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Таблетка — та сама, що котячі в pills: кругла «сочевиця», верх pinkHi, бортик pink, риска посередині; не червоно-біла капсула людських ліків (human-meds — «Ліки не потрібні» й «Ліки випито» в персонажа; рецензія хвилі 3). Від pills (запас — пластинка таблеток) — тут кіт і рух. Голова й рисочки руху — як були (A12a). Без краплі слини.
-->
