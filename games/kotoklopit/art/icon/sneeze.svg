<!-- icon/sneeze — чхання: руда голова смикнулась уперед, очі зажмурені, а з носа праворуч угору вилітає велика хмара бризок на пів іконки. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Застуда. Від cough (кіт горбиться над грудкою шерсті) і spit-drops (краплі навсібіч) — великою хмарою бризок; від meow — хмарою замість дуг.
-->
