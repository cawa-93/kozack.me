<!-- icon/broom — віник із совком: інструмент для прибирання в списку речей вкладки «Дім» телефона, поки пилососа немає (§8.7, §8.4).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
Той самий віник, що в руках (item/broom): дерев'яний держак навскіс, червона обв'язка й солом'яний віхоть віялом донизу ліворуч; праворуч на підлозі — бірюзовий совок (teal, світлий край).
Не пилосос (vacuum) і не робот-пилосос (robot-vacuum).
-->
