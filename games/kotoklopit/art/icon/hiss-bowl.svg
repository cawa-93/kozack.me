<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hiss-bowl — шипіння з причиною: червоний знак злості «💢» угорі ліворуч (як icon/angry), а великим — миска з кормом еталона icon/kibble без зменшення, у ній чотири гранули. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Кіт шипить на іншого кота за цю причину (§9.4, Р2) — вголос над ним. П'ять причин різняться силуетом предмета: миска, лоток, вікно, долоня, кошеня.
Знак — чотири дужки «💢», як icon/angry, зменшені до ≈ 21 одиниці (поле 4,5…25,7), контур 2,5; між знаком і предметом щонайменше 3 одиниці паперу, щоб на телефоні вони не злипалися в одну пляму.
-->
