<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hiss-bowl — шипить за миску: знак злості «💢» угорі ліворуч, а праворуч унизу — повна миска з купкою гранул (як icon/kibble), з-за якої визирає сіра голова кота-суперника. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Знак злості — той самий, що icon/angry (чотири окремі дужки, паперові проміжки між кінцями), у масштабі 0,72 угорі ліворуч, з паперовою облямівкою 2,5 — лежить поверх причини, як наліпка (STYLE «Шипіння з причиною»); контур знака 3,4, дужки на 10 % товщі. Сірий кіт — «інший кіт», той самий в усіх hiss-*: на нього шипить рудий. Миска — з icon/kibble ×0,6, контур ×0,72; голова суперника ≈ 17 (вуха й очі над купкою). «💢 + миска + інший кіт» — «не поділили миску», а не «я голодний» (kibble) і не «перебірливий» (picky).
-->
