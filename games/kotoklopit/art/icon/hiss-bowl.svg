<!-- icon/hiss-bowl — шипіння з причиною: червоний знак злості «💢» угорі ліворуч (як icon/angry), а великим — миска з кормом, як icon/kibble, праворуч унизу. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
