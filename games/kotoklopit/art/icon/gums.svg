size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Гінгівіту» у ветеринара. Без крові (§2.1): запалення — лише червоний колір ясен. Не bite (укус — паща з іклами).
