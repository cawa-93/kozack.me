<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/fountain — фонтанчик для води: сіра поїлка з водою, посередині білий купол із синім носиком, з нього дугою праворуч б'є струмінь у воду, як item/fountain/cheap на поїлці. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Фонтанчик для води» в магазині (THING_ICONS, symbols.ts). Та сама поїлка, що water-bowl: фонтанчик ставлять на неї. Від icon/drink (спрага: крапля падає згори в миску) — куполом і дугою струменя, що б'є вгору й убік; від icon/drop — миска з куполом, а не сама крапля.
-->
