<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/fountain — фонтанчик для води: та сама сіра металева поїлка, що water-bowl, зі світлою бірюзовою гладінню, посередині — висока насадка, з якої вгору й симетрично в обидва боки дугами падають два товсті блакитні струмені, біля гладіні — дві краплі-бризки. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Струмені (≈ 6,6) і краплі — облямівка 5 під фарбою, серцевина струменя — glassHi.
Біля назви «Фонтанчик для води» в магазині (THING_ICONS, symbols.ts). Класичний силует ⛲: вода б'є вгору й падає дугами, без білого купола (він читався тарілкою чи яйцем). Від icon/drink (спрага: одна крапля падає згори в миску) — двома струменями, що б'ють із середини; від автогодівниці kibble-pour — блакитною водою, а не бурим кормом; не каструля pot і не страва meal.
-->
