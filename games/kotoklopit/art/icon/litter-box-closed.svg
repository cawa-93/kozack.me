<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/litter-box-closed — закритий лоток (дорогий варіант): те саме корито з товстим бортиком і той самий світлий совок навскіс, що icon/litter-box, але над бортиком замість гірки — округла бірюзова кришка-купол з арковим входом праворуч; у темному вході видно світлий наповнювач. Іконки варіантів товарів (GAME_DESIGN §11.4 «Іконка біля назви»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Біля назви дорогого варіанта «Лоток» у магазині (VARIANT_ICONS, symbols.ts). Купол бірюзовий, як дашок item/litter/premium, вхід теж праворуч. Совок спирається на купол там, де в базовій стирчить із гірки: з ним лоток упізнається, а купол із входом не читається будиночком (cat-house).
-->
