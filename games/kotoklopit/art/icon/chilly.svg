<!-- icon/chilly — мерзне: синя сніжинка — шість променів із гілочками, нижні промені в тіні. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Теплолюб у «Холод». Від hot (сонце з краплею поту) — холодна синя сніжинка. Промені — складена форма (капсули: спершу контур, потім заливка), тож тінь base лягає на нижню половину (STYLE §4, §11).
-->
