<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/gloom — «Пригніченість»: темна сливова дощова хмара на всю ширину, під нею три краплі дощу навскіс. У домі немає кота, персонажу геть сумно — здоровий глузд не росте (GAME_DESIGN §6.2); стан персонажа на панелі й у профілі телефона (§8.4).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Хмара — plum, нижче верхівок — тінь shade 0,3; контур 6, важкий низ — звужена заливка до 8,5, завитки 3,5. Краплі — blueHi з тінню, контур 3,5.
Не кіт, що дметься, з клубом пари (sulk), не сумний кіт (sad), не дим над сковорідкою (smoke), не пара бірюзових крапель «тече вода» (drop) і не синя крапля зі сніжинкою (cold-water): головне — хмара, краплі дрібні й під нею.
-->
