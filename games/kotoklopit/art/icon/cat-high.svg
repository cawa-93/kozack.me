<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-high — кіт нагорі: високий світлий холодильник, на самому верху розлігся рудий кіт — голова над краєм дивиться вниз, лапка звисає по дверцятах, хвіст — збоку; знизу тягнеться рука й не дістає. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Застряг на холодильнику чи шафі. Від door-ask (темні дерев'яні двері, кіт сидить унизу поруч) — силуетом і тоном: світлий емальований холодильник без філенок, кіт над верхнім краєм, рука далеко внизу (той самий словник, що hiss-hand). Від cat-box — висока вузька річ, не низька коробка.
-->
