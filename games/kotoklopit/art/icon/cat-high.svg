<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-high — кіт нагорі: висока вузька шафа на весь зріст, згори вздовж неї розлігся рудий кіт — голова з лівого краю дивиться вниз, лапка й хвіст звисають, а знизу тягнеться рука й не дістає — між ними повітря. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Застряг на холодильнику чи шафі. Від cat-box (голова з широкої низької коробки) і door-ask (двері й кіт поруч) — силуетом: висока вузька шафа, кіт лежить на самому верху, рука далеко внизу.
-->
