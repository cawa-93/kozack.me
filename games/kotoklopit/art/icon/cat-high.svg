<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-high — кіт нагорі: праворуч від центру — високий вузький світлий холодильник (риска морозилки, вертикальна ручка), на самому верху лежить рудий кіт — голова й лапка звисають за лівий край, хвіст — праворуч; знизу з лівого краю тягнеться рука з розчепіреними пальцями й не дістає. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Кіт нагорі — не дотягтися» (§9.12). Сюжет — вертикаллю: кіт угорі, рука внизу, між пальцями й котом — повітря ≥ 12. Рука — долоня pinkHi з пальцями-капсулами на чорнильній підкладці (облямівка 4,5), синій рукав; внизу, не на рівні кота, — щоб не повторювати hiss-hand чи attention. Від door-ask (темні двері, кіт унизу поруч), cat-box (низька коробка) і no-room (шафа з речами) — високий світлий холодильник з котом нагорі.
-->
