<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/stench — сморід: три великі зелені хвилі запаху здіймаються вгору й тоншають, середня — найвища. Від персонажа тхне (низька гігієна): стан персонажа на панелі й думка кота-чистюлі, що не йде на руки (§8.7, §9.12, §11.4).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Ті самі хвилі, що fx/smell і запах у icon/dirty та icon/laundry, але великі й самі, без речі під ними: не дим підгорілого (smoke), не зіпсована страва (spoiled), не сорочка (laundry) і не купка в лотку (dirty). Хвилі greenHi, низ кожної в тіні shade 0,3. Контур — чорнильна форма ink під фарбою, а не штрих: штрих 6 на вузькій стрічці з'їв би зелене. Облямівка ≈ 3 угорі й з боків, ≈ 4 унизу.
-->
