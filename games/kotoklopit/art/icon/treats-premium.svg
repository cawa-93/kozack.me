<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/treats-premium — «Делікатеси для котів» (дорогий варіант запасу ласощів, §11.4 «Іконка біля назви»): те саме печиво-рибка, що icon/treats, політе світлою глазур'ю — зигзаг смужками через усю рибку від голови до хвоста. Картка товару в магазині.
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5; глазур — лінія кольором 4 без контуру).
Від icon/treats відрізняє лише глазур paper (обтята силуетом рибки, тінь base лягає й на неї, зяброва дужка й око — поверх; око — у просвіті між смужками); луски-дужки під нею прибрано, щоб глазур читалася смужками, а не мереживом. У 28 px рибка світліша й смугаста. Силует, око, зябра й хвіст — ті самі.
-->
