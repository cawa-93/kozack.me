<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hiss-kitten — шипить на кошеня: великий червоний знак злості «💢» (як icon/angry) угорі ліворуч, а праворуч унизу менше кошеня боком. Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Кіт шипить на іншого кота за цю причину (§9.4, Р2) — вголос над ним. Головне — злість: той самий знак «💢», що icon/angry (форма, червоний, тінь), у масштабі 0,72 угорі ліворуч (≈ 31 одиниця, поле 6…38); контур знака 4, дужки на 15 % ширші, щоб червоне не з'їв контур. Причина — менший значок праворуч унизу (≈ 50–55 % поля завдовжки, ≈ 35–40 % площею), притулений до правого нижнього краю поля; знак лежить поверх неї з паперовою облямівкою 2,5, як наліпка. Причина — той самий малюнок, що був великим, зменшений; контур × 0,72 (≈ LINE_SMALL). Усі п'ять різняться силуетом причини, а від kibble, litter, palms і cat — великим знаком злості.
-->
