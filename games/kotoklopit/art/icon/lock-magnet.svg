<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/lock-magnet — магнітний замок (дорогий варіант речі «Замок на шафку», §8.7, §9.12): той самий трохи нахилений навісний замок із сірою дужкою й рисочками брязкоту, але корпус сріблястий, а замість шпарини на ньому — червона підкова-магніт із сірими полюсами. Іконки варіантів (a26-variant-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5); дужка — 4, як у icon/lock; підкова — 2,5. Підкова нахилена разом із корпусом (≈ −8°).
Від icon/lock (дешевого) — кольором корпусу (сірий метал grey замість латуні mustard) і знаком на ньому (підкова-магніт замість шпарини), як червона підкова з сірими полюсами в item/lock/premium.
-->
