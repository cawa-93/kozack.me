<!-- icon/pain — крик болю: руда голова (≈ 2/3 ширини) з бровами вгору «/ \», міцно зажмуреними очима (товсті пласкі дуги з двома зморшками біля зовнішніх кутиків), роззявленим ротом «ой» кутиками донизу з язиком, а з боків і знизу — чотири червоні рисочки болю. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Сечокам'яна в лотку: бабл вголос над котом і значок біля назви хвороби в картці (22–26 px). Рисочки ≈ 4,6 × 10 — родинна ознака хвороб (stomach, joints, spine, urine). Без червоного зубчастого спалаху (злість чи переляк), без сліз (sad) і без «> <» (sneeze); рот кутиками донизу — не сміх.
-->
