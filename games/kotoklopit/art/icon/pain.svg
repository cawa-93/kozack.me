<!-- icon/pain — крик болю: червоний зубчастий спалах, а в ньому котяча голова з зажмуреними очима й роззявленим ротом. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
