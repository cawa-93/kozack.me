<!-- icon/pain — крик болю: червоний зубчастий спалах із дев'яти променів, а в ньому руда котяча голова з зажмуреними очима й роззявленим ротом. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Сечокам'яна в лотку, травма. Від meow — червоний спалах замість дуг; від fright — гладка руда голова в зубчастому червоному. Контур спалаху й голови — 5,5 (6 з'їдає червоні промені).
-->
