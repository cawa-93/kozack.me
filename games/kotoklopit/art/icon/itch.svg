<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/itch — свербіж: рудий кіт сидить, схилив голову набік і чухає за вухом задньою лапою — кругле стегно й одна лапа вгору до вуха, довкола ступні — великі червоні рисочки свербежу. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Блохи, дерматит: думка кота про те, що він відчуває. Кіт — складена форма (тулуб, стегно, лапа, хвіст одним контуром), тож лінії не перехрещуються; передні лапки — один блок. Силует «задня лапа піднята до голови» впізнають одразу.
-->
