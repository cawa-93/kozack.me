<!-- icon/itch — свербіж: рудий кіт сидить, схилив голову й чухає за вухом задньою лапою — від стегна вгору до вуха, довкола ступні — червоні рисочки свербежу. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Блохи, дерматит: думка кота про те, що він відчуває. Силует «задня лапа піднята до голови» впізнають одразу; від bird і mess — це кіт.
-->
