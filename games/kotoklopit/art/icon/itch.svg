<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/itch — свербіж: рудий кіт сидить боком мордою ліворуч, голова схилена, око біля вуха зажмурене; ближня задня лапа піднята від великого стегна зі згином скакального суглоба, ступня чухає за вухом — між ступнею й вухом щілина паперу; біля ступні й вуха — віяло довгих товстих червоних рисочок свербежу, а від спини відскакують чорнильні цятки-блохи. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Блохи, дерматит: думка кота про те, що він відчуває; біля назви хвороби в картці. Блохи (цятки ≥ 6 з рисочками стрибка) — найсильніша ознака «бліх». Від lick — задня лапа до вуха, а не передня до рота; від pain (крик болю) і claws (подряпини) — котом і блохами; від stolen — кіт сидить. Кіт — складена форма: тулуб і ближня передня лапа одним чорнилом 8, задня лапа — окремим шматком поверх (чорнило 7,6), дальня передня — у тіні.
-->
