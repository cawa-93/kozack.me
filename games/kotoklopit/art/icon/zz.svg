<!-- icon/zz — сон: велика й мала літери «Z» малюнком (не текстом) — товстий мазок кольору в чорнильній облямівці, нахилені й розміщені навскіс ↖. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Позначка «ні» поверх — розбудили. Літери нахилені на −22°, тож діагональ «Z» майже вертикальна, а ряд «z Z» іде ↖: мазок «ні» (↗) перетинає літери, а не лягає вздовж діагоналі. Літера — мазок, як промені icon/chilly (облямівка 9, колір 4,6).
-->
