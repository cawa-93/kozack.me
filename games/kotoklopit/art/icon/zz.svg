<!-- icon/zz — сон: три літери «Z» малюнком (не текстом) — велика (≈ 60 % поля) унизу праворуч, середня (≈ 35 %) угорі й найменша ліворуч, ритм «Zzz»; кожна — товстий насичено-синій (blue) мазок у чорнильній облямівці. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Стан «сонний» над персонажем; з ✗ — кота розбудили (zz+no). Перекладини кожної літери горизонтальні й довгі (нахил літер — лише 6°, не −22°), круто йде лише діагональ: так це «Z», а не пружина чи блискавка (wire, no-power, dizzy). Літери окремі, між ними паперу ≥ 5. Літери — заливками (капсули: колір 7 / 5,4 / 3,8 і облямівка ≈ 2), бо разом із облямівкою вони ширші за межу stroke 9. Ряд ↖, тож мазок «ні» (↗) перетинає діагональ великої літери, а горизонтальні перекладини лишаються обабіч мазка.
-->
