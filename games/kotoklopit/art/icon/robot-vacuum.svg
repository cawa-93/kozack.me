<!-- icon/robot-vacuum — робот-пилосос: сірий диск спереду-згори з кришкою, темною башточкою й зеленим вогником, як дешевий item/robot/cheap. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Робот-пилосос» у магазині (THING_ICONS, symbols.ts). Плаский диск із башточкою — силует, якого серед іконок немає (каструля pot — висока, з ручками й парою; пральна машина washer — коробка з вікном). Бічну щітку не малюємо: у 24 px її щетина читалася крихтами.
-->
