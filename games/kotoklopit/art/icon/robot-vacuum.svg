<!-- icon/robot-vacuum — робот-пилосос: плаский диск спереду-згори у два тони — темна кришка в світлому обідку greyHi, спереду світла дуга бампера, — ззаду на кришці висока башточка, перед нею великий зелений вогник, позаду — три короткі риски руху. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Як дешевий item/robot/cheap. Два тони диска, вогник і риски руху кажуть «техніка, що їздить», а не тарілка чи шайба: не каструля pot (висока, з ручками й парою), не миска food-bowl і не дим smoke. Бічну щітку не малюємо: у 24 px її щетина читалася крихтами.
-->
