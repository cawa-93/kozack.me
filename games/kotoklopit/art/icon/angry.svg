<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/angry — злість: червоний знак «💢» — чотири вигнуті дужки опуклістю до центру, кінці розходяться хрестом; нижня частина кожної дужки — у тіні. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Шипить, ображений на руках, шаленіє від м'яти. Знак без кота: шипіння з причиною (hiss-*) — той самий знак зі значком причини. Контур 5 (знак, не силует: з 6 дужки злипаються в рамку), дужки трохи ширші; тінь base — на нижній половині кожної дужки (STYLE §4, §11).
-->
