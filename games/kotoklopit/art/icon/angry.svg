<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/angry — злість: червоний знак «💢» — чотири окремі дужки в кутах, опуклістю до центру; кінці загострені й розведені назовні вздовж осей, між кінцями сусідніх — паперовий проміжок ≥ 6 хрестом «+», середина кожної дужки товща. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Шипить, ображений на руках, шаленіє від м'яти, шипить на гостей з-під дивана. Знак ≈ 90 % поля, контур 4 (знак, не силует: товстіший контур з'їдає червоне й проміжки); легка тінь soft — на нижній третині кожної дужки. Розімкнений, щоб у 24 px не злипався в кільце-печатку (cv-rejected) чи спалах (pain); без хреста посередині — не cross. Дужки на діагоналях, а проміжки на осях, як у 💢: з проміжками на діагоналях знак у 24 px читався рамкою з «✕».
-->
