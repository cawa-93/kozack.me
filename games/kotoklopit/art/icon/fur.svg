<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/fur — жмут шерсті на руці: розкрита долоня догори (пальці праворуч, великий палець угору, синій рукав ліворуч), на ній — кошлатий рудий жмут котячої шерсті з пасмами, довкола навскіс злітають чотири довгі волосинки. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12b), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Після пестощів — думка персонажа (§9.12). Жмут рудий (orange, верх orangeHi, пасма — лінзи ink), кошлатий з пасмами в усі боки (не язики полум'я й не булка з парою), ≈ половина іконки — котяча шерсть, а не будівельний пил і не сіро-бура грудка cough. Рука — словником attention / hiss-hand: шар чорнила 9 (облямівка 4,5) під фарбою pinkHi, рукав blue. Одна рука з шерстю — не palms (та сама рука долонею догори, але порожня, «ківшиком» і з «?» замість жмута шерсті) і не hands (руки тримають стос коробок); не клубок бійки fight і не дим smoke. Волосинки — вигнуті лінзи ink ≈ 3,8 посередині, навскіс і вбік.
-->
