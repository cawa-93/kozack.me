<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/fur — жмут шерсті на руці: долоня боком, на ній пухнастий сіро-бежевий жмут шерсті з пасмами, дві волосинки летять. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Після пестощів — думка персонажа (§9.12). Не icon/cough (грудка шерсті в кота) і не долоні шипіння й уваги: долоня лежить, а головне — пухнастий жмут.
Долоня з манжетом — складена форма: шар чорнила (на 5 ширший) під шаром фарби.
-->
