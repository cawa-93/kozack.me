<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/joints — хвороба суглобів: дві кістки сходяться кутом, як у зігнутій лапі, а від суглоба між ними — червоні рисочки болю. Пакет «Іконки хвороб» (іконки біля назв, GAME_DESIGN §11.4), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Хвороби суглобів» у ветеринара. Кістки — складена форма (чорнило 9 під фарбою, облямівка 4,5). Не spine (стовпчик хребців), не bandage (травма) і не claws чи itch (червоні рисочки там — кігті й свербіж).
-->
