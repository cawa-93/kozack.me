<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/joints — хвороба суглобів: дві теплі кістки сходяться в суглобі майже під прямим кутом, як зігнута лапа (одна вгору, друга вбік униз праворуч), з чіткою тінню на нижньому боці; із зовнішнього боку суглоба — віяло товстих червоних рисочок болю. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — пакет «Іконки хвороб»), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Біля «Хвороби суглобів» у ветеринара. Кістки — складена форма (чорнило 9 під фарбою, облямівка 4,5), колір ropeHi з тінню base: на папері й емалі вони не біліють у «хмаринку», як майже паперові. Не spine (вигнутий стовпчик хребців), не bandage (травма) і не claws чи itch (червоні рисочки там — кігті й свербіж).
-->
