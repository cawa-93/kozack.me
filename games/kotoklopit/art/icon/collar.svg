<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/collar — нашийник із табличкою: розстебнутий вигнутий червоний ремінець — ліворуч сталева пряжка з язичком, праворуч звужений кінець із трьома дірочками, — а знизу на кільці висить латунний жетон (≈ 25 % ширини). Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Кільце — чорнило 5,4 з металом greyHi 2,2, отвір видно наскрізь.
Розстебнутий ремінець, а не кільце-«пончик»: вигин і кінці з пряжкою й дірочками кажуть «нашийник» навіть у 24 px. Не укус bite, не іграшка toy, не конус ветеринара vet-clinic.
-->
