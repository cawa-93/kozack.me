<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/attention — хоче уваги: рука долонею донизу лягла згори на маківку (три товсті пальці віялом, великий палець, синій рукав угору-ліворуч), а велика руда голова тягнеться й бодається в неї — очі задоволено заплющені, друге вухо стирчить. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Думка кота (А18). Рука — тим самим словником, що hiss-hand (A12b) і hands (A11b): пальці-капсули зі щілинами. Від spit-pill (капсула відлітає вгору-праворуч від рота) — рука згори, лягла на голову, рукав у протилежний кут; від aloof — кіт сам тягнеться до руки, руки й голови не розділяє повітря.
-->
