<!-- icon/table — кухонний стіл: дерев'яний стіл трохи згори, як у світі (A2 env/table) — глибока стільниця з дошками, товстий торець, дві передні й дві коротші задні ніжки; на стільниці — велика тарілка з рибкою. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Кіт пам'ятає «ні» про кухню — думка кота з позначкою «ні» (§9.12, «Слухняність»). Стільниця широка (≈ 80 % поля), тож мазок «ні» її перетинає, а не ховає. Не стіл із комп'ютером (icon/cat-laptop) і не стільниця зі стравою й табличкою (icon/taken): у стола високі ніжки.
-->
