<!-- icon/chew-bag — кіт гризе пакет: зелений пакет корму з гофрованим швом угорі й етикеткою; правий верхній ріг відкушено, з нього сиплються крихти, поруч — «хрум». Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Хрумтить — вголос над котом (§9.12, «Гризіння»). Той самий мотив укусу й «хрум», що в icon/chew-wire, а предмет — інший силует.
-->
