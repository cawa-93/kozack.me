<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/chew-bag — кіт гризе пакет: червоний пакет корму з гофрованим швом угорі й круглою паперовою етикеткою з рибкою (той самий, що в шафці cabinet-open); головне — великий півкруглий укус зі зубчастим краєм у правому верхньому розі, під ним сиплються три крихти, біля укусу — товсті гірчичні риски «хрум». Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A12b), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Хрумтить — вголос над котом (§9.12, «Гризіння»). Укус ≈ 18 одиниць, крихти ≥ 6, риски «хрум» — ті самі, що в chew-wire (гірчичні 4,4 з облямівкою чорнила). Пакет спільний із cabinet-open (там цілий, у шафці), а відрізняє іконку саме укус; етикетка менша, щоб звільнити місце під укус. Не зелена аптечка kit, не корм kibble і не наповнювач litter.
-->
