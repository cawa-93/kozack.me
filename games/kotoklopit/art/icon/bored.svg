<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/bored — нудьга: велика руда котяча голова позіхає — очі заплющені, рот роззявлений на всю морду з рожевим язиком, — а над нею праворуч на дерев'яній вудочці мляво висить пір'я, рівно донизу, без руху. Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Нудьгар не зважає на вудку» (GAME_DESIGN §11.4: «котяча голова позіхає, пір'їнка висить без діла»). Позіхання — заплющені очі й високий овал рота (від meow — та сама голова, але очі закриті, а замість дуг звуку — вудочка); пір'я висить прямо вниз, не віялом, як у toy (там — китиця навскіс). Кіт, що лежить із важкими повіками (як було), на телефоні читався як «кіт спить».
-->
