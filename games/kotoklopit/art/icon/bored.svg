<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/bored — нудьга: рудий кіт лежить довгим низьким буханцем, голова мордою до нас поклала підборіддя на лапки, повіки важко опущені (прямі риски над півколами очей), а перед ним на підлозі лежить вудочка з червоною китицею — кіт і вухом не веде. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Не хоче гратися. Кіт — головний силует на всю ширину; вудочка менша й лежить на підлозі (у toy — велика й навскіс), китиця одного кольору. Від sad (голова з вухами вниз і сльоза) і sulk (кіт спиною) — низьким довгим буханцем мордою до нас; від cough — спина низька, не дугою.
-->
