<!-- icon/bored — нудьга: кіт лежить буханцем, підборіддя на лапках, повіки важко опущені, а поруч бовтається вудочка з китицею пір'я (як icon/toy) — кіт і вухом не веде. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Не хоче гратися. Від sad (голова з вухами вниз і сльоза) і sulk (кіт спиною) — силуетом: низький широкий буханець і вудочка поруч, до якої кіт байдужий.
-->
