<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/bored — нудьга: вудочка з icon/toy (паличка, китиця червоних і гірчичних пір'їн, гірчичний вузлик) мляво звисає угорі ліворуч, а кіт відвернувся: руда голова в профіль праворуч, важкі прямі повіки над видимою зіницею, що дивиться вбік, рот — рівна риска. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Нудьгар не зважає на вудку й відвертається» (GAME_DESIGN §11.4). Вудочка — icon/toy ×0,56, дзеркально (держак униз ліворуч, пір'я перед котом). Очі не заплющені й кіт не лежить — не «спить» (zz); рот не роззявлений — не meow. Граматика та сама, що в picky.
-->
