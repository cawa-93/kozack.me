<!-- icon/demotion — пониження в титрах життя (§4.2): сіра зірка, що падає, — перекинута навскіс, нижче центру, над нею три риски падіння вліво-вгору. Пара до promotion (гірчична зірка рівно): інший колір і силует, а не дрібниці.
