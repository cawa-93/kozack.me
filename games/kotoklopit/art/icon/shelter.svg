<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/shelter — притулок: синій будинок спереду з дахом-шевроном, у арці дверей визирає руда котяча голова. Іконки пунктів поїздок (GAME_DESIGN §11.4 «Іконка біля назви», §8.5 «На місці — кадр парковки»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Голова кота — облямівка 4,5 (дрібна форма).
Біля «Притулок» у «Куди поїхати?», у заголовку картки пункту, на кнопці знайди «Віднести в притулок» і на табличці на даху (DESTINATION_ICONS, symbols.ts). Синій будинок спереду з котом у дверях — не картонний котячий будиночок cat-house (навскіс, порожній отвір, сердечко) і не гліф дому ui/glyph/home (червоний дах, двері).
-->
