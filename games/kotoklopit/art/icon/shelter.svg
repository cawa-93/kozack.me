<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/shelter — притулок: синій фасад установи, ширший за висоту, з пласким карнизом, у двох вікнах — по рудій котячій голові, посередині двері, а над ними, на карнизі, — кругла паперова вивіска з червоною лапкою. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Котячі голови (≈ 14) — контур 3,6.
Біля «Притулок» у «Куди поїхати?», у заголовку картки пункту, на кнопці знайди «Віднести в притулок» і на табличці на даху (DESTINATION_ICONS, symbols.ts). Багато котів у вікнах — заклад, де живуть тварини, а не хатка одного кота: без шеврона собачої будки й без веж (вежі — office), не вітрина з навісом (store). Синій, щоб не плутати з червоним дахом ui/glyph/home і картоном cat-house; вивіска з лапкою, а не сердечко — сердечко лишається в cat-house; не кіт у коробці cat-box.
-->
