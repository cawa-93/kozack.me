<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/renovation — перфоратор, що довбе: свердло навскіс угору ліворуч, довкола вістря три риски гуркоту. Ремонт у сусідів: за стіною
свердлять, неприємні справи дратують більше (стан персонажа на панелі й у профілі телефона, §4.1, §8.4); з позначкою «ні» — тиша за стіною.
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / патрон 4,5 / свердло 3 / риски 4.
Корпус із рукояттю teal (верх tealHi), патрон darkHi, свердло greyHi з витками grey, курок і риски ink, тінь shade 0,3.
Перфоратор лежить навскіс ↖ (нахил 20°): мазок «ні» ↗ перетинає патрон і перед корпусу, а свердло з рисками (угорі ліворуч) і рукоять (унизу праворуч) лишаються обабіч мазка.
Не гуркіт розбитого (loud: гучномовець із хвилями), не пилосос (vacuum: щітка внизу), не перегризений дріт (wire) і не «немає світла» (no-power: лампочка) — пістолетний силует зі свердлом.
-->
