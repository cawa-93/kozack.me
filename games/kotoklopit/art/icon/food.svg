<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/food — продукти: паперовий пакет із зубчастим краєм, з якого стирчать багет і червоне яблуко. Ситість (HUD), запас «продукти», сира порція в руках. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Пакет вищий за ширину, із зубцями паперу вгорі й складкою збоку — не вазон (раніше трапеція з двома листками читалась як рослина в горщику), не тарілка (готова страва — icon/meal) і не мішок наповнювача (icon/litter, зав'язаний і круглий). Яблуко — предмет, що не схожий на рослину.
-->
