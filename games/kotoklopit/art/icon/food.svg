<!-- icon/food — продукти: довгий рум'яний батон із трьома світлими надрізами лежить спереду навскіс на всю ширину, за ним — червоне яблуко з хвостиком і листочком, без пакета. Ситість (HUD), запас «Продукти», сира порція в руках. Ревізія іконок 2026-11-03, раунд 3 (варіант «яблуко й батон»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, важкий низ батона — заливка 8,5, що звужується до кінців; внутрішні 3,5).
Самі продукти, без пакета: паперовий пакет у 24 px читали «коричневою коробкою» й «покупками з магазину», а не їжею. Батон і яблуко — дві великі прості плями (золотава kibbleHi й червона). Батон — явно довгий і вузький (≈ 49 × 16), кінці заокруглені й звужені, щоб у 24 px не читався булкою чи «човником»; надрізи — три широкі (≈ 3,8) лінзи cardboardHi, кожна з тінню base з нижнього боку: у 24 px лишаються смуги, а не суцільна пляма. Яблуко — угорі ліворуч, праву половину звужено: бейдж «?» і плашка кількості в куті лише торкаються його краю, а головна діагональ мазка «ні» йде переважно по батону й порожньому куту, а не червоним по червоному. Без тарілки й пари (icon/meal, icon/taken), без миски (icon/kibble), не контейнер (icon/mom-meal), не каструля (icon/pot), не коробка (icon/box), не печиво-рибка (icon/treats, того самого кольору, але іншого силуету).
-->
