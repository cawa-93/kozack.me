<!-- icon/drops — краплі для котів: скляна піпетка з гумовою грушкою, з носика падає бірюзова крапля. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Піпетка навскіс і крапля — не пляшка шампуню (icon/shampoo), не таблетки (icon/pills) і не крапля води (icon/drop): крапля бірюзова й під носиком піпетки.
-->
