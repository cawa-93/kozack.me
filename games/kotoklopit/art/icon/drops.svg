<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/drops — краплі для котів: бурштинова (гірчична) пляшечка-крапельниця догори дном, з білого носика падає бірюзова крапля. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Пляшечка носиком униз і крапля — не пляшка шампуню, що стоїть (icon/shampoo), не градусник (icon/thermometer), не таблетки (icon/pills) і не крапля води (icon/drop): крапля менша й під носиком; на наліпці — та сама крапля. Угорі праворуч — повітря для «0».
-->
