<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/drops — краплі для котів: товста бурштиново-гірчична пляшечка-крапельниця лежить навскіс носиком униз праворуч (45°), на ній — невелика паперова наліпка, з короткого білого носика вилітає велика бірюзова крапля з білим відблиском. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — A11a), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Силует «товста пляшечка + крапля»: тіло суцільного кольору mustard (верх mustardHi), без смугастої етикетки на все тіло — у 24 px вона робила з пляшечки олівець. Крапля ≈ 27 % ширини — та сама бірюзова крапля, що відлітає від кота в spit-drops. Не пляшка шампуню, що стоїть (shampoo), не градусник (thermometer), не ручка (pen), не крапля води (drop: одна велика крапля без пляшечки) і не жовті краплі сечі (urine). Відблиск — свідомий виняток із «без блиску» (STYLE §4) за ревізією іконок: так крапля рідка.
-->
