<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/obese — ожиріння: рудий кіт-куля сидить на маленьких вагах (пласка платформа, ширша за кота, з віконцем-циферблатом) — тулуб ≈ 2,5 ширини крихітної голови, черево звисає з боків до самих ваг, з-під нього ледь визирають дві крихітні лапки, хвіст збоку. Ревізія іконок 2026-11-03 (пачка b2-cat-actions-meds; було — пакет «Іконки хвороб»), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Біля «Ожиріння» у ветеринара. Силует — широка куля на пласкій платформі ваг (greyHi): не сидячий кіт cat, не sulk (кіт спиною), не nest (кошеня клубочком у гнізді) і не mood-up (зелене серце). Черевце orangeHi; тулуб, хвіст і лапки — складена форма (чорнило під фарбою).
-->
