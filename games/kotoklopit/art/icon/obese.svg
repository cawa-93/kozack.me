<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/obese — ожиріння: рудий кіт сидить — невелика голова на круглому, як м'яч, тулубі зі світлим черевцем; хвіст обвиває низ. Пакет «Іконки хвороб» (іконки біля назв, GAME_DESIGN §11.4), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах.
Біля «Ожиріння» у ветеринара. Не cat (кіт сидить, звичайний), не sad чи fright (голови), не nest (кошеня клубочком): силует — широка куля, удвічі ширша за голову. Хвіст — складена форма (чорнило 8 під фарбою).
-->
