size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Від icon/kibble відрізняють колір гранул (red замість kibbleHi — червонястий «Гурман», як совок item/scoop у стані premium) і два шматочки orangeHi іншої форми (скруглені кубики замість гранул: угорі праворуч і внизу ліворуч). Миска, розміри й місця купки — ті самі.
-->
