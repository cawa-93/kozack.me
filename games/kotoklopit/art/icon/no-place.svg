<path d="M32 16L55 32L32 48L9 32Z" fill="none" stroke="#2e1f29" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M9 32L32 48L55 32" fill="none" stroke="#2e1f29" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
