<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/no-place — поставити річ нікуди: ромб плитки підлоги з тим самим контуром, що підсвічує клітинку під річчю. Пакет A11 «Іконки I», art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур плитки 6 (низ 8,5), підсвітка 4,5.
Відмова «Поруч немає вільної клітинки» (GAME_DESIGN §8.7): код кладе поверх позначку «ні». Від no-room (шафа) — силуетом: пласка плитка.
-->
<defs>
<clipPath id="icon-no-place-tile"><path d="M32 16L55 32L32 48L9 32Z"/></clipPath>
</defs>
<g id="p-tile">
<path d="M32 16L55 32L32 48L9 32Z" fill="#b98b60"/>
<path d="M0 37L32 56L64 37L64 64L0 64Z" fill="#3f2541" fill-opacity="0.16" clip-path="url(#icon-no-place-tile)"/>
