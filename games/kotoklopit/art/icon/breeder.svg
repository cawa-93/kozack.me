<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/breeder — розплідник: велика руда голова кішки й поруч, попереду праворуч унизу, менша світло-руда голова кошеняти. Іконки пунктів поїздок (GAME_DESIGN §11.4 «Іконка біля назви», §8.5 «На місці — кадр парковки»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Голова кошеняти — облямівка 4,5 (дрібна форма).
Біля «Розплідник» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Дві голови, мама й маля, — звідки беруться кошенята: не кіт cat (один, сидить), не кошеня в гнізді nest і не шипіння на кошеня hiss-kitten (знак злості й кошеня на весь зріст).
-->
