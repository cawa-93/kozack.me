<!-- icon/breeder — розплідник: велика руда голова кішки ліворуч угорі й поруч, праворуч нижче, на своїй площі — світліша голова кошеняти (≈ 60 % голови кішки) з великими очима; між ними паперова облямівка 3,5. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Голова кошеняти — контур 4,5 (дрібна форма).
Біля «Розплідник» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Дві голови різного тону й розміру, кожна з двома горбами вушок, — мама й маля, звідки беруться кошенята: не кіт ui/glyph/cat (одна голова), не немовля в гнізді nest, не сіре кошеня на весь зріст у шипінні hiss-kitten і не кіт у конусі vet-clinic.
-->
