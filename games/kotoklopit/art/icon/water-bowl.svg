<!-- icon/water-bowl — миска для води: сіра металева поїлка спереду-згори з водою, на бочку вм'ятина, як дешева item/water/cheap. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Миска для води» в магазині (THING_ICONS, symbols.ts). Сама річ, а не стан чи потреба: спрага кота — icon/drink (синя миска, згори в неї падає крапля), порожня миска для води — icon/thirst (перекреслена крапля). Тут нічого не падає й не перекреслено: метал, вода й брижі. Від food-bowl — сірим металом і водою.
-->
