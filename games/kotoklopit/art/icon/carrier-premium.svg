<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/carrier-premium — надійна переноска (дорогий варіант речі «Переноска», §8.7): той самий округлий пластиковий корпус, висока сіра ручка-дуга й великі дверцята в темне нутро з гірчичними котячими очима, але корпус вишневий, дверцята металеві — часті сірі ґратки (три прути й поперечка), а праворуч на рамці — латунна засувка. Іконки варіантів (a26-variant-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Ручка й засувка — облямівка під фарбою; прути — greyHi без контуру: на темному нутрі він не потрібен.
Від icon/carrier (дешевої) — кольором (вишневий, а не червоний) і дверцятами (часті тонкі металеві ґратки замість двох товстих прутів), як вишнева переноска з латунною засувкою й ґратками в item/carrier/premium.
-->
