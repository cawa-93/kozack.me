<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/food-bowl — миска для корму: широка низька гірчична керамічна миска спереду-згори, боки розходяться донизу (стійка, не перекинеш); нутро затінене, на дні дві крихти корму. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Миска для корму» в магазині (THING_ICONS, symbols.ts). Сама річ, а не корм: kibble — синя миска з гіркою гранул над обідком (запас, голод кота); тут лише дві крихти на дні. Від water-bowl (сіра поїлка, що звужується донизу, з бірюзовою водою), drink (синя миска, крапля) і fountain — силуетом і тоном (рецензія 2026-11-02: колишня синя порожня миска зі світлим нутром у 22–26 px читалася як вода): трапеція, ширша внизу, гірчична кераміка (як золотий обідок дорогої item/bowl/premium), темне нутро без «рідини».
-->
