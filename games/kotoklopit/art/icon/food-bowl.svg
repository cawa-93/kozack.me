<!-- icon/food-bowl — миска для корму: синя пластикова миска спереду-згори, порожня, з подряпинами на бочку, як дешева item/bowl/cheap. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Миска для корму» в магазині (THING_ICONS, symbols.ts). Та сама синя миска, що в icon/kibble, але порожня, і видно її нутро: kibble — корм (запас, голод кота), гірка гранул над обідком; тут — сама річ, обідок рівний. Від water-bowl — синім пластиком (там сірий метал) і порожнім нутром (там вода).
-->
