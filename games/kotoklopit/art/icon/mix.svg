<!-- icon/mix — не змішувати: миска, де навпіл два різні корми (звичайний і зелений для стерилізованих), і ложка, що їх мішає. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Миска — з еталона icon/kibble, але гірка двоколірна й стирчить ложка: інший силует, ніж просто корм (icon/kibble з ✗ — «корм сюди не можна»). Завжди з позначкою «ні».
-->
