<!-- icon/mix — корми не змішують: два струмені буквою V сходяться в одну миску — ліворуч бурі гранули звичайного корму, праворуч зелені палички корму для стерилізованих, і в мисці дві купки двох кольорів поруч. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Завжди з позначкою «ні» (відмова mixed): мазок ↗ іде через середину, а бурий струмінь лишається ліворуч угорі від нього, зелений — праворуч унизу. Миска — еталона icon/kibble, гранули — його ж, палички — ті самі, що в icon/kibble-sterile. Ковша немає: у 24 px він не читався. Від icon/kibble з «ні» (перекреслена миска з бурим кормом) — двома кольорами й двома струменями.
-->
