<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mix — не змішувати: совок сиплє зелений корм для стерилізованих у миску, де вже лежить звичайний. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Миска з гіркою звичайного корму — з еталона icon/kibble (×0,8), а над нею совок (як у руках, item/scoop) навскіс і зелена гранула, що падає: інший силует, ніж просто корм (icon/kibble з ✗ — «корм сюди не можна»). Завжди з позначкою «ні»: ручка совка ↖ — поперек мазка.
-->
