<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/no-room — немає місця: дерев'яний стелаж, напханий світлими картонними коробками впритул, — боки роздуло, нижня коробка стирчить за край, зверху лежить ще одна, перекошена. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Переповнення — силуетом: роздуті стінки, коробка, що нависає над краєм, і коробка, що стирчить збоку. Дерево й однакові світлі коробки — не темна шафка з відчиненими дверцятами (icon/cabinet-open, A12b), не пакунок (icon/box) і не порожня коробка (icon/empty). Без «!» (терпіння — icon/alert) і без кількості.
-->
