<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/no-room — розкласти запаси нікуди: висока дерев'яна шафа не зачиняється — ліва стулка зачинена, права відкинута, а з прорізу випирають за контур угору й уперед запаси: мішок над шафою, зелена пляшка навскіс, сливовий пакет унизу; синя банка падає за край. Праворуч угорі — вузький гірчичний «!». Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур шафи 6 (важкий низ 8,5), стулки — 4,5, запасів — 3,5, дрібне 2,5: великі запаси не тонуть у чорнилі.
Відмова «Розкласти запаси нікуди: сховища повні» (GAME_DESIGN §11.4: «повна шафа зі знаком оклику»). Замість шести тонких смужок — великі запаси (≥ 12) різних кольорів і форм: мішок, пляшка, пакет, банка — іконка каже «запаси», а не «одяг», і не плутається з folded і laundry. Від cabinet-open (низька широка шафка з пакетом корму всередині) — висока шафа, з якої речі вилазять назовні. «!» — окремий знак, не трикутник alert. Без картонних коробок — щоб не плутати з box, cat-box і empty.
-->
