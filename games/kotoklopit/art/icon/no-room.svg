<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/no-room — немає місця: висока дерев'яна шафа з відчиненими навстіж дверцятами, напхана по самі вінця стосами речей (синій, зелений, червоний, гірчичний), і речі вже вилазять за край — рукав звисає, шкарпетка випала; праворуч — великий гірчичний знак оклику. Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Розкласти запаси нікуди: сховища повні» (GAME_DESIGN §11.4: «повна шафа зі знаком оклику»). Без картонних коробок — щоб не плутати з box, cat-box і empty. Від cabinet-open (низька шафка, одні дверцята, пакет корму всередині) — висока шафа на дві відчинені дверцяти, різнобарвні стоси на всю висоту й знак оклику на всю висоту, той самий, що в taken.
-->
