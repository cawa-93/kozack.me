<!-- icon/no-room — немає місця: стелаж, напханий впритул різними речами, боки роздуло, мішок вилазить за край, зверху ще коробка. Пакет A11a, art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points немає. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Стелаж із речами впритул — сховище, у яке більше не влізе; не пакет продуктів (icon/food), не пакунок (icon/box) і не порожня коробка (icon/empty). Без «!» (терпіння — icon/alert) і без кількості.
-->
