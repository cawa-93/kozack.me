<!-- icon/claws — три подряпини від кігтів одним розмахом: кіт подряпав.
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Вголос над персонажем (переноска, ванна, «Ніндзя»). Подряпини — лінзи (STYLE §5): гострі з обох кінців, вигнуті одним розмахом лапи; червона лінза на ширшій чорнильній (контур, що сходить нанівець на вістрях); без тіні — слід, а не річ. Не хрест терпіння (cross) й не риска «ні».
Пакет A11b (хвиля 2 кроку 16), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
-->
