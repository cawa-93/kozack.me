<!-- icon/scratcher — кігтеточка: високий широкий сизалевий стовпчик (≈ 40 % ширини, ≈ 60 % висоти) з чотирма товстими темними витками обмотки навскіс, згори тонка вужча поличка-лежанка, внизу плаский світлий килимок, найширший, а збоку на видимій шворці висить червоний помпон. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Тонкі поличка й килимок — облямівка 5,2 під фарбою, щоб світлий колір не з'їдав контур.
Як дешева item/scratcher/cheap. Головна форма — обмотаний стовпчик, а не плити: поличка тонка й вужча за основу, основа — світлий килимок, а не темна плита, тож силует не корпус кавоварки й не вітрина магазину store. Кігті (icon/claws) — подряпини кота на персонажі, не кігтеточка.
-->
