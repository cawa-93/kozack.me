<!-- icon/scratcher — кігтеточка: стовпчик, обмотаний сизалем, на килимовій основі, згори — поличка, з неї на шворці висить червоний помпон, як дешева item/scratcher/cheap. Іконки речей магазину (GAME_DESIGN §11.4 «Іконка біля назви», рішення автора 2026-11-02), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
Біля назви «Кігтеточка» в магазині (THING_ICONS, symbols.ts). Силует — стовпчик між двома плитами й помпон збоку: іншої такої форми серед іконок немає. Кігті (icon/claws) — подряпини кота на персонажі, не кігтеточка.
-->
