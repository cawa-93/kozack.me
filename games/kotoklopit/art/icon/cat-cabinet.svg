<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/cat-cabinet — шафка з котячим кормом як річ, яку переставляють (§8.7, «Переставити річ»): дерев'яна тумба спереду-згори зі світлою кришкою, двоє зачинених дверцят — на лівих паперова лапка, на правих сиза рибка, — між ними дві темні ручки-скоби. Як env/cat-cabinet у квартирі. Іконки сховищ (a27-storage-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
На кнопці перестановки (що візьме персонаж) і як річ у руках. Від kibble (миска корму — запас у шафці) — це меблі, а не корм; від cabinet-open (шафка клацнула й відчинилася) — дверцята зачинені, пакета й рисок «клац» немає; від lock — без замка; від no-room — низька, нічого не випирає.
-->
