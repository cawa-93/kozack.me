<!-- icon/litter-bag — мішок наповнювача як річ, яку переставляють (§8.7, «Переставити річ»): великий пузатий паперовий мішок-«бочка» на всю іконку, горловина посередині перехоплена кільцем мотузки, над нею — паперова «корона» з трьома ріжками; навколо мішка — бірюзова смуга з паперовою лапкою. Як env/litter-bag у квартирі. Іконки сховищ (a27-storage-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
На кнопці перестановки (що візьме персонаж) і як річ у руках. Від litter (запас: вузький мішечок-«калитка» з лотком на смузі й купкою сірих гранул поруч) — один широкий мішок посередині, лапка замість лотка, гранул немає; від chew-bag (червоний пакет корму) і box (коробка) — папір мотузяного кольору, кругла «бочка» й зав'язана корона.
-->
