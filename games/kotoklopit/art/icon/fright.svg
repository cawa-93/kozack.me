<!-- icon/fright — переляк: настовбурчена руда голова — кілька великих пасом шерсті дибки в одному контурі, вуха в боки, круглі очі з крихітними зіницями й маленький рот «о», з боків рисочки тремтіння. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Як у GAME_DESIGN §11.4: «настовбурчена котяча голова з круглими очима, вухами в боки й ротом «о»». Не «!» терпіння (alert) і не злість. Контур 6 лише зовні; пасма розділяють внутрішні лінії 3,5, тож рудої шерсті видно багато.
-->
