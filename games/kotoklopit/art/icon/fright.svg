<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/fright — переляк: руда голова з трохи притиснутими вухами (трикутники з рожевим), шерсть дибки — два великі пасма на маківці й по пасму на щоках, великі білі круглі очі з крихітними зіницями, рот «о», а обабіч вузької щелепи — по дві паралельні дуги тремтіння. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Як у GAME_DESIGN §11.4. Очі paper ≈ 15 з контуром 3, зіниці ≈ 4; рот «о» ≈ 7 × 8 (з контуром ≈ 10 × 11); пасма — руді, частина силуету, з внутрішньою лінією 3,5 (без чорної маси); дуги — 4 завтовшки, ≈ 12 завдовжки, осторонь від голови. Жодного зубчастого ореолу — не pain і не angry; від sad — білі очі й шерсть дибки, без сльози.
-->
