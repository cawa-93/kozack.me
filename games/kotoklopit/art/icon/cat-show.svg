<!-- icon/cat-show — виставка котів: гірчичний кубок-трофей із котячими вухами на вінцях і лапкою, на ніжці й дерев'яній підставці. Іконки пунктів поїздок (GAME_DESIGN §11.4 «Іконка біля назви», §8.5 «На місці — кадр парковки»), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Ручки — шар чорнила під шаром фарби (облямівка, як ручка kit).
Біля «Виставка котів» у «Куди поїхати?», у заголовку картки пункту й на табличці на даху (DESTINATION_ICONS, symbols.ts). Кубок, а не розетка: не печатка-розетка «фермерських» продуктів item/dish/raw (кругла, зі стрічками).
-->
