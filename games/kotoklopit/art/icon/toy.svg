<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/toy — вудочка-дражнилка: довга пряма дерев'яна паличка навскіс, мотузка й китиця з чотирьох довгих пір'їн (червоні й гірчичні) на гірчичному вузлику. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Хоче гратися (думка), річ у руках — вудочка, як item/toy (A5). Паличка йде навскіс ↖, щоб позначка «ні» (мазок ↗) її перетинала. Пір'їни — лінзи з осьовою лінією, звисають китицею й вигнуті в один бік (не віночок «квітки»).
-->
