<!-- icon/mark/no — позначка «ні» поверх іконки: червоний мазок пензлем навскіс ↗ через усю іконку — лінзою: посередині найширший, до кінців звужується, з чорнильною облямівкою. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Сюди не можна, не треба, не діє (§11.4). Накладається на іконку в тій самій точці й масштабі; мазок іде з лівого нижнього кута в правий верхній —
тож предмети іконок під позначкою «ні» лежать навскіс ↖, щоб мазок їх перетинав, а не лягав уздовж.
-->
