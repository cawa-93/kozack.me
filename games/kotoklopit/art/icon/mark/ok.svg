<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mark/ok — позначка «✓» поверх іконки: зелений бейдж із паперовою галочкою в чорнильній облямівці в самому правому верхньому куті, обведений паперовим кільцем. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Це вже є (§11.4). Бейдж — коло r 11,3 з центром (46,5; 17,5) (у «?» з раунду 3 ревізії — диск r 12,6 з центром (46; 18) і обідком 2,5, тож слід на ≈ 0,5 більший), контур 4 — разом із контуром край бейджа торкається поля 4…60 праворуч і згори; паперове кільце 3 (обтяте полем). Галочка — облямівка 7,5 і папір 3,5, не тонша, ніж була. З-під бейджа видно капсулу ліків і стос футболок.
-->
