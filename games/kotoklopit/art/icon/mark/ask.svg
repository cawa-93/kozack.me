<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mark/ask — позначка «?» поверх іконки: гірчичний диск у самому правому верхньому куті, на ньому — чорнильний «?» без паперу, обведений паперовим кільцем. Ревізія іконок 2026-11-03, раунд 3 (art/STYLE.md).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Потрібно це (§11.4). Диск — коло r 12,6 з центром (46; 18), обідок 2,5: разом з обідком край торкається поля 4…60 праворуч і згори; паперове кільце 3 (обтяте полем). Слід ≈ 13,85 / 16,8 (диск з обідком / кільце) — на ≈ 0,5 більший, ніж у icon/mark/ok (13,3 / 16,3): тонший обідок лишає всередині місце на знак. Знак — суцільне чорнило 4,6 просто на гірчичному: гачок — відкрита дуга ≈ 180° (радіус 3,8, нутро ≈ 3) без закрутки, з коротким спуском до мінімальної ніжки; крапка — кружок d 5,2. Мінімум 6 одиниць (STYLE, icon) у диск не влазить: крапка й нутро гачка дрібніші, це записано в STYLE. Бюджет висоти: гірчичний просвіт до обідка ≈ 1,85 згори (верх знака 8,5) і знизу (низ крапки 27,5), між ніжкою й крапкою — 1,5; коли не влазить, коротшає ніжка, а не просвіти (у раунді 1 знак торкався обідка — «тризуб»). Тінь base — лише вузький серп унизу диска, нижче крапки (від ≈ 28), тож темна крапка стоїть на чистому гірчичному. Гірчичний диск — носій сенсу «?» (art/STYLE.md, палітра): від плашки кількості «0» (чорнильний кружок) і від ✓ (зелений диск) бейдж відрізняє колір усього диска, а не лише гліф. У раунді 2 знак був паперовим у чорнильній облямівці й у 24 px злипався в бліду цятку; темний диск із «?» (раунд 3, варіант C) силуетом збігався з «0».
-->
