<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mark/ask — позначка «?» поверх іконки: гірчичний бейдж із чорнильним знаком питання в самому правому верхньому куті, обведений паперовим кільцем. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Потрібно це (§11.4). Бейдж — коло r 11,3 з центром (46,5; 17,5), контур 4 — разом із контуром край бейджа торкається поля 4…60 праворуч і згори; довкола — паперове кільце 3 (обтяте полем): воно відрізає бейдж від іконки під ним. Бейдж забрано в самий кут (було коло r 12,5 з центром (45,2; 18,8); кільце 3 замість 3,5), щоб він менше закривав базу: з-під нього видно кісточку страви, обидва вуха кота й порожні долоні. Менший бейдж «?» уже не читається: знак 5 завтовшки на всю висоту бейджа, з просвітом над крапкою, — це найменше коло, у якому він не злипається в 24 px.
-->
