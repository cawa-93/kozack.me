<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/mark/ask — позначка «?» поверх іконки: гірчичний бейдж із паперовим знаком питання в чорнильній облямівці (граматика галочки icon/mark/ok) у самому правому верхньому куті, обведений паперовим кільцем. Ревізія іконок 2026-11-03, раунд 2 (пачка r2-hands-ask), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Потрібно це (§11.4). Бейдж — коло r 11,3 з центром (46,5; 17,5), контур 4 — разом із контуром край бейджа торкається поля 4…60 праворуч і згори; довкола — паперове кільце 3 (обтяте полем): воно відрізає бейдж від іконки під ним. Положення й розмір — з раунду 1: з-під бейджа видно вуха кота, купку корму, кісточку страви. Знак — як галочка «✓» в icon/mark/ok: паперовий штрих 3,7 поверх чорнильної облямівки 7,4. Гачок — відкрита дуга ≈ ¾ кола (зовнішній діаметр 10,5) з короткою ніжкою донизу; крапка — окремий паперовий кружок 4,4 у тій самій облямівці, під ніжкою з просвітом. Гірчичний диск лишився: гірчичний — «?» (art/STYLE.md). У раунді 1 знак був чорнильним (5) і торкався чорнильного обідка згори й знизу, тож фігуру несли гірчичні просвіти: його читали «тризубом / Ψ / тюльпаном», а весь бейдж — монеткою.
-->
