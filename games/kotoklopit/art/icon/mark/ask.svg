<!-- icon/mark/ask — позначка «?» поверх іконки: гірчичний бейдж із чорнильним знаком питання в правому верхньому куті, обведений паперовим кільцем. Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Потрібно це (§11.4). Бейдж — коло r 12,5 з центром (45,2; 18,8), контур 4; довкола — паперове кільце 3,5 (обтяте полем 4…60): воно відрізає бейдж від іконки під ним. Знак — 5 завтовшки, на всю висоту бейджа.
-->
