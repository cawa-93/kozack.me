<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/alarm — будильник, що дзвенить: недосип (стан персонажа на панелі й у профілі телефона, §8.8).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
Червоний корпус (red) на двох ніжках, циферблат paper зі стрілками, два латунні дзвоники (mustard) і молоточок між ними, дуги дзвону обабіч.
Не сон (zz: літери «Z»), не «ще рано» (moon) і не виснаження (exhausted: обличчя з мішками під очима) — будильник, що підняв, не давши виспатися.
-->
<defs><clipPath id="icon-alarm-body"><circle cx="32" cy="36" r="17.5"/></clipPath></defs>
<g id="p-legs">
<path d="M21 50L16.5 56.5" fill="none" stroke="#2e1f29" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
