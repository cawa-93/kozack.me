<!-- icon/sterile-bin — бак корму для стерилізованих як річ, яку переставляють (§8.7, «Переставити річ»): синій пластиковий бак спереду-згори, зачинений світлою кришкою з навісом і виїмкою-ручкою; на лицьовій стінці — віконце рівня (знизу зелені палички корму, вище скло) і паперова етикетка з паличкою. Як env/sterile-bin у квартирі. Іконки сховищ (a27-storage-icons.ts), art/STYLE.md (іконки).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5).
На кнопці перестановки (що візьме персонаж) і як річ у руках. Від kibble-sterile (запас: відкритий високий бак, гірка паличок над краєм, совок, кришка набік) — кришка зачинена й ширша за бак, гірки й совка немає, корм видно лише у віконці; бак нижчий і ширший. Від bin-tipped — синій, стоїть, кришка на місці.
-->
