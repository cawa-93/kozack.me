<!-- icon/sulk — «Образливий» дметься: широкий кіт-буханець сидить спиною, голову задер і трохи відвернув — видно пухку щоку й примружене око, а збоку пихкають три сірі клубки «пф». Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Від sad (голова з вухами вниз і сльоза) і bored (буханець мордою до нас) — силуетом: широка спина, хвіст обвитий довкола, морди майже не видно.
-->
