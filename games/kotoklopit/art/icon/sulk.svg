<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/sulk — «Образливий» дметься: рудий кіт сидить спиною — потилиця, вуха ззаду без рожевого, вузькі плечі, хвіст обгорнутий довкола лап («замкнена» поза); праворуч надута щока трохи виступає за контур, а від неї вбік — великий паперовий клуб пари, як у 😤. Ревізія іконок 2026-11-03 (пачка b1-cat-faces-hiss), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Думка кота (GAME_DESIGN §11.4, «Образливість»). Морди не видно: ні ока, ні носа. Клуб пари ≈ 13 × 12, paper з контуром 4, горизонтально від щоки; дрібних кружечків біля голови немає (мова cough і sneeze). Від sad (обличчя зі сльозою), bored (профіль із вудочкою) і obese (кіт-кулька спереду) — кіт спиною.
-->
