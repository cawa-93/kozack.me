<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/sulk — «Образливий» дметься: рудий кіт сидить спиною — голова й плечі одним грушоподібним силуетом, вуха без рожевого (видно потилицю), голову задер і відвернув праворуч — видно надуту щоку із заплющеним оком, кирпатий ніс і вуса, а від носа пихкають три сірі клубки «пф»; хвіст лежить на підлозі вбік. Пакет A12a «Іконки II: кіт» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Як у грі: сидить спиною, видно потилицю, морди не видно — лише надуте личко збоку (GAME_DESIGN §11.4, «Образливість»). Тулуб, голова й хвіст — складена форма, плечі — внутрішня лінія. Від sad (голова з вухами вниз і сльоза) і bored (буханець мордою до нас) — спиною й щокою.
-->
