<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/toy-bell — міцна вудочка з дзвіночком (дорогий варіант): та сама пряма дерев'яна паличка навскіс і мотузка, що icon/toy, але на кінці мотузки замість китиці пір'я — великий гірчичний дзвіночок із язичком, над ним червоний бантик.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур дзвіночка й бантика — як у пір'я базової (3,5).
Біля назви дорогого варіанта «Вудочка» в магазині (VARIANT_ICONS, symbols.ts). Кінчик — сам дзвіночок, а не пір'я: інакше в 28 px вудочки не розрізнити. Бантик червоний, як пір'я дешевої, — та сама іграшка.
-->
