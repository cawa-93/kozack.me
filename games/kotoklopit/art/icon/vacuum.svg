<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/vacuum — вертикальний пилосос: річ у руках (itemIcon; рішення автора 2026-11-02, GAME_DESIGN §8.7 «Пилосос у руках»).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Той самий пилосос, що стоїть у квартирі (env/vacuum) і в руках (item/vacuum): широка сливова щітка внизу лежить рівно, над нею корпус із прозорим контейнером пилу (сірий пил на дні), сіра трубка й ручка-петля з темним хватом — нахилені праворуч на 24°, як коли пилосос штовхають.
Пакет «Арт пилососа», рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
-->
