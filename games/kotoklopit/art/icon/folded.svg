<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/folded — чистий одяг: розгорнута футболка того самого силуету, що icon/washed і icon/laundry, — чиста, синя (blue, плечі blueHi), рукави розведені, виріз коміра посередині вгорі — лежить на стосі з двох рівних складених шарів (enamelHi зверху, green знизу) з прямими кутами й тонким чорнильним швом між ними. Ревізія іконок 2026-11-03 (раунд 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур футболки 4,5, лінії 3; стос — контур 3, низ 4, шов 2,5: з LINE 6 шари по 6,8 заввишки зливались у чорний брусок.
Чистого одягу досить — прати нічого (відмова clothes-clean, завжди з ✓). Футболка в масштабі 0,7 ліворуч, стос під нею — ширина тулуба й ще по 2,5 з боків: урівень із тулубом шари читались продовженням футболки (довга смугаста сорочка). Правий верхній кут вільний під бейдж ✓. Знизу — зелений шар, без світлої смуги на всю ширину й без заокруглених країв: стос футболок збоку з такою смугою читали синім кросівком. Від washed — стос і ✓ замість крапель, від laundry — чистий синій колір без хвиль запаху.
-->
