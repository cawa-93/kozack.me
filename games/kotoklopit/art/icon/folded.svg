<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/folded — стос із трьох складених футболок того самого силуету, що washed і laundry: верхня (blueHi) — у плані, з круглим вирізом коміра посередині вгорі, лініями плечей і підгорнутими рукавами діагональними складками; під нею — зелена й світла (enamelHi), кожна виступає сходинкою в свій бік, зі складкою на краю. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Чистого одягу досить — прати нічого (відмова clothes-clean, завжди з ✓). Стос — складена форма: чорнильна підкладка (облямівка 4,5) під заливками, між футболками — лінії 3,5, тож тонкі шари не зливаються в чорнило. Стос унизу ліворуч — правий верхній кут вільний під бейдж ✓. Головна — верхня футболка з коміром; світла нижня — вузька смужка, а не широка (через широку світлу смугу стос був схожий на ліжко чи ноутбук). Без рук, шафи й «!». Не брудна (laundry), не мокра (washed), не сховище (no-room), не хребет (spine).
-->
