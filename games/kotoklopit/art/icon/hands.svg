<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hands — руки зайняті: велика розкрита долоня «✋» у синьому рукаві — та сама рука, що в hiss-hand; перекреслює її позначка «ні» (refusalBubble). Правка ділянки ui, коло 1 рецензії хвилі 3 (крок 16), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Руки зайняті» (GAME_DESIGN §11.4: «долоня, перекреслена») — найчастіша, тож силует — одна велика долоня, а не скринька в руках (коробку тримали так, що іконка читалася як box, no-room чи cat-box). Мазок «ні» — спільна позначка icon/mark/no, як в усіх перекреслених. Долоня — складена форма hiss-hand (шар чорнила під шаром фарби), рукав blue, як рука в attention й aloof. Від palms (дві долоні з «?» — потрібна річ у руках) — одна долоня й мазок «ні».
-->
