<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hands — руки зайняті: ті самі кисті-«рукавички» й сині рукави, що в icon/palms, «човником» тримають великий оберемок — гірчичну миску, на ній навскіс сливову коробочку з кришкою, а ліворуч — бірюзову пляшечку з паперовою етикеткою й червоною кришечкою. Ревізія іконок 2026-11-03, раунд 2 (пачка r2-hands-ask), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Руки зайняті» — завжди з ✗ (refusalBubble), найчастіша; сенс — «у руках уже повно». Головна форма — оберемок по центру, ≈ 60 % поля: три великі речі різного кольору й силуету виступають угору й убік за кисті; не коробка-пакунок (box) і не стос футболок (folded). Мазок «ні» ↗ іде через середину оберемку (коробочку): пляшечку видно над діагоналлю, миску — під нею. Руки — лише кисті й передпліччя знизу, ≈ 30 % площі; великі пальці лягають на миску; жодної долоні до глядача й розчепірених пальців: у раундах 0–1 перекреслені долоні читали «не чіпати, не гладити» (сенс cat-annoyed), а пальці-капсули — квіткою чи лапками. Пара до palms: там ті самі руки порожні, з пунктиром і «?».
-->
