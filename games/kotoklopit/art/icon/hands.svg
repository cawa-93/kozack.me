<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hands — руки зайняті: ті самі дві руки, що в icon/palms (пальці-капсули, сині рукави), але повні — знизу тримають оберемок: згорнутий сливовий рушник навскіс, за ним бірюзова пляшка й червоний м'ячик. Ревізія іконок 2026-11-03 (пачка b4), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Руки зайняті» — завжди з ✗ (refusalBubble), найчастіша. Пара до palms: там порожні руки з «?», тут повні руки з ✗. Оберемок — три різні за формою й кольором речі, що виступають над руками (не одна коробка — box, і не стос футболок — folded); руки — спереду, головна форма. Руки лежать обабіч діагоналі мазка «ні» ↗ — ліва вище й лівіше, права нижче й правіше, — а оберемок навскіс ↘, тож мазок перетинає оберемок, а не руки. Одна долоня «стоп» до глядача, як було, читалася «кіт не хоче пестощів».
-->
