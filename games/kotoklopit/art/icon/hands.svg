<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/hands — руки зайняті, «вежа валиться»: дві руки тримають з боків стос із двох картонних коробок, а третя, верхня, уже зісковзнула з нього ліворуч і падає (дві дуги руху). Ревізія іконок 2026-11-03, раунд 3, art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Відмова «Руки зайняті» — завжди з ✗ (mark/no). Сенс — «у руках уже повно, більше не влізе»: один силует «зависока купа в руках», а не набір різних речей (у раунді 2 миску, коробочку й пляшечку під мазком читали «заборонені речі / хімія»). Коробки однакові (картон, скотч cardboardLo, кришка cardboardHi), тож це одна купа; силует стосу — спільна чорнильна підкладка 7 (зовні ≈ 3,5 + лінія), між коробками — внутрішні лінії 3; адресної наліпки, як у box, немає. Середня коробка нахилена ↖ на 7°, і її правий нижній кут відстає від нижньої. Верхня коробка (16 × 9, навскіс на 20°) відокремлена від стосу просвітом ≈ 2 між чорнильними підкладками: коли вона лежала на стосі, у 24 px її читали відкинутою кришкою, і «падає» зникало. Мазок «ні» ↗ перетинає стос; падаюча коробка й дуги лишаються у вільному куті ліворуч-угорі. Кисті — «рукавички», як у palms: тильний бік за краєм коробки, три зімкнуті пальці на передній грані без щілин (лише дві короткі риски 2,5 між кінчиками), великий палець окремим шматком на кришці, сині рукави — у нижні кути. Ліва кисть на 3,5 вища за праву: хвіст мазка лягає на зап'ястя й рукав, а не на нижні пальці. Жодної долоні до глядача й пальця вгору («клас»). Від box — руки, нахил і падаюча коробка; від folded — картон і руки; від palms — повні руки й ✗.
Контур: коробки — підкладка 7 + 3, кришки 2,5; важкий низ 6, а не 8,5 — свідомо: стос тримають на руках, на підлогу він не спирається; кисті — підкладка 9 (облямівка 4,5, як у складених формах STYLE), великий палець — 2,5 всередині, риски 2,5; рукави 4; дуги 3,5.
-->
