size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Ящик wood із дощок (верхній край woodHi, шви — inner, сучки woodLo), кисті мовою hiss-hand (A12b) — пальці pinkHi на чорнильній підкладці лягають на лице ящика, великі пальці вгору, зап'ястки з-за країв полотна з боків — обійми, а не ніжки під ящиком. Не порожні долоні з «?» (palms) і не пакунок (box A11a — картонна коробка зі стрічкою й наліпкою, без рук).
Пакет A11b (хвиля 2 кроку 16), рука еталонів F1 icon/kibble і icon/heart (art/STYLE.md): контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
-->
