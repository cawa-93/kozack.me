телефона, §8.6).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів: один кадр у готових кольорах; контур 6 / важкий низ 8,5 / дрібне й лінії 3,5.
Скло glassHi з відблиском paper, людина blue, ручка mustard у чорнильній облямівці 9 навскіс донизу ліворуч.
Не відмова з вакансії (cv-rejected: аркуш резюме з червоним «✗») — силует лупи, без аркуша.
-->
