<!-- icon/kibble-pour — автогодівниця досипала: ліворуч за мискою стоїть автогодівниця (темна кришка з вогником, скляний бак із кормом, кремова основа), з її сірого носика над мискою струменем падають гранули в синю миску. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Корм стукає в миску — вголос над мискою (§8.7). Годівниця — як у світі (A5a item/feeder) і стоїть так само, за мискою; миска й гранули — еталона icon/kibble без зменшення.
Не icon/kibble (корм голодного кота: миска з купкою): тут годівниця й гранули в польоті.
-->
