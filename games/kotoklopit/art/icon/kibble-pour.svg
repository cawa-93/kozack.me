<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/kibble-pour — автогодівниця досипала корм: висока автогодівниця ліворуч (кремова кришка, широкий прозорий бак з великими бурими гранулами, кремова основа з похилим носиком праворуч), з носика дугою падають гранули в маленьку синю миску біля основи. Ревізія іконок 2026-11-03 (доручення автора: «зрозумілі для людини й розбірливі в малому масштабі»), art/STYLE.md (іконки, еталони F1 icon/kibble і icon/heart).
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах; контур — LINE (силует 6, низ 8,5, внутрішні 3,5). Гранули — облямівка 4,4 під фарбою.
Корм стукає в миску — вголос над мискою (§8.7), і річ магазину «Автогодівниця». Годівниця — як у світі (A5a item/feeder) і головний силует; миска мала й збоку, тож силует не «кораблик». Не icon/kibble (корм голодного кота: миска з купкою) і не фонтанчик fountain (блакитна вода, а не бурий корм); не поїлка water-bowl і не спрага drink.
-->
