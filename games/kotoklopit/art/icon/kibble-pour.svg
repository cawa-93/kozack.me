<!-- icon/kibble-pour — автогодівниця досипала: угорі лійка годівниці, з неї в синю миску падають гранули з рисочками падіння. Пакет A12b «Іконки II: ситуації, позначки, бульбашки, гліфи» (хвиля 2), art/STYLE.md.
size 64×64; pivot (32, 32) — центр; points: —. Без станів і шарів: один кадр у готових кольорах.
Корм стукає в миску — вголос над мискою (§8.7). Не icon/kibble (корм голодного кота: миска з купкою): тут вертикаль «лійка → гранули → миска».
-->
