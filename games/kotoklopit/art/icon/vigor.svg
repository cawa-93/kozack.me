<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- icon/vigor — «Бадьорість»: велика гірчична блискавка навскіс, обабіч — три короткі риски енергії. Персонаж сьогодні бадьорий і рухається швидше (DAY_MODIFIERS.md, MODIFIERS.vigor); стан персонажа на панелі й у профілі телефона (GAME_DESIGN §8.4).
size 64×64; pivot (32, 32) — центр; points — немає. Без станів і шарів.
Блискавка — mustard, низ вістря — тінь shade 0,3; контур 6, важкий низ — звужена заливка до 8,5 уздовж нижнього ребра. Риски — ink 3,5.
Не зірка підвищення (promotion), не трикутник із «!» (alert), не сіра перекреслена лампочка (no-power), не батарейка (battery-low) і не подушка з іскоркою (rested): зигзаг із гострим вістрям униз ліворуч.
-->
