<!-- mess/litter — розсипаний наповнювач (§9.12) довкола лотка: купка й гранули, що розкотилися.
size 56×32; pivot (28, 16) — точка підлоги під центром розсипу; points: —.
Без станів і шарів. Світла глина enamel / enamelHi; гранули — з контуром fine. Купка — дев'ять окремих гранул тієї самої
форми, горбом ззаду наперед, без спільного контуру й ліній поверх. Контур кожної в купці — штрих ink 3,4 під її заливкою:
серединою, як у розсипаних, він з'їдав би глину там, де гранули налягають одна на одну.
-->
