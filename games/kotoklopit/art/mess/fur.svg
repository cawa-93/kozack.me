<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 31" width="54" height="31">
<!-- mess/fur — шерсть на підлозі після вичісування чи бійки (§9.12): три клапті вичесаної шерсті купкою.
size 54×31; pivot (27, 16) — точка підлоги під центром клаптів; points: —.
Без станів і шарів. Та сама шерсть, що mess/fur-tuft (greyHi без кольору кота, S-лінзи ink під заливками, вільні волосини ink, волокна grey), але клапті різні. Дальній і передній ведуть волосся праворуч, лівий — ліворуч-униз, повернутий, а не віддзеркалений: дзеркальний утворює з дальнім симетричну V, крила метелика.
Кожен клапоть — свій шматок зі своїм контуром, ближчий лягає поверх дальнього. Падаюча тінь одна на всю купку: кілька окремих на перетинах темніли б.
-->
