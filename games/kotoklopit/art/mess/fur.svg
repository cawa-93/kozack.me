<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 31" width="54" height="31">
<!-- mess/fur — шерсть на підлозі після вичісування чи бійки (§9.12): три малі жмутики поруч.
size 54×31; pivot (27, 16) — точка підлоги під центром купки; points: —.
Без станів і шарів. Кожен жмутик — мініатюра mess/fur-tuft (≈ ×0,7) тією самою мовою: пасма greyHi без кольору кота, контур ≈ 2 зовні й тонший між пасмами, вільні волосини ink, волокна grey; будова й нахил у кожного свої. Жмутики окремі, не налягають, віялом в один бік; у кожного своя падаюча тінь.
Пастки цієї форми: пасма з однієї точки дають стрілку чи пташину лапу, пасма, видні на всю довжину, — листя, глуха маса з кількома кінцями — птаха, широкі смуги з паралельними боками, зубчасті кінці й викладка навхрест — подертий папір, круглі горбики — вату.
-->
