<!-- mess/dust/wall-y — смужка пилу вздовж плінтуса стіни, що йде вздовж осі y (стіна x = const: на екрані ліворуч-униз) (GAME_DESIGN §8.7, «Пил і павутина»): друге, куди йде пил; лише вигляд.
size 84×54; pivot (42, 29) — точка підлоги посередині смужки; points: —.
Без станів і шарів. Тонка наметена основа на ≈ 0,9 клітинки вздовж стіни (≈ 0,07 поперек) і чотири кошлаті грудки на
ній, один контур на всю смужку (ink 4,4 під заливками — видно 2,2). Середину смужки ставлять на ≈ 0,1 від лиця стіни
(плінтуса). Сірий grey, волокна-лінзи greyHi і greyLo, ворсинки inkSoft, передній край у тіні soft, падаюча тінь base.
Не дзеркало mess/dust/wall-x: грудки свої.
-->
