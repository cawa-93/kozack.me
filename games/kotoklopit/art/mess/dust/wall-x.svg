ній, один контур на всю смужку (ink 4,4 під заливками — видно 2,2). Середину смужки ставлять на ≈ 0,1 від лиця стіни
(плінтуса). Сірий grey, волокна-лінзи greyHi і greyLo, ворсинки inkSoft, передній край у тіні soft, падаюча тінь base.
