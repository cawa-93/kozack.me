<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 34" width="50" height="34">
<!-- mess/dust/floor — клубок пилу на відкритій підлозі (GAME_DESIGN §8.7, «Пил і павутина»): останнє, куди йде пил кімнати; безлад, дратує.
size 50×34; pivot (25, 22) — точка підлоги під центром клубка; points: —.
Стани a, b, c — три різні клубки для різних місць: a — пласкуватий кошлатий, b — великий і круглий малий поруч, із проміжком, c — витягнутий.
Пил — сірий grey і кошлатий: горбики з гострими ворсинками по краю,
волокна — лінзи greyHi (світлий верх) і greyLo, ворсинки назовні — лінзи inkSoft, низ у тіні soft; падаюча тінь base.
Контур — об'єднаний: ink 4,4 під заливками (видно 2,2, як у пуху mess/fur-tuft), тож горбики однієї грудки без ліній
усередині. Сіріший і кошлатіший за світлий пухкий жмут шерсті mess/fur-tuft (greyHi, круглі горбики, відблиск paper).
Шматки верхнього рівня зсунуті transform="translate(2 0)" (підгонка полотна під поле 4); pivot — у координатах полотна.
Без шарів.
-->
