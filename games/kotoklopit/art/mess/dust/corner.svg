<!-- mess/dust/corner — купка пилу на підлозі в куті кімнати (GAME_DESIGN §8.7, «Пил і павутина»): перше, куди йде пил; лише вигляд.
size 62×48; pivot (31, 32) — точка підлоги під центром купки (≈ 0,45 × 0,25 клітинки; у куті — на ≈ 0,25 від обох стін); points: —.
Без станів і шарів. Купа з трьох кошлатих горбиків одним контуром (ink 4,4 під заливками — видно 2,2): сірий grey,
волокна-лінзи greyHi і greyLo, ворсинки по краю й лінзи inkSoft назовні, низ у тіні soft, падаюча тінь base; загублена
червона нитка (red в обводці ink) ліворуч. Більша й купчастіша за клубок на підлозі (mess/dust/floor). Кругла, без бока
до стіни: годиться в будь-який кут.
-->
