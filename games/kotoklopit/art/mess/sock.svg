<!-- mess/sock — ваша шкарпетка (§9.12, «Подарунки й схованки»): біла (paper), синій манжет і смужки, червоні п'ятка й носок.
size 42×76; pivot (14, 44) — peek: точка підлоги за диваном (STASHES.sofa); carried: де кіт тримає манжет зубами (гніздо teeth); points: —.
Стани: st-peek — заткнута за спинку дивана манжетом донизу: над спинкою (60, на екрані ≈ 20 над pivot) визирають п'ятка й носок, решту закриває диван (шкарпетка в глибині під ним); st-carried — уся, звисає з рота манжетом догори, стопою праворуч (ліворуч — віддзеркалення з котом).
Шматки верхнього рівня зсунуті transform="translate(-1 0)" (підгонка полотна під поле 4); pivot і points — у координатах полотна.
-->
