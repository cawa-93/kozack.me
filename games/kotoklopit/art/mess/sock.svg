<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 55" width="50" height="55">
<!-- mess/sock — ваша шкарпетка (§9.12, «Подарунки й схованки»): біла (paper), синій манжет і смужки, червоні п'ятка й носок.
size 50×55; pivot (23, 23) — peek: точка підлоги за диваном (STASHES.sofa); carried: де кіт тримає манжет зубами (гніздо teeth); points: —.
Стани: st-peek — лежить пласко під диваном (у глибині — під ним): манжет і халява під сидінням, з-під переднього краю сидіння (диван спинкою до камери; край сидіння на екрані ≈ 6 нижче pivot) визирають п'ятка й носок; st-carried — уся, звисає з рота манжетом догори, стопою праворуч (ліворуч — віддзеркалення з котом).
Шматки верхнього рівня зсунуті transform="translate(8 -21)" (підгонка полотна під поле 4); pivot і points — у координатах полотна.
-->
