<!-- mess/puddle — калюжа від перекинутої миски з водою (§9.12, «Пиття»): блакитна, широка, нерівними лопатями, зі стоком праворуч і двома бризками.
size 76×32; pivot (38, 16) — точка підлоги під центром калюжі; points: —.
Без станів і шарів. Без чорного контуру: вода tealHi (сім'я води в мисці), край inkSoft 2, косі відблиски glassHi.
Лопаті — на сторонах, бризки — у затоках на місці кутів, і їх лише два: чотири кути з краплею на кожному читаються пакетом чи подушкою.
-->
