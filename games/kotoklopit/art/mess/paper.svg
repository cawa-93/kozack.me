<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50" width="120" height="50">
<!-- mess/paper — паперовий слід (§9.12, «Мисливський інстинкт»): біла стрічка туалетного паперу петлями, кінець зіжмаканий у клубок. Стрічка «приходить» згори праворуч — від рулону у ванній (env/toilet-roll, unrolled) — і лягає петлями в бік вітальні (PAPER_TRAIL).
size 120×50; pivot (60, 29) — точка підлоги під серединою сліду; points: —.
Без станів і шарів. Стрічка — штрих ink 7,2 і поверх paper 3,6 (краї стрічки — контур 1,8, як у скелета); на перетинах пізніша ділянка лягла зверху — її повторено поверх (стик невидимий: linecap butt).
Шматки верхнього рівня зсунуті transform="translate(-1 0)" (підгонка полотна під поле 4); pivot і points — у координатах полотна.
-->
