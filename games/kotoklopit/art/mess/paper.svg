<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 50" width="120" height="50">
<!-- mess/paper — паперовий слід (§9.12, «Мисливський інстинкт»): туалетний папір, який кіт розмотав від рулону у ванній (env/toilet-roll, unrolled) аж у вітальню. Стрічка приходить згори праворуч рваним навскіс кінцем і закінчується зім'ятим клубком ліворуч унизу (PAPER_TRAIL).
size 120×50; pivot (60, 29) — точка підлоги під серединою сліду; points: —.
Без станів і шарів. Стрічка — пласка смуга заввишки ≈ 11 із заливних панелей: три лицем угору й між ними дві Z-складки, де видно темніший зворот (enamelLo під тінню soft); кожна наступна панель лежить поверх попередньої. Контур стрічки — LINE_RIG.inner: папір тонкий, а з outer смуга вужчає й знову читається шнуром. Перфорація — поперечні рисочки inkSoft через рівні проміжки, як на хвостику env/toilet-roll.
Клубок — кутастий ком із контуром LINE_RIG.outer, заломи — inkSoft (чорнилом він читається тріснутим каменем); стрічка заходить під нього збоку.
-->
