<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 216" width="104" height="216">
<!-- mess/cobweb — павутина вгорі в задньому куті кімнати (GAME_DESIGN §8.7, «Пил і павутина»): з першим пилом у кутку; лише вигляд.
size 104×216; pivot (52, 210) — точка підлоги в куті (room.x, room.y) під павутиною; сама павутина на z ≈ 150–197,
під кришкою задньої стіни (200); points: —.
Стани — які стіни в куті високі (cobwebState у src/view/art/manifest/a20-dust.ts):
  corner — обидві задні стіни на повну висоту (спальня, (1, 1)): віяло на обидві стіни, промінь — по лінії кута;
  wall-x — висока лише стіна y = 0 праворуч від кута, внутрішня ліворуч — 66 (кухня (13, 1); ванна (12, 1) — віддзеркалено
    довкола pivot, cobwebLook): чверть павутини на лиці стіни y = 0, вершина — над лінією кута; нижча (z ≈ 163–197), щоб її
    було видно над душовою кабіною (170) і холодильником (150);
  wall-y — висока лише стіна x = 0 ліворуч, стіна ряду 5 праворуч — 66 (вітальня (1, 6)): чверть на лиці x = 0.
У wall-x і wall-y лінія кута лежить посеред рівної стіни, тож вільний бік без рами: крайній промінь нахилено на 10–15° до тіла
павутини (не за лінію кута: у ванній там уже стіна кухні), а кільця закінчуються на різній відстані — на ньому, за ним чи не
дійшовши, тому вільні кінці.
Промені від вершини кута й провислі кільця в площині стіни; нитка — paper в обводці ink (каркас 2,4 / 4,2, решта 2 / 3,6),
тож читається і на шпалерах, і на кремовій фарбі ванної. На нитці висить кошлата грудочка пилу (історія; той самий пил,
що mess/dust/*). Без шарів.
-->
