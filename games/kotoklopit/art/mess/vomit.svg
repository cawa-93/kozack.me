size 56×27; pivot (28, 13) — точка підлоги під центром плями; points: —.
Без станів і шарів. Як калюжа: без чорного контуру — cardboardHi, край inkSoft 2, відблиск-лінза enamelHi; гранули kibble з відблиском kibbleHi і падаючою тінню shade 0,3.
Край дрібними горбиками, без вершин; гранули різного розміру, купкою збоку від центру: рівні кружальця на плямі з вершиною читаються піцою, а темний овал під ними — жовтком.
-->
