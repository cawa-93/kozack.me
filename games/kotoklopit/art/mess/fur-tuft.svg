<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 26" width="38" height="26">
<!-- mess/fur-tuft — жмут шерсті на підлозі (§8.7, FUR_SPOTS): від межі шерсті 50 — від 6 до 12 таких у кімнатах, у кожній точці той самий кадр.
size 38×26; pivot (19, 15) — точка підлоги під центром жмута; points: —.
Без станів і шарів. Вичесаний жмутик лінивою тильдою: світлі пасма greyHi без кольору кота, усі в один бік вигину; розходяться віялом праворуч і двома кінцями ліворуч, між кінцями видно підлогу.
Кожне пасмо — чорнильна форма під заливкою, усі чорнила перед усіма заливками: силует один. Контур іде паралельно заливці й сходиться до гострого кінчика на останній п'ятій частині пасма: зовні ≈ 2, як у пилу й паперу, бо тонший зникає на світлій плитці; між пасмами ≈ 1, бо товстіший забиває просвіти. Звичайний штрих не годиться: його круглі кінці затуплюють кінчики.
Вільні волосини — тонкі лінзи ink вздовж потоку, ніколи не парами вгорі; усередині — лише лінзи grey уздовж волосин. Горбиків, відблиску й тіні soft немає: з ними це вата.
-->
