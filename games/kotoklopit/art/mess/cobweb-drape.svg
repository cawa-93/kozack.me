<!-- mess/cobweb-drape — павутина, що звисає з верху речі, яку давно не брали (фото титрів §4.2 GAME_DESIGN.md: переноска, «Витривалість +»; src/view/art/manifest/a28-photo-props.ts).
size 84×56; pivot (42, 6) — середина верхнього краю, де павутина чіпляється за річ; points: —.
Без станів і шарів. Манера mess/cobweb: нитка paper в обводці ink (каркас — крайні промені вздовж краю речі й нижнє кільце — 2,4 / 4,2, решта 2 / 3,6).
Пів-павутини: центр на краї речі, сім променів звисають віялом, три кільця провисають до центру; середнє кільце праворуч розірване
й висить вільним кінцем, з нижнього кільця звисає нитка з кошлатою грудочкою пилу (історія; той самий пил, що mess/dust/*).
-->
