<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 39" width="60" height="39">
<!-- mess/hairball — шерстяна грудка, яку кіт зригнув (§9.12, «Шерстяні грудки»): мокрий короткий валик шерсті, з-під якого витікає мала пляма; слизька, прибирається лише руками.
size 60×39; pivot (30, 21) — точка підлоги під центром валика; points: —.
Без станів і шарів. Шматки: p-wet — пляма мовою калюж і mess/mark (tealHi, край inkSoft 2, відблиск-лінза glassHi): нерівні лопаті, затоки, краплі збоку від довгої осі; не концентрична з валиком, частина валика лежить на сухому. p-shadow — падаюча тінь base під самим силуетом, уже на плямі. p-ball — валик.
Валик товстий, прямий, трохи навскіс, боки паралельні, низ опуклий, кінці заокруглені; на кожному кінці одне коротке м'яке пасмо трохи вище осі (на нижньому закругленні воно робить низ рівною хордою, і валик стає вареником); контур штрихом під заливками (ink 4,4 — видно 2,2), без важкого низу.
Ковролін carpet — сірувато-бежевий, без кольору кота, темніший за жмут mess/fur-tuft; волокна вздовж валика — лінзи carpetHi і carpetLo зі зсувом, без серединної лінії; низ у тіні soft; один мокрий відблиск glassHi.
-->
