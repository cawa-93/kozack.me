<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 39" width="60" height="39">
<!-- mess/hairball — шерстяна грудка, яку кіт зригнув (§9.12, «Шерстяні грудки»): скуйовджений клубок волосся, як вийнятий зі зливу, поруч мала мокра пляма. Слизька, прибирається лише руками.
size 60×39; pivot (30, 21) — точка підлоги під клубком; points: —.
Без станів і шарів. Шматки: p-wet — пляма мовою калюж і mess/mark (tealHi, край inkSoft 2, відблиск-лінза glassHi): нерівні лопаті, затоки, краплі збоку від довгої осі; клубок зсунутий ліворуч-угору, тож частина його на сухому, а права лопать на видноті. p-shadow — падаюча тінь base, уже на плямі. p-hairs — вільні хвилясті волосини (лінзи ink) навсібіч, без пар. p-under — підкладка dark під пасмами, її край ховається під ними. p-ball — вісім вигнутих пасом.
Пасмо загострене з обох кінців, кожне зі своїм контуром (заливка ink під заливкою), тож перетини видно. Далекі dark, середні greyLo, два blueLo — холод, який теплі лампи не роблять рудим. Порядок перемішаний: петля лягає під пасма, що йдуть далі, інакше шари читаються стопкою. Підкладка закриває великі просвіти: підлога крізь них перетворює клубок на кільця дроту чи гніздо. Лишаються мала щілина ліворуч і просвіт на пляму праворуч: один мигдалик посередині читається оком. На шерсті відблиску немає: мокре каже пляма.
-->
