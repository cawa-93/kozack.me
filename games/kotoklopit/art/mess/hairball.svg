<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 39" width="60" height="39">
<!-- mess/hairball — шерстяна грудка, яку кіт зригнув (§9.12, «Шерстяні грудки»): мокрий короткий валик шерсті в малій плямі; слизька, прибирається лише руками.
size 60×39; pivot (30, 21) — точка підлоги під центром валика; points: —.
Без станів і шарів. Шматки: p-wet — пляма мовою калюж (tealHi, край inkSoft 2, відблиск-лінза glassHi), p-shadow — падаюча тінь base уже на плямі, p-ball — валик.
Валик товстий, трохи вигнутий, навскіс; кінці заокруглені, у м'яких пасмах, закручених у різні боки (не парами вгорі); контур штрихом під заливками (ink 4,4 — видно 2,2), без важкого низу.
Ковролін carpet — сірувато-бежевий, без кольору кота, темніший за жмут mess/fur-tuft; пасма вздовж вигину — лінзи carpetHi і carpetLo зі зсувом, без серединної лінії; низ у тіні soft; один мокрий відблиск glassHi.
-->
