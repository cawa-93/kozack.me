<!-- mess/garbage — сміття з перекинутого смітника (§9.12, «Кмітливість у бешкеті»): риб'ячий скелетик (кіт знайшов, що шукав), огризок зеленого яблука, червона обгортка.
size 80×44; pivot (40, 29) — точка підлоги під центром купки; points: —.
Без станів і шарів. Кожна річ — зі своєю тінню й повним контуром; кістки й хвостик — подвійним штрихом (ink 7,2 і paper поверх); без гнилого й мух.
